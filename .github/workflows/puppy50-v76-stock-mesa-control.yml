name: Puppy50 v76 - Stock Mesa package-integrity control in real KVM
on:
  push:
    branches: [puppy50-v76-stock-mesa-control]
    paths:
      - 'web76/**'
      - '.github/workflows/puppy50-v76-stock-mesa-control.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: puppy50-v76-stock-mesa-control
  cancel-in-progress: true
jobs:
  build_audited_stock_control:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - name: Unit-test safe disposable-root cleanup and ISO control checks
        run: |
          set -euo pipefail
          python3 -m unittest discover -s web76/tests -p 'test_*.py' -v
          python3 -m unittest discover -s web73/tests -p 'test_*.py' -v
          python3 -m py_compile web76/clean_stock_control.py web76/qemu_stock_mesa_smoke.py web73/audit_apk_root.py
          mkdir -p dist output/reports output/extract output/verify output/evidence/ram_1024MiB
      - name: Install disposable ISO assembly and QEMU/KVM verification tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends p7zip-full squashfs-tools xorriso qemu-system-x86
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          docker --version
      - name: Retrieve byte-identical current v70 public ISO
        uses: actions/download-artifact@v4
        with:
          name: Puppy50_v70_QEMU_NORMAL_BROWSER_ISO
          run-id: 41660921113
          github-token: ${{ github.token }}
          path: dist
      - name: SHA check and unpack released root, keeping original ISO immutable
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          7z e -y -ooutput/extract dist/Puppy50_Web_v70_Normal_Browser_Online.iso \
            puppy_dpupbw64_10.0.12.sfs vmlinuz initrd.gz \
            > output/reports/v70-extraction.txt
          test -s output/extract/puppy_dpupbw64_10.0.12.sfs
          sudo unsquashfs -d output/rootfs output/extract/puppy_dpupbw64_10.0.12.sfs > output/reports/unsquashfs.log
          sudo python3 web73/audit_apk_root.py output/rootfs --out output/reports/v70_baseline_package_integrity.json
          python3 - <<'PY'
          import json
          x=json.load(open("output/reports/v70_baseline_package_integrity.json"))
          assert x["owned_shared_libraries_sha1_mismatched"]==8
          assert x["shared_library_files_without_apk_owner"]==5
          assert x["apk_package_records"]==247
          print("PUPPY50_V76_STOCK_CONTROL_BASELINE_MATCHES_AUDITED_PUBLIC_V70")
          PY
      - name: Restore STOCK Alpine Mesa using the actual APK package manager in disposable root
        timeout-minutes: 8
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work alpine:3.24 sh -euc '
            ROOT=/work/output/rootfs
            apk --root "$ROOT" --arch x86_64 --no-cache --no-progress \
              fix --reinstall mesa mesa-dri-gallium mesa-egl mesa-gbm mesa-gl mesa-gles \
              > /work/output/reports/stock-mesa-apk-fix.log 2>&1 || {
                tail -80 /work/output/reports/stock-mesa-apk-fix.log
                exit 12
              }
            echo "PUPPY50_V76_STOCK_MESA_APK_REINSTALL_REQUESTED=PASS"
            apk --root "$ROOT" info -v > /work/output/reports/stock-installed-packages.txt
          '
          sudo python3 web76/clean_stock_control.py output/rootfs --out output/reports/stock-control-alias-cleanup.json
          sudo python3 web73/audit_apk_root.py output/rootfs --out output/reports/stock-control-APK-coherency.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          x=json.loads(Path("output/reports/stock-control-APK-coherency.json").read_text())
          print("PUPPY50_V76_STOCK_CONTROL_REMAINING_MESA_MISMATCHES=",x["owned_shared_libraries_sha1_mismatched"])
          print("PUPPY50_V76_STOCK_CONTROL_UNOWNED_LIBRARIES=",x["shared_library_files_without_apk_owner"])
          if x["owned_shared_libraries_sha1_mismatched"]!=0:
              raise SystemExit("FAIL_CLOSED: stock package reinstall left library digest mismatches")
          if x["shared_library_files_without_apk_owner"]!=0:
              raise SystemExit("FAIL_CLOSED: unowned library aliases remain")
          if x["apk_package_records"]<247:
              raise SystemExit("FAIL_CLOSED: package inventory unexpectedly shrank")
          print("PUPPY50_V76_STOCK_MESA_OWNER_AND_DIGEST_COHERENCE_PASS")
          PY
      - name: Assemble separate candidate ISO (never overwrite the user's existing online image)
        timeout-minutes: 7
        run: |
          set -euo pipefail
          sudo mksquashfs output/rootfs output/stock-control-root.sfs \
            -comp xz -b 1M -Xbcj x86 -processors 2 -mem 1024M \
            -exit-on-error -noappend -no-progress \
            > output/reports/stock-squashfs.log 2>&1
          xorriso -indev dist/Puppy50_Web_v70_Normal_Browser_Online.iso \
            -outdev dist/Puppy50_v76_Stock_Mesa_QEMU_Control_EXPERIMENTAL.iso \
            -map output/stock-control-root.sfs /puppy_dpupbw64_10.0.12.sfs \
            -boot_image any replay -commit -end \
            > output/reports/xorriso.log 2>&1
          7z e -y -ooutput/verify dist/Puppy50_v76_Stock_Mesa_QEMU_Control_EXPERIMENTAL.iso \
            puppy_dpupbw64_10.0.12.sfs vmlinuz initrd.gz > output/reports/new-extraction.log
          cmp output/extract/vmlinuz output/verify/vmlinuz
          cmp output/extract/initrd.gz output/verify/initrd.gz
          cmp output/stock-control-root.sfs output/verify/puppy_dpupbw64_10.0.12.sfs
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          old=Path("dist/Puppy50_Web_v70_Normal_Browser_Online.iso")
          new=Path("dist/Puppy50_v76_Stock_Mesa_QEMU_Control_EXPERIMENTAL.iso")
          r={"schema":"PUPPY50_V76_STOCK_PACKAGE_CONTROL",
             "original_v70_ISO_bytes":old.stat().st_size,
             "stock_mesa_control_ISO_bytes":new.stat().st_size,
             "size_ratio":round(new.stat().st_size/old.stat().st_size,5),
             "stock_mesa_control_sha256":hashlib.sha256(new.read_bytes()).hexdigest(),
             "boot_kernel_and_initrd_identical":True,
             "package_ownership_and_digests_coherent":True,
             "full_CVE_and_browser_sandbox_verified":False,
             "physical_any_network_compatibility_proven":False,
             "KVM_website_functional":False}
          Path("output/reports/V76_ISO_CONTROL_COMPARISON.json").write_text(json.dumps(r,indent=2)+"\n")
          print(json.dumps(r,indent=2))
          PY
          (cd dist && sha256sum Puppy50_v76_Stock_Mesa_QEMU_Control_EXPERIMENTAL.iso > STOCK_CONTROL_SHA256SUMS)
      - name: Save strictly experimental ISO to CI artifacts only
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50_v76_UNVERIFIED_stock_Mesa_APK_coherent_QEMU_ISO
          path: |
            dist/Puppy50_v76_Stock_Mesa_QEMU_Control_EXPERIMENTAL.iso
            dist/STOCK_CONTROL_SHA256SUMS
            output/reports/V76_ISO_CONTROL_COMPARISON.json
          retention-days: 7
          if-no-files-found: error
      - name: Test Firefox, RAM-only boot and external Wikipedia with unmodified guest networking
        timeout-minutes: 7
        run: |
          set -euo pipefail
          nohup python3 -u web66/host_https_bridge.py --port 3128 > output/reports/host-bridge.log 2>&1 < /dev/null &
          python3 - <<'PY'
          import socket,time
          for _ in range(40):
              try:
                  with socket.create_connection(("127.0.0.1",3128),timeout=.5):
                      print("PUPPY50_V76_HOST_BRIDGE_READY");break
              except OSError:time.sleep(.2)
          else:raise SystemExit("Host bridge missing")
          PY
          python3 web76/qemu_stock_mesa_smoke.py \
            --iso dist/Puppy50_v76_Stock_Mesa_QEMU_Control_EXPERIMENTAL.iso \
            --out output/evidence/ram_1024MiB --ram 1024 --seconds 285
      - name: Preserve real KVM screenshots and full package test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50_v76_stock_Mesa_real_KVM_and_package_audit
          path: |
            output/evidence/
            output/reports/
          retention-days: 14
          if-no-files-found: warn
      - name: Fail closed unless guest booted, got trusted HTTPS and displayed external page transition
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path("output/evidence/ram_1024MiB/result.json")
          if not p.exists():raise SystemExit("V76_KVM_NOT_RUN")
          r=json.loads(p.read_text())
          for key in ("ram_root_copy","ram_root_switch","ejected","xorg_started",
                      "firefox_launch_requested","guest_DHCP","guest_DNS",
                      "guest_public_CA_verified_HTTPS","actual_user_homepage_visibly_rendered",
                      "real_qemu_browser_link_click_submitted"):
              if r.get(key) is not True:raise SystemExit("V76_MISSING_PROOF "+key)
          if not (r.get("Wikipedia_link_pixel_transition") or {}).get("homepage_color_disappeared"):
              raise SystemExit("V76_NO_EXTERNAL_BROWSER_TRANSITION")
          print("PUPPY50_V76_STOCK_APK_COHERENCE_AND_KVM_WEBPAGE_TRANSITION_PASS")
          print("Real webpage content still requires human review. This is not a public release.")
          PY
