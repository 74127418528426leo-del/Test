name: Puppy50 v106 guarded automatic boot image
on:
  push:
    branches: [puppy50-v105-fast-boot]
    paths: [.github/workflows/puppy50-v106-build.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install ISO tools and validate guard logic
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso squashfs-tools
          mkdir -p input out/{root,reports,cfg,verify}
          python3 -m unittest discover -s web105 -p test_proxy_guard.py -v
          python3 -m unittest discover -s web105 -p test_boot_menu.py -v
      - name: Retrieve exact automatic-boot image
        uses: actions/download-artifact@v4
        with:
          name: Puppy50-v105-autoboot-test-only
          run-id: 42330235182
          github-token: ${{ github.token }}
          path: input
      - name: Pin input and check RAM-only default entries
        run: |
          set -euo pipefail
          iso=input/Puppy50_v105_Autoboot_TEST_ONLY.iso
          printf '%s  %s\n' 'b209d42bef6f69317b440d46608f4b3c88508c9e6cd6577d9cfd14e0dddea5c9' "$iso" | sha256sum -c -
          xorriso -osirrox on -indev "$iso" -extract /live/filesystem.squashfs out/base.squashfs -extract /isolinux/isolinux.cfg out/cfg/isolinux.cfg -extract /isolinux/live.cfg out/cfg/live.cfg -extract /boot/grub/config.cfg out/cfg/grub-config.cfg -extract /boot/grub/grub.cfg out/cfg/grub.cfg >out/reports/extract.log 2>&1
          grep -Fx 'timeout 20' out/cfg/isolinux.cfg
          grep -Fx 'set timeout=2' out/cfg/grub-config.cfg
          grep -F 'append boot=live components toram ' out/cfg/live.cfg
          grep -F 'boot=live components toram ' out/cfg/grub.cfg
          sudo unsquashfs -d out/root out/base.squashfs >out/reports/unsquashfs.log
          test -x out/root/usr/bin/systemd-detect-virt
      - name: Record protected application and firmware hashes
        run: |
          set -euo pipefail
          sudo bash -c 'cd out/root && sha256sum usr/lib/firefox-esr/firefox-esr usr/lib/firefox-esr/libxul.so usr/bin/nmcli usr/sbin/NetworkManager etc/ssl/certs/ca-certificates.crt' >out/reports/protected-before.sha256
          sudo bash -c 'cd out/root && find usr/lib/firmware -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum' >out/reports/firmware-before.sha256
          sudo bash -c 'cd out/root && find usr/lib/firmware -type l -printf "%p -> %l\n" | LC_ALL=C sort' >out/reports/firmware-links-before.txt
          sudo cp out/root/usr/local/sbin/puppy50-network-probe out/reports/network-probe-before
      - name: Guard only the optional test bridge
        run: |
          set -euo pipefail
          sudo python3 web105/proxy_guard.py out/root | tee out/reports/proxy-guard.json
          sudo cp out/root/usr/local/sbin/puppy50-network-probe out/reports/network-probe-after
          sh -n out/root/usr/local/sbin/puppy50-network-probe
          sh -n out/root/usr/local/sbin/puppy50-qemu-bridge-allowed
          sudo bash -c 'cd out/root && sha256sum usr/lib/firefox-esr/firefox-esr usr/lib/firefox-esr/libxul.so usr/bin/nmcli usr/sbin/NetworkManager etc/ssl/certs/ca-certificates.crt' >out/reports/protected-after.sha256
          sudo bash -c 'cd out/root && find usr/lib/firmware -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum' >out/reports/firmware-after.sha256
          sudo bash -c 'cd out/root && find usr/lib/firmware -type l -printf "%p -> %l\n" | LC_ALL=C sort' >out/reports/firmware-links-after.txt
          cmp out/reports/protected-before.sha256 out/reports/protected-after.sha256
          cmp out/reports/firmware-before.sha256 out/reports/firmware-after.sha256
          cmp out/reports/firmware-links-before.txt out/reports/firmware-links-after.txt
      - name: Build guarded experimental ISO
        timeout-minutes: 16
        run: |
          set -euo pipefail
          sudo mksquashfs out/root out/new.squashfs -one-file-system -comp xz -b 1M -processors 3 -mem 2048M -noappend -no-progress -exit-on-error >out/reports/compress.log 2>&1
          xorriso -indev input/Puppy50_v105_Autoboot_TEST_ONLY.iso -outdev out/Puppy50_v106_AutoBoot_TEST_ONLY.iso -map out/new.squashfs /live/filesystem.squashfs -boot_image any replay -commit -end >out/reports/repack.log 2>&1
          xorriso -osirrox on -indev out/Puppy50_v106_AutoBoot_TEST_ONLY.iso -extract /live/filesystem.squashfs out/verify/filesystem.squashfs -extract /isolinux/isolinux.cfg out/verify/isolinux.cfg -extract /isolinux/live.cfg out/verify/live.cfg -extract /boot/grub/config.cfg out/verify/grub-config.cfg -extract /boot/grub/grub.cfg out/verify/grub.cfg >out/reports/reextract.log 2>&1
          cmp out/new.squashfs out/verify/filesystem.squashfs
          for f in isolinux.cfg live.cfg grub-config.cfg grub.cfg; do cmp "out/cfg/$f" "out/verify/$f"; done
          xorriso -indev out/Puppy50_v106_AutoBoot_TEST_ONLY.iso -report_el_torito plain >out/reports/el-torito.txt 2>&1
          stat -c '%s' out/new.squashfs >out/reports/root-bytes.txt
          (cd out && sha256sum Puppy50_v106_AutoBoot_TEST_ONLY.iso >SHA256SUMS)
          cat out/SHA256SUMS
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50-v106-build-audit
          path: |
            out/reports/
            out/cfg/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload test-only image
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50-v106-guarded-test-only
          path: |
            out/Puppy50_v106_AutoBoot_TEST_ONLY.iso
            out/SHA256SUMS
          compression-level: 0
          retention-days: 7
