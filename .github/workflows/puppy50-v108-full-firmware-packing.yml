name: Puppy50 v108 full firmware shared window study
on:
  push:
    branches: [puppy50-v108-architecture]
    paths: [.github/workflows/puppy50-v108-full-firmware-packing.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        window: [23, 27]
    steps:
      - name: Install tools and extract the published baseline
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso squashfs-tools zstd rsync time acl
          mkdir -p input out/{root,restore,reports}
          curl --fail --location --retry 3 -o input/v107.iso 'https://github.com/74127418528426leo-del/Test/releases/download/puppy50-v107-zstd-fastboot-experimental/Puppy50_v107_FastBoot_EXPERIMENTAL.iso'
          printf '%s  %s\n' 'cbdf605f87d345ca60d1a0a3cebb20312864c81c2a286c8eacb5acb85769c0c2' input/v107.iso | sha256sum -c -
          xorriso -osirrox on -indev input/v107.iso -extract /live/filesystem.squashfs input/root.squashfs >out/reports/extract.log 2>&1
          sudo unsquashfs -d out/root input/root.squashfs >out/reports/unsquash.log
      - name: Pack and restore the complete firmware tree without deleting entries
        env:
          WINDOW: ${{ matrix.window }}
        run: |
          set -euo pipefail
          sudo du -sb out/root/usr/lib/firmware | tee out/reports/uncompressed.txt
          /usr/bin/time -v -o out/reports/compress-time.txt bash -o pipefail -c 'sudo tar --xattrs --acls --numeric-owner -C out/root/usr/lib -cf - firmware | zstd -q -12 --long="$WINDOW" -T3 -o out/firmware.tar.zst'
          /usr/bin/time -v -o out/reports/restore-time.txt bash -o pipefail -c 'zstd -q -dc --long="$WINDOW" out/firmware.tar.zst | sudo tar --xattrs --acls --numeric-owner -C out/restore -xf -'
          sudo rsync -aHAXnci --delete --numeric-ids out/root/usr/lib/firmware/ out/restore/firmware/ >out/reports/differences-forward.txt
          sudo rsync -aHAXnci --delete --numeric-ids out/restore/firmware/ out/root/usr/lib/firmware/ >out/reports/differences-reverse.txt
          test ! -s out/reports/differences-forward.txt
          test ! -s out/reports/differences-reverse.txt
          stat -c '%n %s' out/firmware.tar.zst | tee out/reports/archive-size.txt
          cat out/reports/compress-time.txt out/reports/restore-time.txt
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50-v108-full-firmware-window-${{ matrix.window }}
          path: out/reports/
          if-no-files-found: warn
          retention-days: 30
