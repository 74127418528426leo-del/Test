name: Puppy50 v97 - Modern JavaScript WPE WebKit 2.54 headless memory proof
on:
  push:
    branches: [puppy50-v97-modern-js-wpeplatform-headless]
    paths:
      - 'web97/**'
      - '.github/workflows/puppy50-v97-modern-js-wpe.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: puppy50-v97-wpe-modernjs
  cancel-in-progress: true
jobs:
  wpe_modern_js:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    container: debian:forky
    steps:
      - uses: actions/checkout@v4
      - name: Install modern WPEPlatform 2.54 from official Debian forky packages
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends gcc pkg-config make \
            libwpewebkit-2.0-dev libjavascriptcoregtk-6.0-dev \
            python3 ca-certificates curl procps util-linux dbus-x11 dbus-user-session
          useradd -m -u 1550 -s /bin/sh p50
          mkdir -p /tmp/p50-runtime results
          chmod 0700 /tmp/p50-runtime
          chown p50:p50 /tmp/p50-runtime
          PYTHONPATH=web97 python3 -m unittest discover -s web97/tests -p 'test_*.py' -v
          pkg-config --modversion wpe-webkit-2.0 | tee results/wpe-version.txt
          dpkg-query -W -f='${binary:Package} ${Version}\n' libwpewebkit-2.0-1 > results/package-versions.txt
          pkg-config --cflags --libs wpe-webkit-2.0 javascriptcoregtk-6.0 >results/pkg-flags.txt
      - name: Build minimal real WPE WebKit browser, no unsafe flags
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=gnu11 -Wall -Wextra -O2 web97/wpe_modern_js_headless.c \
            -o /usr/local/bin/p50-wpeprobe \
            $(pkg-config --cflags --libs wpe-webkit-2.0 javascriptcoregtk-6.0)
          test -x /usr/local/bin/p50-wpeprobe
          sha256sum /usr/local/bin/p50-wpeprobe >results/wpe-binary-sha256.txt
      - name: Run local fixture HTTP server and confirm content without external dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory web96/fixtures >results/fixture-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/03-modern.html | grep -Fq ES2015_EXECUTED
          echo REAL_WPE_FIXTURE_HOST=READY
      - name: Actual unprivileged headless WPE WebKit modern-JS DOM execution and PSS
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 -u web97/wpe_probe.py --out results \
            --url http://127.0.0.1:8765/03-modern.html \
            --seconds 25 | tee results/summary.log
      - name: Save actual WPE runtime output, PSS data and binary inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50_v97_Actual_WPE_2_54_Modern_JS_Headless_PSS
          path: results/
          retention-days: 25
          if-no-files-found: warn
      - name: Do not confuse headless engine runtime with real full OS or GUI
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('results/result.json'))
          assert d['modern_js_and_dom_ran'] is True
          assert d['not_actual_384_mib_guest_or_gui'] is True
          assert d['real_webpage_visually_confirmed'] is False
          assert d['peak_observed_pss_mib'] is not None
          print('V97_WPE_MODERN_JS_ENGINE_EXECUTED; NOT_A_VERIFIED_GRAPHICAL_BROWSER')
          PY
