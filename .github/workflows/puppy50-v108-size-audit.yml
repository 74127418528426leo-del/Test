name: Puppy50 v108 image size attribution
on:
  push:
    branches: [puppy50-v108-architecture]
    paths: [.github/workflows/puppy50-v108-size-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso squashfs-tools
          mkdir -p input out/{root,reports}
      - name: Measure component and firmware sizes
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o input/v107.iso 'https://github.com/74127418528426leo-del/Test/releases/download/puppy50-v107-zstd-fastboot-experimental/Puppy50_v107_FastBoot_EXPERIMENTAL.iso'
          printf '%s  %s\n' 'cbdf605f87d345ca60d1a0a3cebb20312864c81c2a286c8eacb5acb85769c0c2' input/v107.iso | sha256sum -c -
          xorriso -osirrox on -indev input/v107.iso -extract /live/filesystem.squashfs input/root.squashfs >out/reports/extract.log 2>&1
          sudo unsquashfs -d out/root input/root.squashfs >out/reports/unsquash.log
          sudo du -sb out/root/usr/lib/firmware/* | sort -nr | head -70 >out/reports/firmware-sizes.txt || true
          sudo du -sb out/root/usr/lib/firefox-esr out/root/usr/lib/x86_64-linux-gnu out/root/usr/lib/modules out/root/usr/share >out/reports/system-sizes.txt
          cat out/reports/firmware-sizes.txt out/reports/system-sizes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Puppy50-v108-size-attribution
          path: out/reports/
          retention-days: 30
