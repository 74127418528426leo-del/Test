name: Puppy50 v152 - inspect offline Firefox startupCache generation failure
on:
  push:
    branches: [puppy50-v152-prebuilt-firefox-startupcache]
    paths: ['.github/workflows/puppy50-v152-seed-failure-audit.yml']
permissions: {contents: read, actions: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download exact failed headless seed log
        run: |
          set -euo pipefail
          mkdir -p evidence
          gh run download 43542499420 --repo "$GITHUB_REPOSITORY" \
            --name puppy50-v152-anonymous-startupcache-evidence --dir evidence
          find evidence -iname '*headless*' -o -iname '*seed*' -o -iname '*Xvfb*'
          find evidence -name 'v152-headless-first-boot.log' -print -exec sh -c 'echo ---- BEGIN GENERATED FIREFOX STDERR ----; tail -n 160 "$1"; echo ---- END ----' sh {} \;
          find evidence -name 'v152-Xvfb.log' -print -exec sh -c 'echo ---- Xvfb LOG ----; tail -n 60 "$1"' sh {} \;
          test -n "$(find evidence -name 'v152-headless-first-boot.log' -print -quit)"
