name: Puppy50 v105 UEFI startup verification
on:
  push:
    branches: [puppy50-v105-fast-boot]
    paths: [.github/workflows/puppy50-v105-uefi.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  uefi:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        media: [optical, usb]
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and matched UEFI firmware
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 python3-pil ovmf
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          mkdir -p input evidence/qemu
      - name: Retrieve exact ISO
        uses: actions/download-artifact@v4
        with:
          name: Puppy50-v105-combined-test-only
          run-id: 42330320993
          github-token: ${{ github.token }}
          path: input
      - name: Check the exact image
        run: |
          set -euo pipefail
          (cd input && sha256sum -c SHA256SUMS)
          printf '%s  %s\n' '01a861bd064408ce1814bb79d8c43274e54061435423cc009ca4924815f3d355' 'input/Puppy50_v105_Fast_TEST_ONLY.iso' | sha256sum -c -
      - name: Boot without networking and test the responsive browser
        env:
          MEDIA: ${{ matrix.media }}
        run: |
          set -euo pipefail
          python3 -u web105/boot_bench.py --iso input/Puppy50_v105_Fast_TEST_ONLY.iso --out evidence/qemu --mode offline --ram 2560 --seconds 210 --emulate-acer-id --firmware uefi --media "$MEDIA"
      - name: Preserve framebuffer and logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50-v105-uefi-${{ matrix.media }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
