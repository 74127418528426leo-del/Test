name: Puppy50 hardware entropy and cold browser boot
on:
  push:
    branches: [puppy50-early-entropy-20261122]
    paths: ['.github/workflows/puppy50-early-entropy.yml', 'puppy50-boot/early_entropy.py', 'puppy50-boot/early_graphics.py', 'puppy50-boot/entropy_bench.py']
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: Build once and verify both bootable images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: input/research
      - name: Install ISO build tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq -o Acquire::Retries=2
          sudo apt-get install -y --no-install-recommends xorriso lz4 cpio kmod squashfs-tools
          mkdir -p build out/boot out/images
      - uses: actions/download-artifact@v4
        with:
          name: puppy50-virtio-lz4-boot-lab-iso
          run-id: 45034966977
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/original
      - name: Build the signed graphics and hardware entropy comparison
        run: |
          set -euo pipefail
          scripts=input/research/puppy50-boot
          mv build/original/candidate.iso build/original.iso
          echo '0d005740bfdc77091f279ae749aabb22e76b39398e8668f73500dfb4d74be0a2  build/original.iso' | sha256sum -c -
          xorriso -osirrox on -indev build/original.iso \
            -extract /live/filesystem.squashfs build/root.sqfs -extract /live/initrd-vm.img out/boot/initrd-vm.img -extract /sha256sum.txt out/boot/sha256sum.txt
          echo '8c1bed5bcd3089f203e8afe1fcedae129af2c87408a57252be24f42adacac913  build/root.sqfs' | sha256sum -c -
          sudo unsquashfs -no-progress -d build/modules build/root.sqfs usr/lib/modules/6.12.117+deb13-amd64
          if [[ ! -e build/modules/lib ]]; then sudo ln -s usr/lib build/modules/lib; fi
          lz4 -qdc out/boot/initrd-vm.img >build/original.cpio
          for variant in control tuned; do
            target="build/$variant"
            mkdir -p "$target"
            (cd "$target" && sudo cpio -idmu --quiet --no-absolute-filenames) <build/original.cpio
            sudo python3 "$scripts/early_graphics.py" "$target" --modules build/modules
            if [[ "$variant" == tuned ]]; then sudo python3 "$scripts/early_entropy.py" "$target" build/modules; fi
            sudo sh -n "$target/init"
            (cd "$target" && sudo find . -print0 | LC_ALL=C sort -z | sudo cpio --null -o -H newc --quiet) | lz4 -q -l -1 - "build/$variant.img"
            python3 "$scripts/boot_latency_lab.py" iso build/original.iso "out/images/$variant.iso" out/boot "build/$variant.img"
            xorriso -osirrox on -indev "out/images/$variant.iso" -extract / "build/verify-$variant"
            (cd "build/verify-$variant" && sha256sum -c --quiet sha256sum.txt)
            cmp "build/$variant.img" "build/verify-$variant/live/initrd-vm.img"
            chmod -R u+w "build/verify-$variant"
            rm -r "build/verify-$variant"
          done
          (cd out/images && sha256sum control.iso tuned.iso >SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: puppy50-cold-entropy-images
          path: out/images/
          compression-level: 0
          retention-days: 7
  measure:
    name: ${{ matrix.route }} with real input and eject
    needs: build
    strategy:
      fail-fast: false
      matrix:
        route: [bios, direct]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: input/source
      P50_CPU: i3-540-conservative
      P50_ROUTE: ${{ matrix.route }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: input/research
      - uses: actions/checkout@v4
        with:
          ref: 604786a8bce8768ae0cd6bcf11cfc7b07e1825ee
          path: input/source
      - uses: actions/checkout@v4
        with:
          ref: d39a63afe01ed74b03a7dc2405d4cbe27336d839
          path: input/preview
      - name: Install KVM and record available CPU threads
        run: |
          set -euo pipefail
          sudo apt-get update -qq -o Acquire::Retries=2
          sudo apt-get install -y --no-install-recommends xorriso qemu-system-x86 python3-pil
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          mkdir -p out/reports fixture
          lscpu >out/reports/cpu.txt
          python3 -c 'import os; assert len(os.sched_getaffinity(0)) >= 4, "Four host CPU threads required for the four-vCPU trials"'
      - uses: actions/download-artifact@v4
        with:
          name: puppy50-cold-entropy-images
          path: out/images
      - name: Extract the kernel and matching command line from each verified ISO
        run: |
          set -euo pipefail
          (cd out/images && sha256sum -c SHA256SUMS)
          cp out/images/SHA256SUMS out/reports/iso-sha256.txt
          for v in control tuned; do
            mkdir -p "out/boot-$v"
            xorriso -osirrox on -indev "out/images/$v.iso" \
              -extract /live/vmlinuz "out/boot-$v/vmlinuz" -extract /live/initrd-vm.img "out/boot-$v/initrd-vm.img" -extract /isolinux/live.cfg "out/boot-$v/live.cfg"
          done
      - name: Prepare real Firefox JS and network tests
        run: |
          set -euo pipefail
          python3 input/preview/public_preview/prepare_harness.py --source input/source --preview input/preview/public_preview --retry input/research/v159/verify_real_http_with_retry.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('input/source/web112/early_probe.py')
          s=p.read_text()
          a=s.index("    send_key(monitor, ['ctrl', 'l']")
          b=s.index("    report['early_page_seen_seconds']",a)
          block=s[a:b]
          nav=block[:block.index('    if not wait_for_color')]
          nested=''.join('    '+line for line in nav.splitlines(True))
          focus = (
              "    for attempt in range(1, 3):\n"
              "        report['early_navigation_attempts'] = attempt\n"
              "        qmp(monitor, 'human-monitor-command', {'command-line':'mouse_button 1'})\n"
              "        time.sleep(0.08)\n"
              "        qmp(monitor, 'human-monitor-command', {'command-line':'mouse_button 0'})\n"
          )
          check="        if wait_for_color(monitor, out, LOADED_COLOR, 'early_loaded.png', timeout=4):\n            break\n    else:\n        return report\n"
          assert nav.count("send_key(monitor, ['ret']")==1
          s=s[:a]+focus+nested+check+s[b:]
          compile(s,str(p),'exec')
          p.write_text(s)
          PY
          nohup python3 -u input/source/web112/early_fixture.py --port 8766 >out/reports/fixture-early.log 2>&1 </dev/null &
          python3 -c 'import socket,time; time.sleep(2); [socket.create_connection(("127.0.0.1",p),timeout=5).close() for p in (8766,)]'
      - name: Interleave fresh boots and validate all functionality
        run: |
          set -euo pipefail
          scripts=input/research/puppy50-boot
          for v in control tuned; do python3 "$scripts/entropy_bench.py" input/source/web109/boot_bench_ahci.py "out/boot-$v" "$P50_ROUTE" "$v"; done
          sequence=(control1 tuned1 four1 plain1 four2 tuned2 control2 tuned3 four3)
          fixture_pid=
          trap 'if [[ -n "$fixture_pid" ]]; then kill "$fixture_pid" 2>/dev/null || true; fi' EXIT
          for sample in "${sequence[@]}"; do
            export P50_NONCE="P50-$GITHUB_RUN_ID-TRIAL-${sample^^}"
            mkdir -p "out/$sample"
            python3 -u input/source/web103/fixture_server.py --fixture fixture/unused.mp4 --nonce "$P50_NONCE" --port 8765 >"out/$sample/http-receipts.log" 2>&1 &
            fixture_pid=$!
            python3 - <<'PY'
          import socket
          import time
          for _ in range(100):
              try:
                  socket.create_connection(('127.0.0.1', 8765), timeout=0.1).close()
                  break
              except OSError:
                  time.sleep(0.05)
          else:
              raise RuntimeError('Per-boot HTTP receiver did not start')
          PY
            iso_name=tuned
            profile=two
            case "$sample" in
              control*) iso_name=control ;;
              four*) profile=four ;;
              plain*) profile=plain ;;
            esac
            iso="out/images/$iso_name.iso"
            driver="input/source/web109/boot_bench_${iso_name}_${profile}.py"
            python3 - "$iso" "out/boot-$iso_name/vmlinuz" "out/boot-$iso_name/initrd-vm.img" <<'PY'
          import os
          import sys
          for path in sys.argv[1:]:
              with open(path, 'rb') as f:
                  os.posix_fadvise(f.fileno(), 0, 0, os.POSIX_FADV_DONTNEED)
          PY
            rc=0
            python3 -u "$driver" \
              --iso "$iso" --out "out/$sample" --mode online --allow-no-startup-probe \
              --ram 3072 --seconds 32 --cpu-model "$P50_CPU" --emulate-acer-id \
              --firmware bios --media usb --bandwidth 0 --wait-ram-ready || rc=$?
            printf '%s\n' "$rc" >"out/$sample/exit-status"
            kill "$fixture_pid"
            wait "$fixture_pid" || true
            fixture_pid=
          done
          python3 - "$P50_ROUTE" "$GITHUB_RUN_ID" "${sequence[@]}" <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'input/research/puppy50-boot')
          import boot_latency_lab as lab
          out = Path('out')
          lab.BASELINE_HASH = lab.sha256(out / 'images/control.iso')
          lab.summarize(out, sys.argv[1], sys.argv[2], sys.argv[3:])
          data = json.loads((out / 'reports/comparison.json').read_text())
          for name in data['samples']:
              serial = (out / name / 'serial.log').read_text(errors='replace')
              expected = name.startswith(('tuned', 'four'))
              if ('P50_ENTROPY_DEVICE_BOUND ' in serial) != expected:
                  raise RuntimeError(f'{name}: unexpected early hardware RNG binding')
              if 'P50_ENTROPY_DEVICE_UNAVAILABLE' in serial:
                  raise RuntimeError(f'{name}: hardware entropy driver did not bind')
          data['profiles'] = {'control': '2 vCPUs, real VirtIO RNG present, stock entropy initialization',
                              'tuned': '2 vCPUs, real VirtIO RNG present and driver staged early',
                              'four': '4 vCPUs, same tuned image and real VirtIO RNG',
                              'plain': '2 vCPUs, same tuned image, no VirtIO RNG device'}
          data['cache'] = 'Fresh QEMU process; DONTNEED requested for the ISO, kernel and initrd before each boot.'
          (out / 'reports/comparison.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Save screenshots, timing, serial logs and browser HTTP receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puppy50-cold-entropy-${{ matrix.route }}-evidence
          path: |
            out/reports/
            out/control*/
            out/tuned*/
            out/four*/
            out/plain*/
          retention-days: 21
