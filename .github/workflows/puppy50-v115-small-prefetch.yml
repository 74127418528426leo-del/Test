name: Puppy50 v115 small early Firefox page-prefetch comparison
on:
  push:
    branches: [puppy50-v115-small-prefetch]
    paths: [.github/workflows/puppy50-v115-small-prefetch.yml]
permissions:
  contents: read
  actions: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Puppy50-v115-hotpages-probe-evidence
          run-id: 42695335382
          github-token: ${{ github.token }}
          path: input/profile
      - name: Install VM and image tools and test diagnostic utilities
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso zstd cpio qemu-system-x86 python3-pil gcc libc6-dev
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          mkdir -p input out/{main,reports,tree,rechecked} fixture
          python3 -m unittest discover -s web115pages -p 'test_*.py' -v
          python3 -m unittest discover -s web115small -p 'test_*.py' -v
          python3 -m unittest discover -s web113 -p 'test_*.py' -v
          gcc -O2 -Wall -Wextra -Werror -static -o out/p50-prefetch web115pages/prefetch.c
          python3 web112/early_probe.py web109/boot_bench_staged.py web114/interactive_bench.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web114/interactive_bench.py');s=p.read_text()
          old="'P50_V91_NONROOT_FIREFOX_PROCESS_SEEN']"
          new="'P50_V91_NONROOT_FIREFOX_PROCESS_SEEN', 'P50_TARGET_PREFETCH_BEGIN', 'P50_TARGET_PREFETCH_END']"
          assert s.count(old)==1;s=s.replace(old,new,1)
          old="time.sleep(.05 if args.select_fullram_fallback and not result['fullram_fallback_selected'] else .8)"
          new="time.sleep(.05 if args.select_fullram_fallback and not result['fullram_fallback_selected'] else .2)"
          assert s.count(old)==1;s=s.replace(old,new,1);p.write_text(s)
          PY
          python3 -m py_compile web114/interactive_bench.py
          lscpu >out/reports/host-cpu.txt
          free -h >out/reports/host-memory.txt
      - name: Fetch exact v113 and instrument its fast initramfs only
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error -o input/v113.iso 'https://github.com/74127418528426leo-del/Test/releases/download/puppy50-v114-fast-verification-experimental/Puppy50_v114_Fast_Verification_EXPERIMENTAL.iso'
          printf '%s  %s\n' 'bf19a63758fbb6ab9aad5cb3b04c9b0e97b32944ab30f304fa16a205c78096b9' input/v113.iso | sha256sum -c -
          xorriso -osirrox on -indev input/v113.iso -extract /live/initrd.img out/original.initrd -extract /live/initrd-full.img out/original-full.initrd -extract /live/filesystem.squashfs out/base.squashfs >out/reports/extract.log 2>&1
          head -c 36154880 out/original.initrd >out/early-prefix
          tail -c +36154881 out/original.initrd | zstd -q -dc >out/main.cpio
          (cd out/main && sudo cpio -idm --quiet --no-absolute-filenames <../main.cpio)
          sudo install -o root -g root -m 0755 out/p50-prefetch out/main/usr/lib/p50-stage/p50-prefetch
          sudo install -o root -g root -m 0755 web115pages/prefetch.sh out/main/usr/lib/p50-stage/p50-prefetch.sh
          printf '%s  %s\n' '32b29ffbd58117d0f83cfa38e291443bd3348729211a74c84da7b9993ac49b6e' input/profile/reports/hotpages.tsv | sha256sum -c -
          printf '%s  %s\n' '8f2c6b8f62f9e16798b373dba84b9489dc48dc132f1b76481a7429469be72298' input/profile/trace1/result.json | sha256sum -c -
          python3 web115small/small_select.py input/profile/reports/hotpages.tsv input/profile/trace1/result.json out/reports/small-plan.tsv out/reports/small-plan.json
          python3 - <<'PY2'
          import json
          from pathlib import Path
          p=json.loads(Path('out/reports/small-plan.json').read_text())
          assert p['selected_snapshot']==4 and p['total_bytes']==12382208 and p['max_bytes']==16777216,p
          PY2
          sha256sum out/reports/small-plan.tsv >out/reports/small-plan.sha256
          sudo install -o root -g root -m 0644 out/reports/small-plan.tsv out/main/usr/lib/p50-stage/hotpages-plan.tsv
          sudo python3 web115pages/prefetch_patch.py out/main
          sudo sh -n out/main/usr/lib/live/boot/9990-main.sh
          sudo sh -n out/main/usr/lib/p50-stage/p50-migrate.sh
      - name: Create isolated diagnostic image and verify media
        run: |
          set -euo pipefail
          (cd out/main && sudo find . -print0 | LC_ALL=C sort -z | sudo cpio -o --null -H newc --quiet) >out/modified.cpio
          zstd -q -3 -T2 -o out/modified.cpio.zst out/modified.cpio
          cat out/early-prefix out/modified.cpio.zst >out/candidate.initrd
          cmp -n 36154880 out/original.initrd out/candidate.initrd
          xorriso -indev input/v113.iso -outdev out/stage.iso -map out/candidate.initrd /live/initrd.img -map out/candidate.initrd /live/initrd.img-6.12.115+deb13.1-amd64 -boot_image any replay -commit -end >out/reports/stage.log 2>&1
          xorriso -osirrox on -indev out/stage.iso -extract / out/tree >out/reports/tree.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          root=Path('out/tree').resolve();lines=[];seen=set()
          for line in (root/'sha256sum.txt').read_text().splitlines():
              m=re.fullmatch(r'([0-9a-fA-F]{64})( [ *])(.*)',line);assert m,line
              name=m.group(3);assert name.startswith('./') and name not in seen;seen.add(name)
              p=(root/name).resolve(strict=True);p.relative_to(root);assert p.is_file() and name!='./sha256sum.txt'
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for block in iter(lambda:f.read(1048576),b''):h.update(block)
              lines.append(h.hexdigest()+m.group(2)+name)
          assert len(lines)==293
          Path('out/sha256sum.txt').write_text('\n'.join(lines)+'\n')
          PY
          xorriso -indev out/stage.iso -outdev out/candidate.iso -map out/sha256sum.txt /sha256sum.txt -boot_image any replay -commit -end >out/reports/repack.log 2>&1
          xorriso -osirrox on -indev out/candidate.iso -extract / out/rechecked >out/reports/recheck.log 2>&1
          cmp out/base.squashfs out/rechecked/live/filesystem.squashfs
          cmp out/candidate.initrd out/rechecked/live/initrd.img
          cmp out/candidate.initrd out/rechecked/live/initrd.img-6.12.115+deb13.1-amd64
          cmp out/original-full.initrd out/rechecked/live/initrd-full.img
          (cd out/rechecked && sha256sum -c sha256sum.txt) >out/reports/media-checksums.txt
          test "$(wc -l <out/reports/media-checksums.txt)" -eq 293
          sha256sum input/v113.iso out/candidate.iso >out/reports/iso-hashes.txt
      - name: Start local browser fixtures and bounded trace receiver
        env:
          P50_NONCE: P50-${{ github.run_id }}
        run: |
          set -euo pipefail
          nohup python3 -u web103/fixture_server.py --fixture fixture/unused.mp4 --nonce "$P50_NONCE" --port 8765 >out/reports/after-fixture.log 2>&1 </dev/null &
          nohup python3 -u web112/early_fixture.py --port 8766 >out/reports/early-fixture.log 2>&1 </dev/null &
          python3 -c 'import socket,time; time.sleep(2); [socket.create_connection(("127.0.0.1",p),timeout=5).close() for p in (8765,8766)]'
      - name: Compare targeted prefetch against unchanged v114
        timeout-minutes: 17
        env:
          P50_NONCE: P50-${{ github.run_id }}
        run: |
          set -euo pipefail
          for name in base1 cand1 cand2 base2; do
            if [[ "$name" == base* ]]; then iso=input/v113.iso; else iso=out/candidate.iso; fi
            python3 -u web114/interactive_bench.py --iso "$iso" --out "out/$name" --mode online --allow-no-startup-probe --wait-ram-ready --ram 3072 --seconds 210 --cpu-model i3-540-conservative --emulate-acer-id --media usb --bandwidth 31457280
          done
          test "$(grep -c '"GET /e HTTP/1.1" 200' out/reports/early-fixture.log)" -eq 4
          test "$(grep -c "GET /after.html?nonce=$P50_NONCE.* 200 " out/reports/after-fixture.log)" -eq 4
          for name in cand1 cand2; do
            tr -d '\r' <"out/$name/serial.log" >"out/reports/$name-serial-clean.log"
            grep -F 'P50_TARGET_PREFETCH_BEGIN' "out/reports/$name-serial-clean.log"
            grep -F 'P50_TARGET_PREFETCH_END rc=0' "out/reports/$name-serial-clean.log"
            grep -Fx 'P50_PREFETCH_BYTES 12378736' "out/reports/$name-serial-clean.log"
          done
          python3 web115pages/compare.py out
      - name: Preserve diagnostic logs and screenshots on any result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50-v115-small-prefetch-evidence
          path: |
            out/reports/
            out/base1/
            out/base2/
            out/cand1/
            out/cand2/
          if-no-files-found: warn
          retention-days: 30

      - name: Retain test-only candidate temporarily if all checks pass
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50-v115-small-prefetch-test-only-iso
          path: out/candidate.iso
          compression-level: 0
          retention-days: 3
