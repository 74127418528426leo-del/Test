name: Puppy50 find actual minimum full RAM-only boot capacity
on:
  push:
    branches: ['puppy50-memory-truth-functional-gate']
    paths:
      - '.github/workflows/puppy50-minimum-ram.yml'
      - 'cloud/run_ram_threshold.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual-guest-ram-only-threshold:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        ram_mib: [1280,1536,2048]
    steps:
      - uses: actions/checkout@v4
      - name: Download same v43 release artifact for every capacity
        uses: actions/download-artifact@v4
        with:
          name: puppy50-v43-4g-ram-only-xz-optimized-iso
          run-id: 41485045293
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source-v43
      - name: Install standard KVM and ISO QA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends p7zip-full xorriso squashfs-tools qemu-system-x86
      - name: Build same temporary diagnostic overlay, never alter downloadable release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p50" evidence
          (cd source-v43 && sha256sum -c Puppy50_v43_SHA256SUMS.txt)
          SOURCE="$PWD/source-v43/Puppy50_v43_4GiB_RAM_ONLY_XZ_EXPERIMENTAL.iso"
          7z e -y -o"$RUNNER_TEMP/p50" "$SOURCE" '*.sfs' >/dev/null
          sh cloud/build_memory_truth_probe.sh \
            "$RUNNER_TEMP/p50/puppy_dpupbw64_10.0.12.sfs" \
            "$RUNNER_TEMP/p50/qa.sfs" \
            "$RUNNER_TEMP/p50/original_rc.local"
          xorriso -indev "$SOURCE" -outdev "$RUNNER_TEMP/p50/QA.iso" \
            -map "$RUNNER_TEMP/p50/qa.sfs" /ydrv_dpupbw64_10.0.12.sfs \
            -boot_image any replay -commit -end >/dev/null
          python3 -m py_compile cloud/run_ram_threshold.py
          sh -n cloud/build_memory_truth_probe.sh
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          echo "RAM_CAPACITY_MIB=${{ matrix.ram_mib }}" > evidence/experiment_metadata.txt
      - name: Boot all original Puppy files in RAM at exact requested guest RAM
        id: guest
        continue-on-error: true
        timeout-minutes: 8
        run: |
          python3 cloud/run_ram_threshold.py \
            --iso "$RUNNER_TEMP/p50/QA.iso" \
            --ram-mib ${{ matrix.ram_mib }} \
            --out evidence/guest --seconds 355
      - name: Record observed CD-ejection and RAM-mount evidence without invented pass
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,pathlib,os
          out=pathlib.Path('evidence')
          m=int(os.environ["MIB"])
          p=out/'guest/serial.log';s=p.read_text(errors='replace') if p.is_file() else ''
          q=out/'guest/result.json';r=json.loads(q.read_text()) if q.is_file() else {}
          loops=re.findall(r'^/dev/loop\d+:.*',s,re.M)
          ramloops=[x for x in loops if '/initrd/mnt/tmpfs/' in x and '.sfs' in x]
          files=re.findall(r'^PUPPY50_V40_SFS file=([^\s]+) size=(\d+)',s,re.M)
          samples=len(re.findall('PUPPY50_V40_BEGIN sample=',s))
          mem=re.findall(r'^MemAvailable:\s*(\d+) kB',s,re.M)
          d={'guest_RAM_MiB':m,'ejected':r.get('media_ejection_verified',False),
             'sfs_copy_files_observed':len(set(x[0] for x in files)),
             'RAM_backed_loop_mounts_observed':len(set(ramloops)),
             'guest_samples':samples,
             'guest_MemAvailable_kB_last':int(mem[-1]) if mem else None,
             'browser_window_title_observed':'PUPPY50 RAM AFTER EJECT' in s,
             'all_apps_verified':False,'full_memory_stability_verified':False,
             '384_MiB_full_RAM_OS_verified':False,
             'no_media_dependency_verified':r.get('media_ejection_verified',False) and len(set(ramloops))>=6 and samples>=4,
             'boot_test_step_outcome':os.environ.get('STEP_OUTCOME','unknown')}
          (out/'capacity_result.json').write_text(json.dumps(d,indent=2)+'\n')
          print(json.dumps(d,indent=2))
          PY
        env:
          MIB: ${{ matrix.ram_mib }}
          STEP_OUTCOME: ${{ steps.guest.outcome }}
      - name: Archive real VM screenshots and logs even if boot fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puppy50-memory-capacity-${{ matrix.ram_mib }}MiB-real-kvm
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
