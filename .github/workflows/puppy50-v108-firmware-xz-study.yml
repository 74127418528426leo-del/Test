name: Puppy50 v108 firmware compression layer study
on:
  push:
    branches: [puppy50-v108-architecture]
    paths: [.github/workflows/puppy50-v108-firmware-xz-study.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Install ISO tools and fetch the exact baseline
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso squashfs-tools time
          mkdir -p input out/{root,reports}
          curl --fail --location --retry 3 -o input/v107.iso 'https://github.com/74127418528426leo-del/Test/releases/download/puppy50-v107-zstd-fastboot-experimental/Puppy50_v107_FastBoot_EXPERIMENTAL.iso'
          printf '%s  %s\n' 'cbdf605f87d345ca60d1a0a3cebb20312864c81c2a286c8eacb5acb85769c0c2' input/v107.iso | sha256sum -c -
          xorriso -osirrox on -indev input/v107.iso -extract /live/filesystem.squashfs input/root.squashfs >out/reports/extract.log 2>&1
          sudo unsquashfs -d out/root input/root.squashfs >out/reports/unsquash.log
      - name: Measure the same firmware in xz squashfs
        timeout-minutes: 17
        run: |
          set -euo pipefail
          /usr/bin/time -v -o out/reports/compress-time.txt sudo mksquashfs out/root/usr/lib/firmware out/firmware-xz.squashfs -comp xz -b 1M -processors 3 -mem 2048M -noappend -no-progress -exit-on-error >out/reports/compress.log 2>&1
          unsquashfs -s out/firmware-xz.squashfs >out/reports/format.txt
          stat -c '%n %s' out/firmware-xz.squashfs | tee out/reports/size.txt
          cat out/reports/compress-time.txt
      - name: Preserve measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50-v108-firmware-xz-size
          path: out/reports/
          if-no-files-found: warn
          retention-days: 30
