          grep -Fq 'P50_V137_OPENBOX_DEFERRED' out/main/usr/lib/live/boot/9990-main.sh
          sudo sh -n out/main/usr/lib/live/boot/9990-main.sh
          grep -Fq 'P50_V144_XORG_VT7_SELECTED' out/main/usr/lib/live/boot/9990-main.sh
          (cd out/main && sudo find . -print0 | LC_ALL=C sort -z | sudo cpio -o --null -H newc --quiet) >out/v147.cpio
          zstd -q -3 -T2 -o out/v147.cpio.zst out/v147.cpio
          cat out/early-prefix out/v147.cpio.zst >out/v147.initrd
          cmp -n 36154880 out/original.initrd out/v147.initrd
          xorriso -indev out/v136.iso -outdev out/v147-stage.iso \
            -map out/v147.initrd /live/initrd.img \
            -map out/v147.initrd /live/initrd.img-6.12.115+deb13.1-amd64 \
            -boot_image any replay -commit -end >out/reports/v147-stage.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          entries=Path('out/v136.manifest').read_text().splitlines()
          assert len(entries)==293
          digest=hashlib.sha256(Path('out/v147.initrd').read_bytes()).hexdigest()
          targets={'./live/initrd.img','./live/initrd.img-6.12.115+deb13.1-amd64'}
          seen=set();out=[]
          for line in entries:
              m=re.fullmatch(r'([0-9a-fA-F]{64})( [ *])(.*)',line);assert m,line
              name=m.group(3)
              if name in targets:seen.add(name)
              out.append((digest if name in targets else m.group(1))+m.group(2)+name)
          assert seen==targets
          Path('out/v147.manifest').write_text('\n'.join(out)+'\n')
          PY
          xorriso -indev out/v147-stage.iso -outdev out/v147.iso \
            -map out/v147.manifest /sha256sum.txt -boot_image any replay \
            -commit -end >out/reports/v147-final.log 2>&1
          mkdir -p out/v147-recheck
          xorriso -osirrox on -indev out/v147.iso \
            -extract /live/initrd.img out/v147-recheck/initrd \
            -extract /live/initrd-full.img out/v147-recheck/fallback \
            -extract /live/filesystem.squashfs out/v147-recheck/root \
            -extract /sha256sum.txt out/v147-recheck/manifest >out/reports/v147-audit.log 2>&1
          cmp out/v147.initrd out/v147-recheck/initrd
          cmp out/original-full.initrd out/v147-recheck/fallback
          cmp out/original.squashfs out/v147-recheck/root
          cmp out/v147.manifest out/v147-recheck/manifest
          sha256sum out/v136.iso out/v147.iso >out/reports/v147-ISO-hashes.txt
          echo P50_V142_IDENTICAL_KERNEL_ROOT_FIREFOX_AND_RECOVERY_ONLY_TTY1_HANDOFF
