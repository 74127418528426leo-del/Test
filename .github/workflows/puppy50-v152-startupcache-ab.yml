          mkdir -p out/v149-check
          xorriso -osirrox on -indev out/v149.iso \
            -extract /live/initrd.img out/v149-check/initrd \
            -extract /live/initrd-full.img out/v149-check/fallback \
            -extract /live/filesystem.squashfs out/v149-check/root \
            -extract /sha256sum.txt out/v149-check/manifest >out/reports/v149-audit.log 2>&1
          cmp out/v149.initrd out/v149-check/initrd
          cmp out/original-full.initrd out/v149-check/fallback
          cmp out/original.squashfs out/v149-check/root
          cmp out/v149.manifest out/v149-check/manifest
          sha256sum out/v147.iso out/v149.iso >out/reports/v149-ISO-sha256.txt
          echo 'P50_V149_SOFTWARE_WEBRENDER_ONE_PROFILE_PREF_ONLY_KERNEL_ROOT_AND_RECOVERY_UNCHANGED'
      - name: Generate fresh ANONYMOUS Firefox startupCache using exact immutable root Firefox ESR
        timeout-minutes: 13
        run: |
          set -euo pipefail
          sudo unsquashfs -no-progress -processors 4 -dest out/seedroot out/original.squashfs >out/reports/v152-unsquashfs.log 2>&1
          test -x out/seedroot/usr/lib/firefox-esr/firefox-esr
          test -f out/seedroot/usr/share/puppy50web/index.html
          sudo mkdir -p out/seedroot/dev out/seedroot/proc out/seedroot/run/user/1000 out/seedroot/home/user/.mozilla/firefox/p50-default
          sudo chown -R 1000:1000 out/seedroot/home/user/.mozilla out/seedroot/run/user/1000
          sudo chmod 0700 out/seedroot/run/user/1000 out/seedroot/home/user/.mozilla/firefox/p50-default
          sudo mount --bind /dev out/seedroot/dev
          sudo mount -t proc proc out/seedroot/proc
          cleanup() {
            sudo umount out/seedroot/proc || true
            sudo umount out/seedroot/dev || true
          }
          trap cleanup EXIT
          set +e
          sudo timeout 60s unshare --net -- chroot --userspec=1000:1000 out/seedroot \
            /usr/bin/env HOME=/home/user XDG_RUNTIME_DIR=/run/user/1000 \
              MOZ_HEADLESS=1 MOZ_CRASHREPORTER_DISABLE=1 \
              /usr/bin/firefox-esr --headless --no-remote \
              --profile /home/user/.mozilla/firefox/p50-default \
              --screenshot /tmp/p50-offline-seed.png \
              file:///usr/share/puppy50web/index.html \
              >out/reports/v152-headless-first-boot.log 2>&1
          code="$?"
          set -e
          echo "P50_V152_SEED_HEADLESS_EXIT=$code" | tee -a out/reports/v152-headless-first-boot.log
          cleanup
          trap - EXIT
          python3 - <<'PY'
          from pathlib import Path
          import tarfile,json,hashlib
          root=Path('out/seedroot/home/user')
          candidates=sorted(p for p in root.rglob('startupCache') if p.is_dir() and not p.is_symlink())
          info=[{'path':str(p.relative_to(root)), 'size':sum(f.stat().st_size for f in p.rglob('*') if f.is_file())} for p in candidates]
          print('P50_V152_GENERATED_STARTUPCACHE_LOCATIONS',json.dumps(info))
          assert info,'Exact-version Firefox did not create a startupCache; do NOT invent one'
          chosen=max(candidates,key=lambda p:sum(f.stat().st_size for f in p.rglob('*') if f.is_file()))
          files=[f for f in chosen.rglob('*') if f.is_file()]
          assert files,'No startupCache payload to seed'
          size=sum(f.stat().st_size for f in files)
          assert 1024<=size<=32*1024*1024,size
          assert all(not f.is_symlink() for f in chosen.rglob('*')),'Refuse symlink in untrusted startup cache'
          rel=chosen.relative_to(root)
          assert str(rel).startswith(('.cache/mozilla/firefox/','.mozilla/firefox/')),rel
          with tarfile.open('out/v152-startupcache.tar','w') as tar:
              for p in sorted([chosen]+list(chosen.rglob('*'))):
                  if p.is_file() or p.is_dir():
                      tar.add(p,arcname=str(p.relative_to(root)),recursive=False)
          meta={'only_anonymous_cache':True,'original_source':str(rel),
                'payload_uncompressed_bytes':size,'file_count':len(files),
                'sha256':hashlib.sha256(Path('out/v152-startupcache.tar').read_bytes()).hexdigest()}
          Path('out/reports/v152-anonymous-cache-audit.json').write_text(json.dumps(meta,indent=2)+'\n')
          print('P50_V152_ANONYMOUS_STARTUP_CACHE_READY',json.dumps(meta))
          PY
          sudo rm -rf out/seedroot
      - name: Build identical Firefox image with ONLY offline startupCache restored before first launch
        timeout-minutes: 7
        run: |
          set -euo pipefail
          sudo mkdir -p out/main/usr/share/puppy50
          sudo cp out/v152-startupcache.tar out/main/usr/share/puppy50/p50-startupcache.tar
          sudo python3 input/patches/v152/seed_startupcache.py out/main
          sudo sh -n out/main/usr/lib/live/boot/9990-main.sh
          grep -Fq 'P50_V152_STARTUP_CACHE_SEEDED' out/main/usr/lib/live/boot/9990-main.sh
          (cd out/main && sudo find . -print0 | LC_ALL=C sort -z | sudo cpio -o --null -H newc --quiet) >out/v152.cpio
          zstd -q -3 -T2 -o out/v152.cpio.zst out/v152.cpio
          cat out/early-prefix out/v152.cpio.zst >out/v152.initrd
          cmp -n 36154880 out/original.initrd out/v152.initrd
          xorriso -indev out/v149.iso -outdev out/v152-stage.iso \
            -map out/v152.initrd /live/initrd.img \
            -map out/v152.initrd /live/initrd.img-6.12.115+deb13.1-amd64 \
            -boot_image any replay -commit -end >out/reports/v152-stage.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          entries=Path('out/v149.manifest').read_text().splitlines()
          assert len(entries)==293
          digest=hashlib.sha256(Path('out/v152.initrd').read_bytes()).hexdigest()
          targets={'./live/initrd.img','./live/initrd.img-6.12.115+deb13.1-amd64'}
          seen=set();output=[]
          for line in entries:
              m=re.fullmatch(r'([a-fA-F0-9]{64})( [ *])(.*)',line);assert m,line
              name=m.group(3)
              if name in targets:seen.add(name)
              output.append((digest if name in targets else m.group(1))+m.group(2)+name)
          assert seen==targets
          Path('out/v152.manifest').write_text('\n'.join(output)+'\n')
          PY
          xorriso -indev out/v152-stage.iso -outdev out/v152.iso \
            -map out/v152.manifest /sha256sum.txt -boot_image any replay \
            -commit -end >out/reports/v152-final.log 2>&1
          mkdir -p out/v152-check
          xorriso -osirrox on -indev out/v152.iso \
            -extract /live/initrd.img out/v152-check/initrd \
            -extract /live/initrd-full.img out/v152-check/fallback \
            -extract /live/filesystem.squashfs out/v152-check/root \
            -extract /sha256sum.txt out/v152-check/manifest >out/reports/v152-check.log 2>&1
          cmp out/v152.initrd out/v152-check/initrd
          cmp out/original-full.initrd out/v152-check/fallback
          cmp out/original.squashfs out/v152-check/root
          cmp out/v152.manifest out/v152-check/manifest
          sha256sum out/v149.iso out/v152.iso >out/reports/v152-ISO-sha256.txt
          echo 'P50_V152_IDENTICAL_FIREFOX_BINARY_AND_ROOT_ONLY_ANONYMOUS_STARTUP_CACHE_ADDED'
      - name: Use identical 0.2s SATA CD optical benchmark on both conditions
        run: |
