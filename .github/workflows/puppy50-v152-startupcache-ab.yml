                  'all_six_complete_verified_RAM_before_eject':True,
                  'physical_Acer_tested':False,
                  'five_seconds_achieved_in_both':all(runs[f]['first_home_seen_seconds']<5 for f in fw)}
          Path('out/reports/v152-independent-BIOS-UEFI.json').write_text(json.dumps(report,indent=2)+'\n')
          print('P50_V152_INDEPENDENT_SHIPPING_FIRMWARE_PASS',json.dumps(report,indent=2))
          PY
