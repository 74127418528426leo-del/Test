        run: |
          set -euo pipefail
          sudo python3 input/patches/v144/xorg_vt7.py out/main
          sudo python3 input/patches/v141/priority.py out/main
          sudo python3 input/patches/v139/seed_empty_profile.py out/main
          sudo python3 input/patches/v137/defer_openbox.py out/main
