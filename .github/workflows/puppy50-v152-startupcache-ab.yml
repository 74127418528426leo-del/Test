      - name: Four matched real Firefox first-frame cold boots A-B-B-A with RAM and HTTP 200 proof
        timeout-minutes: 27
        run: |
          set -euo pipefail
          for sample in base1 cand1 cand2 base2; do
            if [[ "$sample" == base* ]]; then iso=out/v149.iso; else iso=out/v152.iso; fi
            python3 -u input/source/web109/boot_bench_ahci.py \
              --iso "$iso" --out "out/$sample" \
              --mode online --allow-no-startup-probe --wait-ram-ready \
              --ram 3072 --seconds 48 --cpu-model i3-540-conservative \
              --emulate-acer-id --firmware bios --media usb --bandwidth 0
          done
          python3 - <<'PY'
          from pathlib import Path
          import json,os,re,statistics
          names=['base1','cand1','cand2','base2']
          data={n:json.loads((Path('out')/n/'result.json').read_text()) for n in names}
          for n,r in data.items():
              assert r['first_home_seen_seconds'] is not None and r['staged_ram_ready_seconds'] is not None,(n,r)
              assert r['media_ejected'] and r['input_sent_after_eject'] and r['qemu_running_at_end'] and not r['errors'],(n,r)
              serial=(Path('out')/n/'serial.log').read_text(errors='replace')
              for marker in ['P50_V125_EARLY_DRM_READY','P50_V126_EARLY_SOCKET_PRESERVED',
                             'P50_V123_XORG_START','P50_V124_FORENSICS_START','P50_V124_FORENSICS_END','P50_STAGE_READY']:
                  assert marker in serial,(n,'missing',marker)
              assert 'P50_V127_FIREFOX_DIRECT_EXEC' in serial,(n,'Same v127 direct Firefox launch missing')
              assert 'P50_V127_BROWSER_START_RELOCATED' in serial,(n,'Duplicate autostart still present')
              assert 'P50_V131_READAHEAD_STARTED' in serial,(n,'Both conditions require libxul prefetch')
              assert 'P50_V131_READAHEAD_COMPLETE' in serial,(n,'Preload incomplete')
              assert any(x in serial for x in ('P50_V135_HOST_MAPPING_ADDED','P50_V135_HOST_ALREADY_MAPPED')),(n,'Both images need identical host mapping')
              assert 'P50_V133_PREFETCH_256MB_STARTED' in serial,(n,'Both images need same 256MiB prefetch')
              for m in ('P50_V144_XORG_VT7_SELECTED',
                        'P50_V141_FIREFOX_EARLY_PRIORITY_CONFIGURED',
                        'P50_V139_EMPTY_PROFILE_CREATED',
                        'P50_V137_OPENBOX_DEFERRED'):
                  assert m in serial,(n,'Both candidates need same secure v147 path',m)
              for m in ('P50_V149_WEBRENDER_USERJS_READY','P50_V149_USERJS_CONTENT_BEGIN',
                        'P50_V149_USERJS_CONTENT_END','P50_V144_XORG_VT7_SELECTED',
                        'P50_V139_EMPTY_PROFILE_CREATED','P50_V141_FIREFOX_EARLY_PRIORITY_CONFIGURED'):
                  assert m in serial,(n,'Baseline and candidate must have same secure profile',m)
              assert 'user_pref("gfx.webrender.software", true);' in serial,(n,'WebRender profile preference missing')
              if n.startswith('cand'):
                  assert 'P50_V152_STARTUP_CACHE_SEEDED' in serial,(n,'Seeded cache not present before Firefox')
              else:
                  assert 'P50_V152_STARTUP_CACHE_SEEDED' not in serial,(n,'Original cold baseline cache contaminated')
              crit=serial[serial.index('P50_V124_FORENSICS_START'):serial.index('P50_V124_FORENSICS_END')+len('P50_V124_FORENSICS_END')]
              assert '/usr/sbin/lightdm' not in crit,(n,'Late LightDM fallback')
              assert '/usr/lib/xorg/Xorg :0 -auth /home/user/.Xauthority' in crit,(n,'Not the early authenticated display')
              if n.startswith('cand'):
                  assert ' -noreset vt7' in crit,(n,'VT7 early display not retained after root switch')
              sockets=crit.split('-- xauth/x11 sockets --',1)[1].split('-- early Xorg log --',1)[0]
              assert ' X0' in sockets,(n,'X11 socket lost after switch-root',sockets)
          log=Path('out/reports/fixture-after.log').read_text()
          nonce=os.environ['P50_NONCE']
          receipts=re.findall(r'GET /after\.html\?nonce='+re.escape(nonce)+r' HTTP/1\.1" 200 ',log)
          assert len(receipts)==4,('Missing authenticated browser HTTP200 after media ejection',len(receipts),log[-900:])
          baseline=statistics.mean(data[n]['first_home_seen_seconds'] for n in ('base1','base2'))
          candidate=statistics.mean(data[n]['first_home_seen_seconds'] for n in ('cand1','cand2'))
          report={
              'test':'v149 original empty Firefox profile vs v152 offline-built anonymous Firefox startupCache, all other browser features identical',
              'first_frame_definition':'actual Firefox framebuffer home pixels, host monotonic clock before QEMU launch',
              'conditions':'A-B-B-A same GitHub runner, 2 virtual CPUs, 3GiB RAM, BIOS QEMU AHCI CD, 0.2-second poll',
              'initial_v117_full_root_unchanged':True,
              'early_authenticated_X11_survived_switch_root_in_all_four':True,
              'full_RAM_checksum_achieved_in_all_four':True,
              'media_ejected_after_RAM_in_all_four':True,
              'new_post_eject_HTTP_200_receipts':len(receipts),
              'v149_cold_empty_profile_mean_first_frame_s':baseline,
              'v152_preseed_startupcache_mean_first_frame_s':candidate,
              'prebuilt_startupcache_gain_seconds':baseline-candidate,
              'both_candidate_real_frames_below_5_sec':all(data[n]['first_home_seen_seconds']<5 for n in ('cand1','cand2')),
              'physical_Acer_i3_540_tested':False,
              'full_RAM_at_384MiB_supported':False,
              'trials':{n:{key:data[n][key] for key in ('first_home_seen_seconds','staged_ram_ready_seconds','media_ejected')} for n in names}
          }
          Path('out/reports/v152-prebuilt-cache-comparison.json').write_text(json.dumps(report,indent=2)+'\n')
          print('P50_V152_FOUR_BOOT_RESULT',json.dumps(report,indent=2))
          PY
