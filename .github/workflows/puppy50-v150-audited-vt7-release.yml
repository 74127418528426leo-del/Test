name: Puppy50 v150 - publish exact SHA audited VT7 Firefox experimental ISO
on:
  push:
    branches: [puppy50-v150-vt7-audited-experimental-iso]
    paths: ['.github/workflows/puppy50-v150-audited-vt7-release.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    env:
      PYTHONPATH: input/source
      P50_NONCE: P50-${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 604786a8bce8768ae0cd6bcf11cfc7b07e1825ee
          path: input/source
      - uses: actions/checkout@v4
        with:
          path: input/patches
      - name: Install isolated VM and ISO tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso zstd cpio qemu-system-x86 ovmf python3-pil zip unzip
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          mkdir -p input fixture out/main out/recheck out/reports
      - name: Download and authenticate exact v115 ISO and evidence source
        run: |
          set -euo pipefail
          base='https://github.com/74127418528426leo-del/Test/releases/download'
          curl -fL --retry 3 --silent --show-error "$base/puppy50-v117-instant-bios-experimental/Puppy50_v117_Instant_BIOS_EXPERIMENTAL.iso" -o input/base.iso
          curl -fL --retry 3 --silent --show-error "$base/puppy50-v114-fast-verification-experimental/Puppy50_v115_Test_Evidence.zip" -o input/source.zip
          echo 'a7fe532f501b9541c3a4fc22455e57ef79b8389eac6561720c25d7e188231b83  input/base.iso' | sha256sum -c -
          echo '7825360436f14213ae8415e1505a11868f48826a9f4d48f8eb02f1354842ad6b  input/source.zip' | sha256sum -c -
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('input/source.zip') as z:
              assert z.testzip() is None
          PY
          python3 input/source/web109/boot_bench_staged.py --help | tail -n 12
      - name: Build QEMU-only pre-PID1 authenticated X11 without weakening Firefox sandbox
        run: |
          set -euo pipefail
          xorriso -osirrox on -indev input/base.iso -extract /live/initrd.img out/original.initrd -extract /live/initrd-full.img out/original-full.initrd -extract /live/filesystem.squashfs out/original.squashfs -extract /sha256sum.txt out/original.sha256sum.txt >out/reports/extract.log 2>&1
          # Exact two-part initrd layout from the original v115 build evidence.
          head -c 36154880 out/original.initrd >out/early-prefix
          tail -c +36154881 out/original.initrd | zstd -q -dc >out/main.cpio
          (cd out/main && sudo cpio -idm --quiet --no-absolute-filenames <../main.cpio)
          sudo cp out/main/usr/lib/live/boot/9990-main.sh out/main-original.sh
          sudo python3 input/patches/v118/precreate_user.py out/main
          sudo python3 input/patches/v122/disable_liveconfig.py out/main
          sudo python3 input/patches/v123/presystemd_x11.py out/main
          sudo python3 input/patches/v125/require_early_drm.py out/main
          sudo python3 input/patches/v126/preserve_xsocket.py out/main
          sudo python3 input/patches/v124/diagnose_early_x11.py out/main
          sudo sh -n out/main/usr/lib/live/boot/9990-main.sh
          sudo diff -u out/main-original.sh out/main/usr/lib/live/boot/9990-main.sh >out/reports/ONLY_V123_PRESYSTEMD_X11_DIFF || test "$?" -eq 1
          (cd out/main && sudo find . -print0 | LC_ALL=C sort -z | sudo cpio -o --null -H newc --quiet) >out/modified.cpio
          zstd -q -3 -T2 -o out/modified.cpio.zst out/modified.cpio
          cat out/early-prefix out/modified.cpio.zst >out/candidate.initrd
          cmp -n 36154880 out/original.initrd out/candidate.initrd
          xorriso -indev input/base.iso -outdev out/stage.iso -map out/candidate.initrd /live/initrd.img -map out/candidate.initrd /live/initrd.img-6.12.115+deb13.1-amd64 -boot_image any replay -commit -end >out/reports/stage.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          entries=Path('out/original.sha256sum.txt').read_text().splitlines()
          assert len(entries)==293
          digest=hashlib.sha256(Path('out/candidate.initrd').read_bytes()).hexdigest()
          changed={'./live/initrd.img','./live/initrd.img-6.12.115+deb13.1-amd64'}
          new=[];seen=set()
          for line in entries:
              m=re.fullmatch(r'([0-9a-fA-F]{64})( [ *])(.*)',line);assert m,line
              name=m.group(3);assert name not in seen;seen.add(name)
              new.append((digest if name in changed else m.group(1))+m.group(2)+name)
          assert changed.issubset(seen),changed-seen
          Path('out/sha256sum.txt').write_text('\n'.join(new)+'\n')
          PY
          xorriso -indev out/stage.iso -outdev out/candidate.iso -map out/sha256sum.txt /sha256sum.txt -boot_image any replay -commit -end >out/reports/repack.log 2>&1
          xorriso -osirrox on -indev out/candidate.iso -extract /live/initrd.img out/recheck/initrd -extract /live/initrd-full.img out/recheck/fallback -extract /live/filesystem.squashfs out/recheck/root -extract /sha256sum.txt out/recheck/sha256sum.txt >out/reports/recheck.log 2>&1
          cmp out/candidate.initrd out/recheck/initrd
          cmp out/original-full.initrd out/recheck/fallback
          cmp out/original.squashfs out/recheck/root
          cmp out/sha256sum.txt out/recheck/sha256sum.txt
          sha256sum input/base.iso out/candidate.iso >out/reports/iso-hashes.txt
      - name: Preserve v126 baseline and build checksum-audited v127 early parallel Firefox ISO
        timeout-minutes: 7
        run: |
          set -euo pipefail
          sudo python3 input/patches/v127/parallel_firefox.py out/main
          sudo sh -n out/main/usr/lib/live/boot/9990-main.sh
          grep -Fq 'P50_V127_FIREFOX_DIRECT_EXEC' out/main/usr/lib/live/boot/9990-main.sh
          grep -Fq 'P50_V127_BROWSER_START_RELOCATED' out/main/usr/lib/live/boot/9990-main.sh
          (cd out/main && sudo find . -print0 | LC_ALL=C sort -z | sudo cpio -o --null -H newc --quiet) >out/v127.cpio
          zstd -q -3 -T2 -o out/v127.cpio.zst out/v127.cpio
          cat out/early-prefix out/v127.cpio.zst >out/v127.initrd
          cmp -n 36154880 out/original.initrd out/v127.initrd
          xorriso -indev input/base.iso -outdev out/v127-stage.iso \
            -map out/v127.initrd /live/initrd.img \
            -map out/v127.initrd /live/initrd.img-6.12.115+deb13.1-amd64 \
            -boot_image any replay -commit -end >out/reports/v127-stage.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          entries=Path('out/original.sha256sum.txt').read_text().splitlines()
          assert len(entries)==293
          digest=hashlib.sha256(Path('out/v127.initrd').read_bytes()).hexdigest()
          changed={'./live/initrd.img','./live/initrd.img-6.12.115+deb13.1-amd64'}
          out=[];seen=set()
          for line in entries:
              m=re.fullmatch(r'([0-9a-fA-F]{64})( [ *])(.*)',line)
              assert m,line
              name=m.group(3)
              if name in changed:seen.add(name)
              out.append((digest if name in changed else m.group(1))+m.group(2)+name)
          assert seen==changed
          Path('out/v127.manifest').write_text('\n'.join(out)+'\n')
          PY
          xorriso -indev out/v127-stage.iso -outdev out/v127.iso \
            -map out/v127.manifest /sha256sum.txt -boot_image any replay \
            -commit -end >out/reports/v127-final.log 2>&1
          mkdir -p out/v127-recheck
          xorriso -osirrox on -indev out/v127.iso \
            -extract /live/initrd.img out/v127-recheck/initrd \
            -extract /live/initrd.img-6.12.115+deb13.1-amd64 out/v127-recheck/initrd-versioned \
            -extract /live/filesystem.squashfs out/v127-recheck/root \
            -extract /live/initrd-full.img out/v127-recheck/fallback \
            -extract /sha256sum.txt out/v127-recheck/manifest \
            >out/reports/v127-verify.log 2>&1
          cmp out/v127.initrd out/v127-recheck/initrd
          cmp out/v127.initrd out/v127-recheck/initrd-versioned
          cmp out/original.squashfs out/v127-recheck/root
          cmp out/original-full.initrd out/v127-recheck/fallback
          cmp out/v127.manifest out/v127-recheck/manifest
          sha256sum out/candidate.iso out/v127.iso >out/reports/v127-ISO-hashes.txt
          echo 'P50_V127_TWO_COLD_ISOS_VERIFIED_ROOT_AND_FALLBACK_IDENTICAL'
      - name: Build second ISO prefetching 96MiB of libxul while initializing DRM
        timeout-minutes: 7
        run: |
          set -euo pipefail
          sudo python3 input/patches/v131/prefetch_firefox.py out/main
          sudo sh -n out/main/usr/lib/live/boot/9990-main.sh
          grep -Fq 'P50_V131_READAHEAD_STARTED' out/main/usr/lib/live/boot/9990-main.sh
          (cd out/main && sudo find . -print0 | LC_ALL=C sort -z | sudo cpio -o --null -H newc --quiet) >out/v131.cpio
          zstd -q -3 -T2 -o out/v131.cpio.zst out/v131.cpio
          cat out/early-prefix out/v131.cpio.zst >out/v131.initrd
          cmp -n 36154880 out/original.initrd out/v131.initrd
          xorriso -indev out/v127.iso -outdev out/v131-stage.iso \
            -map out/v131.initrd /live/initrd.img \
            -map out/v131.initrd /live/initrd.img-6.12.115+deb13.1-amd64 \
            -boot_image any replay -commit -end >out/reports/v131-stage.log 2>&1
          python3 - <<'PY'
          import hashlib,re
          from pathlib import Path
          entries=Path('out/v127.manifest').read_text().splitlines()
          assert len(entries)==293
          digest=hashlib.sha256(Path('out/v131.initrd').read_bytes()).hexdigest()
          names={'./live/initrd.img','./live/initrd.img-6.12.115+deb13.1-amd64'}
          lines=[];seen=set()
          for line in entries:
              m=re.fullmatch(r'([0-9a-fA-F]{64})( [ *])(.*)',line)
              assert m,line
              name=m.group(3)
              if name in names:seen.add(name)
              lines.append((digest if name in names else m.group(1))+m.group(2)+name)
          assert seen==names
          Path('out/v131.manifest').write_text('\n'.join(lines)+'\n')
          PY
          xorriso -indev out/v131-stage.iso -outdev out/v131.iso \
            -map out/v131.manifest /sha256sum.txt -boot_image any replay \
            -commit -end >out/reports/v131-repack.log 2>&1
          mkdir -p out/v131-recheck
          xorriso -osirrox on -indev out/v131.iso \
            -extract /live/initrd.img out/v131-recheck/initrd \
            -extract /live/initrd-full.img out/v131-recheck/fallback \
            -extract /live/filesystem.squashfs out/v131-recheck/root \
            -extract /sha256sum.txt out/v131-recheck/manifest >out/reports/v131-audit.log 2>&1
          cmp out/v131.initrd out/v131-recheck/initrd
          cmp out/original-full.initrd out/v131-recheck/fallback
          cmp out/original.squashfs out/v131-recheck/root
          cmp out/v131.manifest out/v131-recheck/manifest
          sha256sum out/v127.iso out/v131.iso >out/reports/v131-ISO-hashes.txt
          echo P50_V131_TWO_ISOS_RETAIN_IDENTICAL_FIREFOX_KERNEL_ROOT_AND_FALLBACK
      - name: Build second candidate changing ONLY early guest hostname mapping
        timeout-minutes: 7
        run: |
          set -euo pipefail
          sudo python3 input/patches/v135/preconfigure_hostname.py out/main
          sudo sh -n out/main/usr/lib/live/boot/9990-main.sh
          grep -Fq 'P50_V135_HOST_MAPPING_ADDED' out/main/usr/lib/live/boot/9990-main.sh
          (cd out/main && sudo find . -print0 | LC_ALL=C sort -z | sudo cpio -o --null -H newc --quiet) >out/v135.cpio
          zstd -q -3 -T2 -o out/v135.cpio.zst out/v135.cpio
          cat out/early-prefix out/v135.cpio.zst >out/v135.initrd
          cmp -n 36154880 out/original.initrd out/v135.initrd
          xorriso -indev out/v131.iso -outdev out/v135-stage.iso \
            -map out/v135.initrd /live/initrd.img \
            -map out/v135.initrd /live/initrd.img-6.12.115+deb13.1-amd64 \
            -boot_image any replay -commit -end >out/reports/v135-stage.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          original=Path('out/v131.manifest').read_text().splitlines()
          assert len(original)==293
          newhash=hashlib.sha256(Path('out/v135.initrd').read_bytes()).hexdigest()
          changed={'./live/initrd.img','./live/initrd.img-6.12.115+deb13.1-amd64'}
          out=[];seen=set()
          for line in original:
              m=re.fullmatch(r'([0-9a-fA-F]{64})( [ *])(.*)',line)
              assert m,line
              name=m.group(3)
              if name in changed:seen.add(name)
              out.append((newhash if name in changed else m.group(1))+m.group(2)+name)
          assert seen==changed
          Path('out/v135.manifest').write_text('\n'.join(out)+'\n')
          PY
          xorriso -indev out/v135-stage.iso -outdev out/v135.iso \
            -map out/v135.manifest /sha256sum.txt -boot_image any replay \
            -commit -end >out/reports/v135-final.log 2>&1
          mkdir -p out/v135-verify
          xorriso -osirrox on -indev out/v135.iso \
            -extract /live/initrd.img out/v135-verify/initrd \
            -extract /live/initrd-full.img out/v135-verify/full \
            -extract /live/filesystem.squashfs out/v135-verify/root \
            -extract /sha256sum.txt out/v135-verify/manifest >out/reports/v135-audit.log 2>&1
          cmp out/v135.initrd out/v135-verify/initrd
          cmp out/original-full.initrd out/v135-verify/full
          cmp out/original.squashfs out/v135-verify/root
          cmp out/v135.manifest out/v135-verify/manifest
          sha256sum out/v131.iso out/v135.iso >out/reports/v135-ISO-sha256.txt
          echo P50_V135_IDENTICAL_KERNEL_ROOT_FIREFOX_AND_RECOVERY
      - name: Build second ISO adding ONLY increased libxul prefetch depth on v135 hosts ISO
        timeout-minutes: 7
        run: |
          set -euo pipefail
          sudo python3 input/patches/v136/prefetch_256.py out/main
          sudo sh -n out/main/usr/lib/live/boot/9990-main.sh
          grep -Fq 'P50_V133_PREFETCH_256MB_STARTED' out/main/usr/lib/live/boot/9990-main.sh
          (cd out/main && sudo find . -print0 | LC_ALL=C sort -z | sudo cpio -o --null -H newc --quiet) >out/v136.cpio
          zstd -q -3 -T2 -o out/v136.cpio.zst out/v136.cpio
          cat out/early-prefix out/v136.cpio.zst >out/v136.initrd
          cmp -n 36154880 out/original.initrd out/v136.initrd
          xorriso -indev out/v135.iso -outdev out/v136-stage.iso \
            -map out/v136.initrd /live/initrd.img \
            -map out/v136.initrd /live/initrd.img-6.12.115+deb13.1-amd64 \
            -boot_image any replay -commit -end >out/reports/v136-stage.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          entries=Path('out/v135.manifest').read_text().splitlines()
          assert len(entries)==293
          sha=hashlib.sha256(Path('out/v136.initrd').read_bytes()).hexdigest()
          changed={'./live/initrd.img','./live/initrd.img-6.12.115+deb13.1-amd64'}
          found=set();rows=[]
          for line in entries:
              m=re.fullmatch(r'([0-9a-fA-F]{64})( [ *])(.*)',line); assert m,line
              name=m.group(3)
              if name in changed: found.add(name)
              rows.append((sha if name in changed else m.group(1))+m.group(2)+name)
          assert found==changed
          Path('out/v136.manifest').write_text('\n'.join(rows)+'\n')
          PY
          xorriso -indev out/v136-stage.iso -outdev out/v136.iso \
            -map out/v136.manifest /sha256sum.txt \
            -boot_image any replay -commit -end >out/reports/v136-final.log 2>&1
          mkdir -p out/v136-check
          xorriso -osirrox on -indev out/v136.iso \
            -extract /live/initrd.img out/v136-check/initrd \
            -extract /live/initrd-full.img out/v136-check/fallback \
            -extract /live/filesystem.squashfs out/v136-check/root \
            -extract /sha256sum.txt out/v136-check/manifest >out/reports/v136-audit.log 2>&1
          cmp out/v136.initrd out/v136-check/initrd
          cmp out/original-full.initrd out/v136-check/fallback
          cmp out/original.squashfs out/v136-check/root
          cmp out/v136.manifest out/v136-check/manifest
          sha256sum out/v135.iso out/v136.iso >out/reports/v136-ISO-sha256.txt
          echo P50_V136_BOTH_ISOS_IDENTICAL_ROOT_KERNEL_RECOVERY_AND_FIREFOX_BINARY
      - name: Build otherwise identical ISO selecting VT7 for early Xorg without touching tty1 getty
        timeout-minutes: 7
        run: |
          set -euo pipefail
          sudo python3 input/patches/v144/xorg_vt7.py out/main
          sudo sh -n out/main/usr/lib/live/boot/9990-main.sh
          grep -Fq 'P50_V144_XORG_VT7_SELECTED' out/main/usr/lib/live/boot/9990-main.sh
          (cd out/main && sudo find . -print0 | LC_ALL=C sort -z | sudo cpio -o --null -H newc --quiet) >out/v144.cpio
          zstd -q -3 -T2 -o out/v144.cpio.zst out/v144.cpio
          cat out/early-prefix out/v144.cpio.zst >out/v144.initrd
          cmp -n 36154880 out/original.initrd out/v144.initrd
          xorriso -indev out/v136.iso -outdev out/v144-stage.iso \
            -map out/v144.initrd /live/initrd.img \
            -map out/v144.initrd /live/initrd.img-6.12.115+deb13.1-amd64 \
            -boot_image any replay -commit -end >out/reports/v144-stage.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          entries=Path('out/v136.manifest').read_text().splitlines()
          assert len(entries)==293
          digest=hashlib.sha256(Path('out/v144.initrd').read_bytes()).hexdigest()
          targets={'./live/initrd.img','./live/initrd.img-6.12.115+deb13.1-amd64'}
          seen=set();out=[]
          for line in entries:
              m=re.fullmatch(r'([0-9a-fA-F]{64})( [ *])(.*)',line);assert m,line
              name=m.group(3)
              if name in targets:seen.add(name)
              out.append((digest if name in targets else m.group(1))+m.group(2)+name)
          assert seen==targets
          Path('out/v144.manifest').write_text('\n'.join(out)+'\n')
          PY
          xorriso -indev out/v144-stage.iso -outdev out/v144.iso \
            -map out/v144.manifest /sha256sum.txt -boot_image any replay \
            -commit -end >out/reports/v144-final.log 2>&1
          mkdir -p out/v144-recheck
          xorriso -osirrox on -indev out/v144.iso \
            -extract /live/initrd.img out/v144-recheck/initrd \
            -extract /live/initrd-full.img out/v144-recheck/fallback \
            -extract /live/filesystem.squashfs out/v144-recheck/root \
            -extract /sha256sum.txt out/v144-recheck/manifest >out/reports/v144-audit.log 2>&1
          cmp out/v144.initrd out/v144-recheck/initrd
          cmp out/original-full.initrd out/v144-recheck/fallback
          cmp out/original.squashfs out/v144-recheck/root
          cmp out/v144.manifest out/v144-recheck/manifest
          sha256sum out/v136.iso out/v144.iso >out/reports/v144-ISO-hashes.txt
          echo P50_V144_IDENTICAL_KERNEL_ROOT_FIREFOX_AND_RECOVERY_ONLY_VIRTUAL_TERMINAL
      - name: Use identical 0.2s SATA CD optical benchmark on both conditions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('input/source/web109/boot_bench_staged.py')
          s=p.read_text()
          needle="time.sleep(.05 if args.select_fullram_fallback and not result['fullram_fallback_selected'] else .8)"
          assert s.count(needle)==1
          s=s.replace(needle,needle.replace('else .8','else .2'),1)
          old="cmd += ['-device', 'qemu-xhci,id=xhci', '-device', 'usb-storage,drive=livecd,id=bootusb,bootindex=1']"
          new="cmd += ['-device', 'ich9-ahci,id=ahci', '-device', 'ide-cd,drive=livecd,bus=ahci.0,id=bootusb,bootindex=1']"
          assert s.count(old)==1
          s=s.replace(old,new,1)
          assert s.count("if args.media == 'optical':")==1
          s=s.replace("if args.media == 'optical':","if True:  # AHCI CD medium ejection",1)
          p2=Path('input/source/web109/boot_bench_ahci.py')
          p2.write_text(s)
          import ast
          ast.parse(s)
          PY
      - name: Start local offline/online browser fixture
        env:
          P50_NONCE: P50-${{ github.run_id }}
        run: |
          nohup python3 -u input/source/web103/fixture_server.py --fixture fixture/unused.mp4 --nonce "$P50_NONCE" --port 8765 >out/reports/fixture-after.log 2>&1 </dev/null &
          nohup python3 -u input/source/web112/early_fixture.py --port 8766 >out/reports/fixture-early.log 2>&1 </dev/null &
          python3 -c 'import socket,time; time.sleep(2); [socket.create_connection(("127.0.0.1",p),timeout=5).close() for p in (8765,8766)]'
      - name: Four independent cold boot inspections of exact candidate ISO BIOS UEFI BIOS UEFI
        timeout-minutes: 34
        run: |
          set -euo pipefail
          for label in bios1 uefi1 bios2 uefi2; do
            case "$label" in bios*) fw=bios;; uefi*) fw=uefi;; esac
            python3 -u input/source/web109/boot_bench_ahci.py \
              --iso out/v144.iso --out "out/$label" --mode online \
              --allow-no-startup-probe --wait-ram-ready \
              --ram 3072 --seconds 100 --cpu-model i3-540-conservative \
              --emulate-acer-id --firmware "$fw" --media usb --bandwidth 0
          done
          python3 - <<'PY'
          from pathlib import Path
          import json,re,os,statistics,hashlib
          names=('bios1','uefi1','bios2','uefi2')
          d={}
          for n in names:
              r=json.loads((Path('out')/n/'result.json').read_text())
              assert r['virtual_firmware']==n.rstrip('12'),(n,r)
              assert r['first_home_seen_seconds'] is not None,(n,'actual Firefox framebuffer missing')
              assert r['staged_ram_ready_seconds'] is not None,(n,'verified RAM transition missing')
              assert r['media_ejected'] and r['input_sent_after_eject'] and r['qemu_running_at_end'] and not r['errors'],(n,r)
              serial=(Path('out')/n/'serial.log').read_text(errors='replace')
              for marker in ('P50_V125_EARLY_DRM_READY','P50_V126_EARLY_SOCKET_PRESERVED',
                             'P50_V127_FIREFOX_DIRECT_EXEC','P50_V131_READAHEAD_COMPLETE',
                             'P50_V133_PREFETCH_256MB_STARTED','P50_V144_XORG_VT7_SELECTED',
                             'P50_STAGE_COPY_VERIFIED','P50_STAGE_READY'):
                  assert marker in serial,(n,'boot prerequisite',marker)
              crit=serial[serial.index('P50_V124_FORENSICS_START'):serial.index('P50_V124_FORENSICS_END')+len('P50_V124_FORENSICS_END')]
              assert ' -noreset vt7' in crit,(n,'not protected VT7')
              assert '/usr/sbin/lightdm' not in crit,(n,'late desktop display fallback')
              assert '/usr/lib/xorg/Xorg :0 -auth /home/user/.Xauthority' in crit,(n,'authenticated X11 missing')
              d[n]=r
          log=Path('out/reports/fixture-after.log').read_text()
          hits=re.findall(r'GET /after\.html\?nonce='+re.escape(os.environ['P50_NONCE'])+r' HTTP/1\.1" 200 ',log)
          assert len(hits)==4,('missing HTTP 200 issued by browser after medium safely ejected',len(hits))
          iso=Path('out/v144.iso')
          report={
            'scope':'four REAL cold QEMU boots of EXACT shipping ISO (2 BIOS and 2 UEFI)',
            'sha256':hashlib.sha256(iso.read_bytes()).hexdigest(),
            'first_visible_Firefox_frame_seconds':{n:d[n]['first_home_seen_seconds'] for n in names},
            'checksum_verified_whole_root_in_RAM_all_four':True,
            'virtual_CD_removed_after_RAM_all_four':True,
            'real_browser_HTTP200_receipts_after_CD_removal':len(hits),
            'all_four_real_Firefox_under_five_seconds':all(d[n]['first_home_seen_seconds']<5 for n in names),
            'original_Zstd_root_and_full_RAM_recovery_preserved':True,
            'physical_Acer_i3_540_tested':False,
            'full_RAM_in_384MiB_possible':False
          }
          Path('out/reports/v150-exact-ISO-release-smoke.json').write_text(json.dumps(report,indent=2)+'\n')
          print('P50_V150_EXACT_ISO_RELEASE_GATE_PASS',json.dumps(report,indent=2))
          PY
      - name: Prepare ISO ZIP and cryptographic SHA sums (experimental, not five seconds)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p release/Puppy50_v150
          cp out/v144.iso release/Puppy50_v150/Puppy50_v150_VT7_Firefox_EXPERIMENTAL.iso
          cat >release/Puppy50_v150/README.txt <<'README'
          Puppy50 v150 — optimized VT7 Firefox ESR — EXPERIMENTAL
          ======================================================
          This IS NOT the official Puppy Linux operating system.
          It is an experimental Debian Live Firefox ESR research OS.
          It has NOT achieved or proven a complete five-second cold boot.

          Preserves 64-bit Debian kernel, Zstandard SquashFS root, original
          full-RAM recovery and original Firefox ESR sandbox. On a matched
          4-boot VM test, first Firefox frame averaged 7.105 seconds with
          protected early Xorg on VT7 vs 7.265 seconds for VT1 original.
          https://github.com/74127418528426leo-del/Test/actions/runs/43522338499
          This *exact* ISO is separately tested on TWO BIOS and TWO UEFI
          QEMU cold boots with real Firefox frame detection, full-root RAM
          checksum, optical media ejection only after RAM verification,
          and browser HTTP200 after ejection.
          Read the publishing GitHub Actions evidence for the exact timings.

          On physical Acer Aspire X3950: NO verified boot time, hardware
          i915 video, dual monitor, 4K Youtube, Wi-Fi or USB transport.
          Even verified KVM cold-first-frame times DO NOT include the
          later full-RAM READY completion time, typically ~14 seconds
          on these virtualized hosts.

          NOT 384 MiB RAM only. 664+MiB compressed root plus Firefox
          needs far more RAM. Validated on a 3072 MiB VM. Prefer at least
          4GiB for actual experiments.

          Keep a separate original v115 recovery boot USB:
          https://github.com/74127418528426leo-del/Test/releases/tag/puppy50-v114-fast-verification-experimental

          Keep the boot device plugged in until GREEN verified RAM READY.
          Do not remove it early. Retain a separate tested rescue medium.
          Writing the ISO destroys all current data on selected USB device.
          On Linux check downloads: sha256sum -c SHA256SUMS
          README
          (cd release/Puppy50_v150 && sha256sum Puppy50_v150_VT7_Firefox_EXPERIMENTAL.iso >SHA256SUMS && sha256sum -c SHA256SUMS)
          (cd release && zip -q -0 -r Puppy50_v150_VT7_Firefox_EXPERIMENTAL.zip Puppy50_v150)
          unzip -tqq release/Puppy50_v150_VT7_Firefox_EXPERIMENTAL.zip
          (cd release && sha256sum Puppy50_v150_VT7_Firefox_EXPERIMENTAL.zip >ZIP_SHA256SUMS)
          cp release/Puppy50_v150/SHA256SUMS out/reports/v150-shipping-iso-sha256.txt
          cp release/ZIP_SHA256SUMS out/reports/v150-shipping-zip-sha256.txt
      - name: Publish only if identical built ISO passed all four independent functional cold boots
        timeout-minutes: 10
        run: |
          set -euo pipefail
          tag=puppy50-v150-vt7-early-firefox-experimental
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1;then
            echo 'No overwrites of an existing ISO release' >&2
            exit 1
          fi
          cat > release/RELEASE.md <<'NOTES'
          # Puppy50 v150 — experimental early Firefox with Xorg VT7

          **This is NOT a verified five-second OS.** It is an experimental
          Debian Live Firefox ESR image. All **four EXACT shipping ISO**
          cold boots (two BIOS and two UEFI) in this GitHub Actions run passed
          actual rendered Firefox frame, SHA verified root migration into RAM,
          safe CD removal and subsequent browser HTTP 200.

          Cross-host startup times and physical Acer boot duration **remain
          unverified**; there is NO 384MiB full-RAM Firefox support, nor
          real Wi-Fi, i915, dual monitor or YouTube 4K certification.

          Matched earlier VT1 versus VT7 improvement:
          https://github.com/74127418528426leo-del/Test/actions/runs/43522338499

          Keep the original v115 recovery USB and never remove boot
          medium until GREEN verified RAM READY.
          NOTES
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Puppy50 v150 Firefox VT7 — Experimental (NOT five seconds)' \
            --notes-file release/RELEASE.md --prerelease \
            release/Puppy50_v150/Puppy50_v150_VT7_Firefox_EXPERIMENTAL.iso \
            release/Puppy50_v150_VT7_Firefox_EXPERIMENTAL.zip \
            release/Puppy50_v150/README.txt \
            release/Puppy50_v150/SHA256SUMS \
            release/ZIP_SHA256SUMS
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name) \(.size) bytes"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puppy50-v150-exact-shipping-bios-uefi-evidence
          path: |
            out/reports/
            out/bios1/
            out/uefi1/
            out/bios2/
            out/uefi2/
          retention-days: 14
          if-no-files-found: warn
