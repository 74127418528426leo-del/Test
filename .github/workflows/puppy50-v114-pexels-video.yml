name: Puppy50 v114 Pexels browser video inspection
on:
  push:
    branches: [puppy50-v114-requested-sites]
    paths: [.github/workflows/puppy50-v114-pexels-video.yml]
permissions:
  contents: read
  actions: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install VM tools and verify harness
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 python3-pil
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          mkdir -p input out/reports fixture
          python3 -m unittest discover -s web112 -p 'test_*.py' -v
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web103/site_test.py');s=p.read_text();marker='def char_keys(c):'
          assert s.count(marker)==1
          p.write_text(s.replace(marker,"PUNCT['#']=['shift','3']\n\n"+marker,1))
          from web103.site_test import char_keys
          assert char_keys('#')==['shift','3']
          PY
          python3 web112/site_probe.py web109/boot_bench_staged.py web112/generated_site_bench.py
          python3 -m unittest discover -s web114site -p 'test_*.py' -v
          python3 web114site/pexels_probe.py web112/generated_site_bench.py web114site/generated_pexels_bench.py
          python3 -m py_compile web112/generated_site_bench.py
          lscpu >out/reports/host-cpu.txt
      - uses: actions/download-artifact@v4
        with:
          name: Puppy50-v114-clean-hash-test-only-iso
          run-id: 42599688500
          github-token: ${{ github.token }}
          path: input
      - name: Verify image and prepare local RAM-removal fixture
        env:
          P50_NONCE: P50-${{ github.run_id }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'bf19a63758fbb6ab9aad5cb3b04c9b0e97b32944ab30f304fa16a205c78096b9' input/candidate.iso | sha256sum -c -
          nohup python3 -u web103/fixture_server.py --fixture fixture/unused.mp4 --nonce "$P50_NONCE" --port 8765 >out/reports/fixture.log 2>&1 </dev/null &
          python3 -c 'import socket,time; time.sleep(2); socket.create_connection(("127.0.0.1",8765),timeout=5).close()'
      - name: Capture requested page after RAM migration
        env:
          P50_NONCE: P50-${{ github.run_id }}
          P50_TEST_URL: https://www.pexels.com/video/riverside-27251986/
        run: |
          set -euo pipefail
          python3 -u web114site/generated_pexels_bench.py --iso input/candidate.iso --out out/qemu --mode online --allow-no-startup-probe --wait-ram-ready --ram 3072 --seconds 210 --cpu-model i3-540-conservative --emulate-acer-id --media usb --bandwidth 31457280
          test -s out/qemu/requested_site.png
          test -s out/qemu/frame_365.ppm
          test -s out/qemu/frame_415.ppm
          test -s out/qemu/frame_455.ppm
          grep -F "GET /after.html?nonce=$P50_NONCE" out/reports/fixture.log | grep -F ' 200 '
          printf '%s\n' 'A screenshot was captured. Website availability and video playback/resolution require review; this is not a 4K playback test.' >out/reports/interpretation.txt
      - name: Preserve screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50-v114-pexels-video-inspection
          path: out/
          if-no-files-found: warn
          retention-days: 30
