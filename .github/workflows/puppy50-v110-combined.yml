name: Puppy50 v110 combined Intel and USB comparison
on:
  push:
    branches: [puppy50-v110-boot-research]
    paths: [.github/workflows/puppy50-v110-combined.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install ISO and virtual-machine tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso qemu-system-x86 python3-pil
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          mkdir -p input out/{reports,tree,rechecked} fixture
          lscpu >out/reports/host-cpu.txt
      - uses: actions/download-artifact@v4
        with:
          name: Puppy50-v110-intel-initrd-test-only-iso
          run-id: 42458143496
          github-token: ${{ github.token }}
          path: input/lean
      - name: Download and verify the exact published v109 ISO
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error -o input/v109.iso 'https://github.com/74127418528426leo-del/Test/releases/download/puppy50-v109-faststart-ram-experimental/Puppy50_v109_FastStart_RAM_EXPERIMENTAL.iso'
          printf '%s  %s\n' 'e6b341ae3a272bb6bfa063814b2b61a14ba9dadd5f41137a8203f651120671da' input/v109.iso | sha256sum -c -
          printf '%s  %s\n' '99c4cec4b446791beadf3c1a01cb098afd530b0ecba93012d2fe4fde80e4dd35' input/lean/candidate.iso | sha256sum -c -
          xorriso -osirrox on -indev input/lean/candidate.iso -extract /isolinux/live.cfg out/bios.cfg -extract /boot/grub/grub.cfg out/grub.cfg -extract /live/filesystem.squashfs out/base.squashfs >out/reports/extract.log 2>&1
      - name: Combine Intel-focused startup with shorter USB discovery delay
        run: |
          set -euo pipefail
          chmod u+w out/bios.cfg out/grub.cfg
          python3 - <<'PY'
          from pathlib import Path
          old = 'boot=live components quiet locales=en_US.UTF-8'
          new = 'boot=live components usb-storage.delay_use=0 quiet locales=en_US.UTF-8'
          for p in (Path('out/bios.cfg'), Path('out/grub.cfg')):
              s = p.read_text()
              assert s.count(old) == 1, (str(p), s.count(old))
              assert 'usb-storage.delay_use=' not in s
              p.write_text(s.replace(old, new, 1))
              assert p.read_text().count(new) == 1
          PY
          xorriso -indev input/lean/candidate.iso -outdev out/stage.iso -map out/bios.cfg /isolinux/live.cfg -map out/grub.cfg /boot/grub/grub.cfg -boot_image any replay -commit -end >out/reports/stage.log 2>&1
          xorriso -osirrox on -indev out/stage.iso -extract / out/tree >out/reports/tree.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re
          root = Path('out/tree').resolve()
          lines, seen = [], set()
          for line in (root / 'sha256sum.txt').read_text().splitlines():
              m = re.fullmatch(r'([0-9a-fA-F]{64})( [ *])(.*)', line)
              assert m, repr(line)
              name = m.group(3)
              assert name.startswith('./') and name not in seen
              seen.add(name)
              target = (root / name).resolve(strict=True)
              target.relative_to(root)
              assert target.is_file() and name != './sha256sum.txt'
              h = hashlib.sha256()
              with target.open('rb') as f:
                  for block in iter(lambda: f.read(1048576), b''):
                      h.update(block)
              lines.append(h.hexdigest() + m.group(2) + name)
          assert len(lines) == 293
          Path('out/sha256sum.txt').write_text('\n'.join(lines) + '\n')
          PY
          xorriso -indev out/stage.iso -outdev out/candidate.iso -map out/sha256sum.txt /sha256sum.txt -boot_image any replay -commit -end >out/reports/repack.log 2>&1
          xorriso -osirrox on -indev out/candidate.iso -extract / out/rechecked >out/reports/recheck.log 2>&1
          cmp out/base.squashfs out/rechecked/live/filesystem.squashfs
          cmp out/bios.cfg out/rechecked/isolinux/live.cfg
          cmp out/grub.cfg out/rechecked/boot/grub/grub.cfg
          (cd out/rechecked && sha256sum -c sha256sum.txt) >out/reports/media-checksums.txt
          sha256sum input/v109.iso input/lean/candidate.iso out/candidate.iso >out/reports/iso-hashes.txt
      - name: Start local post-removal test page
        env:
          P50_NONCE: P50-${{ github.run_id }}
        run: |
          set -euo pipefail
          nohup python3 -u web103/fixture_server.py --fixture fixture/unused.mp4 --nonce "$P50_NONCE" --port 8765 >out/reports/fixture.log 2>&1 </dev/null &
          python3 -c 'import socket,time; time.sleep(2); socket.create_connection(("127.0.0.1",8765),timeout=5).close()'
      - name: Compare matched virtual boots in alternating order
        timeout-minutes: 15
        env:
          P50_NONCE: P50-${{ github.run_id }}
        run: |
          set -euo pipefail
          bench() { python3 -u web109/boot_bench_staged.py --iso "$1" --out "out/$2" --mode online --allow-no-startup-probe --wait-ram-ready --ram 3072 --seconds 210 --cpu-model i3-540-conservative --emulate-acer-id --media usb --bandwidth 31457280; }
          bench input/v109.iso base1
          bench out/candidate.iso cand1
          bench out/candidate.iso cand2
          bench input/v109.iso base2
          test "$(grep -c "GET /after.html?nonce=$P50_NONCE.* 200 " out/reports/fixture.log)" -eq 4
          if grep -Ei 'warning.*(unsupported|not support|requested feature)' out/{base1,cand1,cand2,base2}/qemu.log; then exit 1; fi
          python3 - <<'PY'
          import json, statistics
          from pathlib import Path
          names = ('base1', 'cand1', 'cand2', 'base2')
          results = {n: json.loads((Path('out') / n / 'result.json').read_text()) for n in names}
          assert all(r['first_home_seen_seconds'] is not None and r['staged_ram_ready_seconds'] is not None and r['media_ejected'] and r['input_sent_after_eject'] and r['qemu_running_at_end'] and not r['errors'] for r in results.values())
          summary = {'results': {n: {'first_home_seconds': r['first_home_seen_seconds'], 'ram_ready_seconds': r['staged_ram_ready_seconds']} for n, r in results.items()}}
          for label, pair in [('baseline', ('base1', 'base2')), ('candidate', ('cand1', 'cand2'))]:
              summary[label + '_home_mean'] = statistics.mean(results[n]['first_home_seen_seconds'] for n in pair)
              summary[label + '_ready_mean'] = statistics.mean(results[n]['staged_ram_ready_seconds'] for n in pair)
          summary['home_difference_seconds'] = summary['baseline_home_mean'] - summary['candidate_home_mean']
          summary['physical_acer_tested'] = False
          summary['sample_interval_seconds'] = 0.8
          (Path('out/reports') / 'comparison.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY
      - name: Preserve timings, checksums, serial logs, and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50-v110-combined-evidence
          path: |
            out/reports/
            out/base1/
            out/base2/
            out/cand1/
            out/cand2/
          if-no-files-found: warn
          retention-days: 30
      - name: Keep test image temporarily after all tests pass
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50-v110-combined-test-only-iso
          path: |
            out/candidate.iso
            out/reports/iso-hashes.txt
          compression-level: 0
          retention-days: 3
