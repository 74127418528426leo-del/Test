name: Puppy50 v114 synthetic 4K browser playback
on:
  push:
    branches: [puppy50-v114-requested-sites]
    paths: [.github/workflows/puppy50-v114-synthetic-4k.yml]
permissions:
  contents: read
  actions: read
jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install VM and video tools, verify test code
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 python3-pil ffmpeg
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          mkdir -p input out/reports fixture
          python3 -m unittest discover -s web112 -p 'test_*.py' -v
          python3 web112/site_probe.py web109/boot_bench_staged.py web112/generated_site_bench.py
          python3 -m py_compile web112/generated_site_bench.py
          lscpu >out/reports/host-cpu.txt
      - uses: actions/download-artifact@v4
        with:
          name: Puppy50-v114-clean-hash-test-only-iso
          run-id: 42599688500
          github-token: ${{ github.token }}
          path: input
      - name: Verify exact ISO and synthesize a local 4K H.264 clip
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'bf19a63758fbb6ab9aad5cb3b04c9b0e97b32944ab30f304fa16a205c78096b9' input/candidate.iso | sha256sum -c -
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'testsrc2=size=3840x2160:rate=24' -t 12 -an -c:v libx264 -preset ultrafast -crf 38 -threads 2 -pix_fmt yuv420p -movflags +faststart -y fixture/sample.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of json fixture/sample.mp4 >out/reports/clip-metadata.json
          sha256sum fixture/sample.mp4 >out/reports/clip-sha256.txt
          python3 - <<'PY'
          import json
          d=json.load(open('out/reports/clip-metadata.json'))['streams'][0]
          assert (d['codec_name'],d['width'],d['height'],d['r_frame_rate']) == ('h264',3840,2160,'24/1'), d
          print('Synthetic H.264 source:',d)
          PY
      - name: Start independent after-removal and video fixtures
        env:
          P50_NONCE: P50-${{ github.run_id }}
        run: |
          set -euo pipefail
          nohup python3 -u web103/fixture_server.py --fixture fixture/sample.mp4 --nonce "$P50_NONCE" --port 8765 >out/reports/after-fixture.log 2>&1 </dev/null &
          nohup python3 -u web112/video4k_fixture.py --video fixture/sample.mp4 --telemetry out/reports/telemetry.jsonl --port 8766 >out/reports/video-fixture.log 2>&1 </dev/null &
          python3 -c 'import socket,time; time.sleep(2); [socket.create_connection(("127.0.0.1",p),timeout=5).close() for p in (8765,8766)]'
      - name: Play local 4K sample in the actual guest Firefox
        env:
          P50_NONCE: P50-${{ github.run_id }}
          P50_TEST_URL: http://10.0.2.2:8766/
        run: |
          set -euo pipefail
          python3 -u web112/generated_site_bench.py --iso input/candidate.iso --out out/qemu --mode online --allow-no-startup-probe --wait-ram-ready --ram 3072 --seconds 210 --cpu-model i3-540-conservative --emulate-acer-id --media usb --bandwidth 31457280
          test -s out/qemu/requested_site.png
          grep -F "GET /after.html?nonce=$P50_NONCE" out/reports/after-fixture.log | grep -F ' 200 '
          grep -F '"GET /sample.mp4' out/reports/video-fixture.log
          python3 web112/video4k_evaluate.py out/reports/telemetry.jsonl out/reports/playback-result.json
      - name: Preserve raw metrics and browser screenshot even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50-v114-synthetic-4k-evidence
          path: out/
          if-no-files-found: warn
          retention-days: 30
