name: Puppy50 v108 startup dependency audit
on:
  push:
    branches: [puppy50-v108-architecture]
    paths: [.github/workflows/puppy50-v108-startup-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso squashfs-tools
          mkdir -p input out/{root,reports}
          curl --fail --location --retry 3 -o input/v107.iso 'https://github.com/74127418528426leo-del/Test/releases/download/puppy50-v107-zstd-fastboot-experimental/Puppy50_v107_FastBoot_EXPERIMENTAL.iso'
          printf '%s  %s\n' 'cbdf605f87d345ca60d1a0a3cebb20312864c81c2a286c8eacb5acb85769c0c2' input/v107.iso | sha256sum -c -
          xorriso -osirrox on -indev input/v107.iso -extract /live/filesystem.squashfs input/root.squashfs >out/reports/extract.log 2>&1
          sudo unsquashfs -d out/root input/root.squashfs >out/reports/unsquash.log
          sudo find out/root/etc/systemd/system out/root/usr/lib/systemd/system -iname '*puppy50*' -printf '%p -> %l\n' | sort >out/reports/systemd-paths.txt
          sudo grep -R -nE 'puppy50-network-probe|network-online.target|NetworkManager-wait-online' out/root/etc/systemd/system out/root/usr/lib/systemd/system/lightdm.service out/root/usr/lib/systemd/system/NetworkManager-wait-online.service >out/reports/startup-references.txt || true
          sudo find out/root/etc/systemd/system -path '*lightdm*' -o -path '*display-manager*' >out/reports/display-paths.txt
          sudo bash -c 'for f in out/root/etc/systemd/system/puppy50-network-probe.service out/root/usr/lib/systemd/system/puppy50-network-probe.service out/root/usr/lib/systemd/system/lightdm.service out/root/etc/systemd/system/lightdm.service.d/*.conf out/root/etc/systemd/system/display-manager.service.d/*.conf; do if [ -f "$f" ]; then printf "\nFILE %s\n" "$f"; cat "$f"; fi; done' >out/reports/unit-content.txt
          sudo grep -R -n --binary-files=without-match -E 'network-mode|puppy50-network-probe|puppy50web/network' out/root/usr/local out/root/usr/share/puppy50web out/root/etc 2>/dev/null >out/reports/app-references.txt || true
          if [ -e out/root/usr/lib/firefox-esr/distribution/policies.json ]; then echo 'present' >out/reports/firefox-policy-state.txt; else echo 'absent' >out/reports/firefox-policy-state.txt; fi
          cat out/reports/systemd-paths.txt out/reports/display-paths.txt out/reports/unit-content.txt out/reports/startup-references.txt out/reports/app-references.txt out/reports/firefox-policy-state.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Puppy50-v108-startup-dependencies
          path: out/reports/
          retention-days: 30
