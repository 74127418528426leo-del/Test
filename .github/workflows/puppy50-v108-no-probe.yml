name: Puppy50 v108 browser without startup network probe
on:
  push:
    branches: [puppy50-v108-architecture]
    paths: [.github/workflows/puppy50-v108-no-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools and run behavior tests
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso squashfs-tools rsync python3-pil
          python3 -m unittest discover -s web108 -p 'test_*.py' -v
          mkdir -p input out/{original,root,verify,reports,tree,rechecked}
      - name: Pin and extract the reference image
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o input/v107.iso 'https://github.com/74127418528426leo-del/Test/releases/download/puppy50-v107-zstd-fastboot-experimental/Puppy50_v107_FastBoot_EXPERIMENTAL.iso'
          printf '%s  %s\n' 'cbdf605f87d345ca60d1a0a3cebb20312864c81c2a286c8eacb5acb85769c0c2' input/v107.iso | sha256sum -c -
          xorriso -osirrox on -indev input/v107.iso -extract /live/filesystem.squashfs input/base.squashfs >out/reports/extract.log 2>&1
          sudo unsquashfs -d out/original/root input/base.squashfs >out/reports/unsquash.log
          sudo cp -a out/original/root/. out/root/
          test ! -e out/root/usr/lib/firefox-esr/distribution/policies.json
          test ! -L out/root/usr/lib/firefox-esr/distribution/policies.json
      - name: Mask only the test-only startup network probe
        run: |
          set -euo pipefail
          sudo cp out/root/etc/systemd/system/puppy50-network-probe.service out/reports/original-probe.service
          sudo python3 web108/disable_startup_probe.py --root out/root
          test "$(readlink out/root/etc/systemd/system/puppy50-network-probe.service)" = /dev/null
          test ! -L out/root/etc/systemd/system/multi-user.target.wants/puppy50-network-probe.service
          sudo touch -r out/original/root/etc/systemd/system/multi-user.target.wants out/root/etc/systemd/system/multi-user.target.wants
          sudo touch -r out/original/root/etc/systemd/system out/root/etc/systemd/system
          sudo rsync -aHAXnci --delete --numeric-ids --exclude='/etc/systemd/system/puppy50-network-probe.service' --exclude='/etc/systemd/system/multi-user.target.wants/puppy50-network-probe.service' out/original/root/ out/root/ >out/reports/other-differences.txt
          test ! -s out/reports/other-differences.txt
          sha256sum out/root/usr/lib/firefox-esr/firefox-esr out/root/usr/sbin/NetworkManager out/root/etc/ssl/certs/ca-certificates.crt >out/reports/protected-sha256.txt
      - name: Repack and verify root filesystem
        timeout-minutes: 14
        run: |
          set -euo pipefail
          sudo mksquashfs out/root out/new.squashfs -one-file-system -comp zstd -Xcompression-level 15 -b 1M -processors 3 -mem 2048M -noappend -no-progress -exit-on-error >out/reports/compress.log 2>&1
          sudo unsquashfs -d out/verify/root out/new.squashfs >out/reports/verify-unsquash.log
          sudo rsync -aHAXnci --delete --numeric-ids out/root/ out/verify/root/ >out/reports/rsync-forward.txt
          sudo rsync -aHAXnci --delete --numeric-ids out/verify/root/ out/root/ >out/reports/rsync-reverse.txt
          test ! -s out/reports/rsync-forward.txt
          test ! -s out/reports/rsync-reverse.txt
          test "$(readlink out/verify/root/etc/systemd/system/puppy50-network-probe.service)" = /dev/null
          test ! -L out/verify/root/etc/systemd/system/multi-user.target.wants/puppy50-network-probe.service
          test ! -e out/verify/root/usr/lib/firefox-esr/distribution/policies.json
          stat -c '%n %s' input/base.squashfs out/new.squashfs >out/reports/root-sizes.txt
      - name: Rebuild ISO and update its media checksums
        id: digest
        run: |
          set -euo pipefail
          xorriso -indev input/v107.iso -outdev out/stage.iso -map out/new.squashfs /live/filesystem.squashfs -boot_image any replay -commit -end >out/reports/stage.log 2>&1
          xorriso -osirrox on -indev out/stage.iso -extract / out/tree >out/reports/tree.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          root=Path('out/tree').resolve(); lines=[]; seen=set()
          for line in (root/'sha256sum.txt').read_text().splitlines():
              m=re.fullmatch(r'([0-9a-fA-F]{64})( [ *])(.*)',line); assert m,repr(line)
              name=m.group(3); assert name.startswith('./') and name not in seen
              seen.add(name); target=(root/name).resolve(strict=True); target.relative_to(root)
              assert target.is_file() and name!='./sha256sum.txt'
              h=hashlib.sha256()
              with target.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              lines.append(h.hexdigest()+m.group(2)+name)
          assert len(lines)==292
          Path('out/sha256sum.txt').write_text('\n'.join(lines)+'\n')
          PY
          xorriso -indev out/stage.iso -outdev out/candidate.iso -map out/sha256sum.txt /sha256sum.txt -boot_image any replay -commit -end >out/reports/repack.log 2>&1
          xorriso -osirrox on -indev out/candidate.iso -extract / out/rechecked >out/reports/recheck.log 2>&1
          cmp out/new.squashfs out/rechecked/live/filesystem.squashfs
          (cd out/rechecked && sha256sum -c sha256sum.txt) >out/reports/media-checksums.txt
          grep -F 'boot=live components toram ' out/rechecked/isolinux/live.cfg
          grep -F 'boot=live components toram ' out/rechecked/boot/grub/grub.cfg
          if grep -F 'puppy50.test_bridge=1' out/rechecked/isolinux/live.cfg out/rechecked/boot/grub/grub.cfg; then exit 1; fi
          sha256sum out/candidate.iso >out/reports/candidate-sha256.txt
          stat -c '%n %s' input/v107.iso out/candidate.iso >out/reports/iso-sizes.txt
          digest=$(sha256sum out/candidate.iso | cut -d' ' -f1)
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          cat out/reports/root-sizes.txt out/reports/iso-sizes.txt out/reports/candidate-sha256.txt
      - name: Keep build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50-v108-no-probe-build-audit
          path: out/reports/
          if-no-files-found: warn
          retention-days: 30
      - name: Keep test image for guest comparisons
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50-v108-no-probe-test-only-iso
          path: |
            out/candidate.iso
            out/reports/candidate-sha256.txt
          compression-level: 0
          retention-days: 3
  comparison:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [normal, blocked-https]
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and networking test tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 python3-pil iptables
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          mkdir -p input out/reports fixture
          lscpu >out/reports/host-cpu.txt
      - uses: actions/download-artifact@v4
        with:
          name: Puppy50-v108-no-probe-test-only-iso
          path: input
      - name: Pin both images and start local page
        env:
          P50_NONCE: P50-${{ github.run_id }}-${{ matrix.scenario }}
          CANDIDATE_SHA: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$CANDIDATE_SHA" input/candidate.iso | sha256sum -c -
          curl --fail --location --retry 3 -o input/v107.iso 'https://github.com/74127418528426leo-del/Test/releases/download/puppy50-v107-zstd-fastboot-experimental/Puppy50_v107_FastBoot_EXPERIMENTAL.iso'
          printf '%s  %s\n' 'cbdf605f87d345ca60d1a0a3cebb20312864c81c2a286c8eacb5acb85769c0c2' input/v107.iso | sha256sum -c -
          nohup python3 -u web103/fixture_server.py --fixture fixture/unused.mp4 --nonce "$P50_NONCE" --port 8765 >out/reports/fixture.log 2>&1 </dev/null &
          python3 -c 'import socket,time; time.sleep(2); socket.create_connection(("127.0.0.1",8765),timeout=5).close()'
      - name: Compare reference and candidate in alternating order
        timeout-minutes: 16
        env:
          SCENARIO: ${{ matrix.scenario }}
          P50_NONCE: P50-${{ github.run_id }}-${{ matrix.scenario }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$SCENARIO" = blocked-https ]; then
            runner_uid=$(id -u)
            sudo iptables -I OUTPUT -p tcp --dport 443 -m owner --uid-owner "$runner_uid" -j DROP
            cleanup() { sudo iptables -D OUTPUT -p tcp --dport 443 -m owner --uid-owner "$runner_uid" -j DROP || true; }
            trap cleanup EXIT
            if curl --noproxy '*' --silent --connect-timeout 3 --max-time 5 https://example.com/ >/dev/null; then echo 'HTTPS unexpectedly reachable' >&2; exit 1; fi
            extra+=(--expect-no-https)
          fi
          baseline() { python3 -u web108/boot_bench_fast.py --iso input/v107.iso --out "out/$1" --mode online --ram 3072 --seconds 210 --cpu-model i3-540-conservative --emulate-acer-id --media usb --bandwidth 31457280 "${extra[@]}"; }
          candidate() { python3 -u web108/boot_bench_fast.py --iso input/candidate.iso --out "out/$1" --mode online --ram 3072 --seconds 210 --cpu-model i3-540-conservative --emulate-acer-id --media usb --bandwidth 31457280 --allow-no-startup-probe "${extra[@]}"; }
          baseline base1
          candidate cand1
          candidate cand2
          baseline base2
          if grep -F 'PUPPY50_V85_NETWORK_PROBE_START' out/cand1/serial.log out/cand2/serial.log; then echo 'Masked startup probe unexpectedly ran' >&2; exit 1; fi
          test "$(grep -c "GET /after.html?nonce=$P50_NONCE.* 200 " out/reports/fixture.log)" -eq 4
          if grep -Ei 'warning.*(unsupported|not support|requested feature)' out/{base1,cand1,cand2,base2}/qemu.log; then exit 1; fi
          python3 - <<'PY'
          import json,statistics
          from pathlib import Path
          t={n:json.loads((Path('out')/n/'result.json').read_text())['first_home_seen_seconds'] for n in ['base1','cand1','cand2','base2']}
          t['baseline_mean_seconds']=statistics.mean([t['base1'],t['base2']]); t['candidate_mean_seconds']=statistics.mean([t['cand1'],t['cand2']])
          t['difference_seconds']=t['baseline_mean_seconds']-t['candidate_mean_seconds']; t['physical_acer_tested']=False
          Path('out/reports/comparison.json').write_text(json.dumps(t,indent=2)+'\n'); print(json.dumps(t,indent=2))
          PY
      - name: Preserve guest results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50-v108-no-probe-${{ matrix.scenario }}-evidence
          path: |
            out/reports/
            out/base1/
            out/base2/
            out/cand1/
            out/cand2/
          if-no-files-found: warn
          retention-days: 30
