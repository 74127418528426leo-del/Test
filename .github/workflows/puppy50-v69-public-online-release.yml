name: Puppy50 v69 - Publish human-verified online QEMU VM prerelease
on:
  push:
    branches: [puppy50-v69-actual-firefox-https-page]
    paths:
      - 'vm/**'
      - '.github/workflows/puppy50-v69-public-online-release.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: puppy50-v69-public-online-release
  cancel-in-progress: true
jobs:
  verify_and_publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone checksum/provenance checker and launcher source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile vm/verify_v69_real_public_website.py
          bash -n vm/launch_linux_https_bridge_v69.sh
          python3 -m unittest discover -s web66/tests -p 'test_*.py' -v
          test -s vm/V69_REAL_BROWSER_SCREENSHOT_REVIEW.json
          test -s vm/README_ONLINE_V69.md
          mkdir -p dist proof
      - name: Download exact original KVM-tested v69 ISO bytes
        uses: actions/download-artifact@v4
        with:
          name: Puppy50_v69_unverified_real_Firefox_webpage_ISO
          run-id: 41656250129
          github-token: ${{ github.token }}
          path: dist
      - name: Download unchanged real QEMU screenshots, guest serial and results
        uses: actions/download-artifact@v4
        with:
          name: Puppy50_v69_native_Firefox_public_website_evidence
          run-id: 41656250129
          github-token: ${{ github.token }}
          path: proof
      - name: Independently verify actual browser pixels, exact ISO and guest TLS proof
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          python3 vm/verify_v69_real_public_website.py \
            --iso dist/Puppy50_Web_v69_Native_Browser_Experimental.iso \
            --evidence proof \
            --review vm/V69_REAL_BROWSER_SCREENSHOT_REVIEW.json \
            --out dist/Puppy50_v69_Real_Browser_Verification.json
          echo 'REAL PUBLIC HTTPS FIREFOX WEBPAGE AND GUEST CA PROVEN FROM EXACT ARTIFACTS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Original v69 run failed legacy frame timing/regex gate. Re-evaluated authentic evidence is preserved, not silently overwritten.' >> "$GITHUB_STEP_SUMMARY"
      - name: Assemble verified online VM bundle with host networking and its checksum
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,json
          dist=Path('dist')
          pairs=[
            ('vm/launch_linux_https_bridge_v69.sh','launch_linux_https_bridge.sh'),
            ('web66/host_https_bridge.py','host_https_bridge.py'),
            ('vm/QEMU_ONLINE_NETWORK_PROFILE.json','QEMU_ONLINE_NETWORK_PROFILE.json'),
            ('vm/README_ONLINE_V69.md','README_ONLINE_V69.md'),
            ('vm/V69_REAL_BROWSER_SCREENSHOT_REVIEW.json','V69_REAL_BROWSER_SCREENSHOT_REVIEW.json'),
          ]
          for source,name in pairs:
            (dist/name).write_bytes(Path(source).read_bytes())
          iso='Puppy50_Web_v69_Native_Browser_Experimental.iso'
          files=[iso,'SHA256SUMS','Puppy50_v69_Real_Browser_Verification.json']+[name for _,name in pairs]
          package=dist/'Puppy50_Online_QEMU_VM_v69_Bundle.zip'
          with zipfile.ZipFile(package,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as z:
            for name in files:z.write(dist/name,arcname=name)
          with zipfile.ZipFile(package) as z:
            assert sorted(z.namelist())==sorted(files)
            assert z.getinfo(iso).file_size==(dist/iso).stat().st_size
          h=hashlib.sha256(package.read_bytes()).hexdigest()
          (dist/'BUNDLE_SHA256SUMS').write_text(h+'  '+package.name+'\n')
          print('Bundle verified:',package.name,package.stat().st_size,'bytes')
          PY
          chmod +x dist/launch_linux_https_bridge.sh
          bash -n dist/launch_linux_https_bridge.sh
      - name: Publish exact verified ISO + bundle as public EXPERIMENTAL prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/"$GITHUB_REPOSITORY" --jq .private)" = false
          if gh release view puppy50-qemu-online-v69 >/dev/null 2>&1; then
            echo "Release tag exists: no silent overwrite of public binaries."
            exit 19
          fi
          gh release create puppy50-qemu-online-v69 \
            dist/Puppy50_Online_QEMU_VM_v69_Bundle.zip \
            dist/Puppy50_Web_v69_Native_Browser_Experimental.iso \
            dist/SHA256SUMS \
            dist/BUNDLE_SHA256SUMS \
            dist/Puppy50_v69_Real_Browser_Verification.json \
            dist/V69_REAL_BROWSER_SCREENSHOT_REVIEW.json \
            dist/README_ONLINE_V69.md \
            dist/QEMU_ONLINE_NETWORK_PROFILE.json \
            dist/host_https_bridge.py \
            dist/launch_linux_https_bridge.sh \
            --target "$GITHUB_SHA" \
            --title "Puppy50 Web v69 — Online Firefox QEMU VM (public HTTPS verified)" \
            --notes-file vm/V69_RELEASE_NOTES.md \
            --prerelease --latest=false
          gh release view puppy50-qemu-online-v69 --json url,tagName,assets
          echo "PUBLIC=https://github.com/$GITHUB_REPOSITORY/releases/tag/puppy50-qemu-online-v69" >> "$GITHUB_STEP_SUMMARY"
