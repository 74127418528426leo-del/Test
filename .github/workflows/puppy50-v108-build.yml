name: Puppy50 v108 nonblocking network startup build
on:
  push:
    branches: [puppy50-v107-startup-research]
    paths: [.github/workflows/puppy50-v108-build.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools and test startup logic
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso squashfs-tools python3-pil
          mkdir -p input out/{root,verify,reports}
          python3 -m unittest discover -s web107 -p test_async_network.py -v
      - name: Fetch and pin v106
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output input/v106.iso 'https://github.com/74127418528426leo-del/Test/releases/download/puppy50-v106-autoboot-guarded/Puppy50_v106_AutoBoot_EXPERIMENTAL.iso'
          printf '%s  %s\n' '537e1129bcbe0373778e30fcf3e15815b184493a0c67d00b036c5e960c75935e' 'input/v106.iso' | sha256sum -c -
          xorriso -osirrox on -indev input/v106.iso -extract /live/filesystem.squashfs out/base.squashfs >out/reports/extract.log 2>&1
          sudo unsquashfs -d out/root out/base.squashfs >out/reports/unsquashfs.log
      - name: Record security, network and firmware files
        run: |
          set -euo pipefail
          sudo bash -c 'cd out/root && sha256sum usr/lib/firefox-esr/firefox-esr usr/lib/firefox-esr/libxul.so usr/bin/nmcli usr/sbin/NetworkManager usr/local/sbin/puppy50-network-probe usr/local/sbin/puppy50-qemu-bridge-allowed etc/ssl/certs/ca-certificates.crt' >out/reports/protected-before.sha256
          sudo bash -c 'cd out/root && find usr/lib/firmware -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum' >out/reports/firmware-before.sha256
          sudo bash -c 'cd out/root && find usr/lib/firmware -type l -printf "%p -> %l\n" | LC_ALL=C sort' >out/reports/firmware-links-before.txt
          sudo cp out/root/etc/systemd/system/puppy50-network-probe.service out/reports/unit-before.txt
          sudo cp out/root/etc/skel/.config/openbox/autostart out/reports/autostart-before.txt
      - name: Start Firefox without blocking on normal network checks
        run: |
          set -euo pipefail
          sudo python3 web107/async_network.py out/root | tee out/reports/patch.json
          sh -n out/root/usr/local/bin/puppy50-fast-browser
          sh -n out/root/usr/local/libexec/puppy50-wait-test-bridge
          sudo cp out/root/etc/systemd/system/puppy50-network-probe.service out/reports/unit-after.txt
          sudo cp out/root/etc/skel/.config/openbox/autostart out/reports/autostart-after.txt
          sudo bash -c 'cd out/root && sha256sum usr/lib/firefox-esr/firefox-esr usr/lib/firefox-esr/libxul.so usr/bin/nmcli usr/sbin/NetworkManager usr/local/sbin/puppy50-network-probe usr/local/sbin/puppy50-qemu-bridge-allowed etc/ssl/certs/ca-certificates.crt' >out/reports/protected-after.sha256
          sudo bash -c 'cd out/root && find usr/lib/firmware -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum' >out/reports/firmware-after.sha256
          sudo bash -c 'cd out/root && find usr/lib/firmware -type l -printf "%p -> %l\n" | LC_ALL=C sort' >out/reports/firmware-links-after.txt
          cmp out/reports/protected-before.sha256 out/reports/protected-after.sha256
          cmp out/reports/firmware-before.sha256 out/reports/firmware-after.sha256
          cmp out/reports/firmware-links-before.txt out/reports/firmware-links-after.txt
      - name: Build experimental ISO and verify exact root
        timeout-minutes: 16
        run: |
          set -euo pipefail
          sudo mksquashfs out/root out/new.squashfs -one-file-system -comp xz -b 1M -processors 3 -mem 2048M -noappend -no-progress -exit-on-error >out/reports/compress.log 2>&1
          xorriso -indev input/v106.iso -outdev out/Puppy50_v108_TEST_ONLY.iso -map out/new.squashfs /live/filesystem.squashfs -boot_image any replay -commit -end >out/reports/repack.log 2>&1
          xorriso -osirrox on -indev out/Puppy50_v108_TEST_ONLY.iso -extract /live/filesystem.squashfs out/verify/filesystem.squashfs -extract /isolinux/live.cfg out/verify/live.cfg -extract /boot/grub/grub.cfg out/verify/grub.cfg >out/reports/reextract.log 2>&1
          cmp out/new.squashfs out/verify/filesystem.squashfs
          grep -F 'boot=live components toram ' out/verify/live.cfg
          grep -F 'boot=live components toram ' out/verify/grub.cfg
          if grep -F 'puppy50.test_bridge=1' out/verify/live.cfg out/verify/grub.cfg; then exit 1; fi
          (cd out && sha256sum Puppy50_v108_TEST_ONLY.iso >SHA256SUMS)
          stat -c '%n %s' out/Puppy50_v108_TEST_ONLY.iso out/new.squashfs >out/reports/image-sizes.txt
          cat out/SHA256SUMS out/reports/image-sizes.txt
      - name: Preserve build audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50-v108-network-build-audit
          path: out/reports/
          if-no-files-found: warn
          retention-days: 30
      - name: Keep test-only image
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50-v108-network-test-only-iso
          path: |
            out/Puppy50_v108_TEST_ONLY.iso
            out/SHA256SUMS
          compression-level: 0
          retention-days: 5
