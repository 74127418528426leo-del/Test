          mkdir -p out/v149-check
          xorriso -osirrox on -indev out/v149.iso \
            -extract /live/initrd.img out/v149-check/initrd \
            -extract /live/initrd-full.img out/v149-check/fallback \
            -extract /live/filesystem.squashfs out/v149-check/root \
            -extract /sha256sum.txt out/v149-check/manifest >out/reports/v149-audit.log 2>&1
          cmp out/v149.initrd out/v149-check/initrd
          cmp out/original-full.initrd out/v149-check/fallback
          cmp out/original.squashfs out/v149-check/root
          cmp out/v149.manifest out/v149-check/manifest
          sha256sum out/v147.iso out/v149.iso >out/reports/v149-ISO-sha256.txt
          echo 'P50_V149_SOFTWARE_WEBRENDER_ONE_PROFILE_PREF_ONLY_KERNEL_ROOT_AND_RECOVERY_UNCHANGED'
      - name: Build image v151 from exact v149 with only additional Firefox niceness minus10
        timeout-minutes: 7
        run: |
          set -euo pipefail
          sudo python3 input/patches/v151/nice_minus10.py out/main
          # Experiment changes only the process niceness of nonroot Firefox.
          sudo --preserve-env=P50_NICE python3 - <<'PY'
          import os
          from pathlib import Path
          nice=int(os.environ['P50_NICE'])
          assert nice in (-10,-9,-11,-8,-12,-7,-13,-6,-5)
          p=Path('out/main/usr/lib/live/boot/9990-main.sh')
          s=p.read_text()
          needle='/usr/bin/nice -n -10 setpriv --reuid=user --regid=user --init-groups'
          assert s.count(needle)==1, 'known v151 launcher missing or ambiguous'
          s=s.replace(needle,f'/usr/bin/nice -n {nice} setpriv --reuid=user --regid=user --init-groups',1)
          p.write_text(s)
          print('P50_AUTOLAB_PRIORITY',nice)
          PY
          # The same non-secret telemetry is included in both A/B conditions.
          sudo python3 lab-control/research_lab/patch_guest_telemetry.py out/main
          sudo cp out/main/usr/lib/live/boot/9990-main.sh out/matched-control-hook.sh
          sudo python3 lab-control/research_lab/patch_parallel_cookie.py out/main
          sudo --preserve-env=P50_PREFETCH_MIB python3 lab-control/research_lab/patch_libxul_prefetch.py out/main
          sudo sh -n out/main/usr/lib/live/boot/9990-main.sh
          grep -Fq 'P50_V149_WEBRENDER_USERJS_READY' out/main/usr/lib/live/boot/9990-main.sh
          grep -Fq 'P50_V146_HIGHER_FIREFOX_PRIORITY_REQUESTED' out/main/usr/lib/live/boot/9990-main.sh
          (cd out/main && sudo find . -print0 | LC_ALL=C sort -z | sudo cpio -o --null -H newc --quiet) >out/v151.cpio
          zstd -q -"${P50_ZSTD_LEVEL}" -T2 -o out/v151.cpio.zst out/v151.cpio
          cat out/early-prefix out/v151.cpio.zst >out/v151.initrd
          cmp -n 36154880 out/original.initrd out/v151.initrd
          xorriso -indev out/v149.iso -outdev out/v151-stage.iso \
            -map out/v151.initrd /live/initrd.img \
            -map out/v151.initrd /live/initrd.img-6.12.115+deb13.1-amd64 \
            -boot_image any replay -commit -end >out/reports/v151-stage.log 2>&1
          python3 - <<'PY'
          import hashlib,re
          from pathlib import Path
          original=Path('out/v149.manifest').read_text().splitlines()
          assert len(original)==293
          d=hashlib.sha256(Path('out/v151.initrd').read_bytes()).hexdigest()
          changing={'./live/initrd.img','./live/initrd.img-6.12.115+deb13.1-amd64'}
          found=set();lines=[]
          for line in original:
              m=re.fullmatch(r'([a-fA-F0-9]{64})( [ *])(.*)',line);assert m,line
              name=m.group(3)
              if name in changing:found.add(name)
              lines.append((d if name in changing else m.group(1))+m.group(2)+name)
          assert found==changing
          Path('out/v151.manifest').write_text('\n'.join(lines)+'\n')
          PY
          xorriso -indev out/v151-stage.iso -outdev out/v151.iso \
            -map out/v151.manifest /sha256sum.txt -boot_image any replay \
            -commit -end >out/reports/v151-final.log 2>&1
          mkdir -p out/v151-check
          xorriso -osirrox on -indev out/v151.iso \
            -extract /live/initrd.img out/v151-check/initrd \
            -extract /live/initrd-full.img out/v151-check/fallback \
            -extract /live/filesystem.squashfs out/v151-check/root \
            -extract /sha256sum.txt out/v151-check/manifest >out/reports/v151-recheck.log 2>&1
          cmp out/v151.initrd out/v151-check/initrd
          cmp out/original-full.initrd out/v151-check/fallback
          cmp out/original.squashfs out/v151-check/root
          cmp out/v151.manifest out/v151-check/manifest
          sha256sum out/v149.iso out/v151.iso >out/reports/v151-ISO-SHA256.txt
          echo P50_V151_IDENTICAL_FIREFOX_KERNEL_ROOT_SANDBOX_RECOVERY_ONLY_PRIORITY_CHANGED
      - name: Build checksum-audited same-host 256 MiB control ISO for structural trials
        timeout-minutes: 8
        run: |
          set -euo pipefail
          test -f out/matched-control-hook.sh
          grep -Fq 'out/matched-control-hook.sh' lab-control/research_lab/build_matched_control.sh
          bash -n lab-control/research_lab/build_matched_control.sh
          P50_PREFETCH_MIB=0 bash lab-control/research_lab/build_matched_control.sh
      - name: Use identical 0.2s SATA CD optical benchmark on both conditions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('input/source/web109/boot_bench_staged.py')
          s=p.read_text()
          needle="time.sleep(.05 if args.select_fullram_fallback and not result['fullram_fallback_selected'] else .8)"
          assert s.count(needle)==1
          s=s.replace(needle,needle.replace('else .8','else .2'),1)
          old="cmd += ['-device', 'qemu-xhci,id=xhci', '-device', 'usb-storage,drive=livecd,id=bootusb,bootindex=1']"
          new="cmd += ['-device', 'ich9-ahci,id=ahci', '-device', 'ide-cd,drive=livecd,bus=ahci.0,id=bootusb,bootindex=1']"
          assert s.count(old)==1
          s=s.replace(old,new,1)
          assert s.count("if args.media == 'optical':")==1
          s=s.replace("if args.media == 'optical':","if True:  # AHCI CD medium ejection",1)
          p2=Path('input/source/web109/boot_bench_ahci.py')
          p2.write_text(s)
          import ast
          ast.parse(s)
          PY
      - name: Strictly verify genuine guest Firefox HTTP200 and retry browser navigation after safe media eject
        run: |
          set -euo pipefail
          python3 input/patches/v159/verify_real_http_with_retry.py input/source/web109/boot_bench_ahci.py
          python3 -m py_compile input/source/web109/boot_bench_ahci.py
          grep -Fq 'post_eject_browser_http200_confirmed' input/source/web109/boot_bench_ahci.py
          grep -Fq "no fake host GET substituted" input/source/web109/boot_bench_ahci.py
          echo P50_V159_REAL_BROWSER_NETWORK_PROOF_REQUIRED
      - name: Instrument host-clock frame observations and serial receipts
        run: |
          set -euo pipefail
          cp lab-control/research_lab/measurement_probe.py input/source/web109/p50_measurement_probe.py
          python3 lab-control/research_lab/patch_benchmark_timing.py input/source/web109/boot_bench_ahci.py
          python3 -m py_compile input/source/web109/boot_bench_ahci.py input/source/web109/p50_measurement_probe.py
      - name: Start local offline/online browser fixture
        env:
          P50_NONCE: P50-${{ github.run_id }}
        run: |
          nohup python3 -u input/source/web103/fixture_server.py --fixture fixture/unused.mp4 --nonce "$P50_NONCE" --port 8765 >out/reports/fixture-after.log 2>&1 </dev/null &
          nohup python3 -u input/source/web112/early_fixture.py --port 8766 >out/reports/fixture-early.log 2>&1 </dev/null &
          python3 -c 'import socket,time; time.sleep(2); [socket.create_connection(("127.0.0.1",p),timeout=5).close() for p in (8765,8766)]'
      - name: Real Firefox cold boots on experimental candidate and matched control
        timeout-minutes: 34
        run: |
          set -euo pipefail
          # Five boots per condition: three BIOS, two UEFI. The additional
          # BIOS pair changes order with run ID to limit position bias.
          order="bios1 matched_bios1 matched_uefi1 uefi1 uefi2 matched_uefi2 matched_bios2 bios2"
          if (( GITHUB_RUN_ID % 2 )); then
            order="$order matched_bios3 bios3"
          else
            order="$order bios3 matched_bios3"
          fi
          for label in $order; do
            case "$label" in *bios*) fw=bios;; *uefi*) fw=uefi;; esac
            iso=out/v151.iso
            case "$label" in matched_*) iso=out/matched-control.iso;; esac
            python3 -u input/source/web109/boot_bench_ahci.py \
              --iso "$iso" --out "out/$label" --mode online \
              --allow-no-startup-probe --wait-ram-ready \
              --ram 3072 --seconds 100 --cpu-model i3-540-conservative \
              --emulate-acer-id --firmware "$fw" --media usb --bandwidth 0
          done
          python3 - <<'PY'
          from pathlib import Path
          import json,re,os,statistics,hashlib
          names=('bios1','uefi1','bios2','uefi2','bios3')
          d={}
          for n in names:
              r=json.loads((Path('out')/n/'result.json').read_text())
              assert r['virtual_firmware']==n.rstrip('123'),(n,r)
              assert r['first_home_seen_seconds'] is not None,(n,'actual Firefox framebuffer missing')
              assert r.get('frame_probe_trace') and r.get('home_frame_observation'),(n,'missing frame observation trace')
              assert r['home_frame_observation']['first_matching_probe_end_seconds']>0,(n,'invalid host observation')
              assert r['staged_ram_ready_seconds'] is not None,(n,'verified RAM transition missing')
              assert r['media_ejected'] and r['input_sent_after_eject'] and r['qemu_running_at_end'] and not r['errors'],(n,r)
              assert r.get('post_eject_browser_http200_confirmed') is True,(n,'Actual guest browser HTTP200 not confirmed')
              assert 1<=r.get('post_eject_navigation_attempts',0)<=3,(n,'No controlled in-guest keyboard navigation')
              serial=(Path('out')/n/'serial.log').read_text(errors='replace')
              for marker in ('P50_V149_WEBRENDER_USERJS_READY',
                             'P50_V146_HIGHER_FIREFOX_PRIORITY_REQUESTED',
                             'P50_V139_EMPTY_PROFILE_CREATED',
                             'P50_V137_OPENBOX_DEFERRED',
                             'P50_V125_EARLY_DRM_READY','P50_V126_EARLY_SOCKET_PRESERVED',
                             'P50_V127_FIREFOX_DIRECT_EXEC','P50_V131_READAHEAD_COMPLETE',
                             f'P50_V133_PREFETCH_{int(os.environ["P50_PREFETCH_MIB"])}MB_STARTED','P50_V144_XORG_VT7_SELECTED',
                             'P50_STAGE_COPY_VERIFIED','P50_STAGE_READY'):
                  assert marker in serial,(n,'boot prerequisite',marker)
              crit=serial[serial.index('P50_V124_FORENSICS_START'):serial.index('P50_V124_FORENSICS_END')+len('P50_V124_FORENSICS_END')]
              assert ' -noreset vt7' in crit,(n,'not protected VT7')
              assert '/usr/sbin/lightdm' not in crit,(n,'late desktop display fallback')
              assert '/usr/lib/xorg/Xorg :0 -auth /home/user/.Xauthority' in crit,(n,'authenticated X11 missing')
              assert 'P50_V149_USERJS_CONTENT_BEGIN' in serial and 'user_pref("gfx.webrender.software", true);' in serial,(n,'Software WebRender not applied to actual profile')
              assert 'P50_V141_ACTUAL_NICE_VALUES' in serial,(n,'Firefox scheduling priority not independently logged')
              status=serial.split('P50_V141_ACTUAL_NICE_VALUES',1)[1].split('-- display and session processes --',1)[0]
              assert re.search(rf'{int(os.environ["P50_NICE"])}\s+user\s+firefox-esr\b',status),(n,'Actual Firefox candidate nice not observed',status[:500])
              d[n]=r
          log=Path('out/reports/fixture-after.log').read_text()
          hits=re.findall(r'GET /after\.html\?nonce='+re.escape(os.environ['P50_NONCE'])+r' HTTP/1\.1" 200 ',log)
          expected_hits=10
          assert len(hits)==expected_hits,('missing real browser HTTP 200 after eject',len(hits),expected_hits)
          iso=Path('out/v151.iso')
          report={
            'scope':'five real cold QEMU boots per condition (3 BIOS and 2 UEFI) on the same runner',
            'sha256':hashlib.sha256(iso.read_bytes()).hexdigest(),
            'benchmark_timing_schema':2,
            'first_visible_Firefox_frame_seconds':{n:d[n]['first_home_seen_seconds'] for n in names},
            'home_frame_observation_upper_seconds':{n:d[n]['home_frame_observation']['first_matching_probe_end_seconds'] for n in names},
            'checksum_verified_whole_root_in_RAM_all_five':True,
            'virtual_CD_removed_after_RAM_all_five':True,
            'real_browser_HTTP200_receipts_after_CD_removal':5,
            'all_five_real_Firefox_under_five_seconds':all(d[n]['home_frame_observation']['first_matching_probe_end_seconds']<5 for n in names),
            'original_Zstd_root_and_full_RAM_recovery_preserved':True,
            'physical_Acer_i3_540_tested':False,
            'full_RAM_in_384MiB_possible':False
          }
          if True:  # same-host early-cookie candidate versus original control
              controls={}
              paired={}
              for n in names:
                  cn='matched_'+n
                  cr=json.loads((Path('out')/cn/'result.json').read_text())
                  assert cr['virtual_firmware']==n.rstrip('123'),(cn,'wrong firmware')
                  assert cr['first_home_seen_seconds'] is not None,(cn,'missing actual frame')
                  assert cr.get('frame_probe_trace') and cr.get('home_frame_observation'),(cn,'missing frame observation trace')
                  assert cr['staged_ram_ready_seconds'] is not None,(cn,'missing RAM READY')
                  assert cr.get('post_eject_browser_http200_confirmed') is True,(cn,'missing browser HTTP200')
                  assert cr['media_ejected'] and cr['qemu_running_at_end'] and not cr['errors'],(cn,'broken control')
                  serial=(Path('out')/cn/'serial.log').read_text(errors='replace')
                  for marker in ('P50_V133_PREFETCH_256MB_STARTED',
                                 'P50_STAGE_COPY_VERIFIED','P50_STAGE_READY',
                                 'P50_V125_EARLY_DRM_READY','P50_V126_EARLY_SOCKET_PRESERVED',
                                 'P50_V127_FIREFOX_DIRECT_EXEC','P50_V144_XORG_VT7_SELECTED',
                                 'P50_V149_WEBRENDER_USERJS_READY'):
                      assert marker in serial,(cn,'control prerequisite',marker)
                  controls[n]=cr
                  paired[n]=round(cr['first_home_seen_seconds']-d[n]['first_home_seen_seconds'],3)
              ctl=Path('out/matched-control.iso')
              cmeans=[controls[n]['first_home_seen_seconds'] for n in names]
              ameans=[d[n]['first_home_seen_seconds'] for n in names]
              matched={
                'scope':'one host, alternating 5+5 genuine QEMU cold boots, three BIOS and two UEFI per condition',
                'reference_prefetch_mib':256,
                'candidate_prefetch_mib':int(os.environ['P50_PREFETCH_MIB']),
                'experiment':'generate a fresh X11 cookie in parallel with DRM setup',
                'fixed_firefox_nice':int(os.environ['P50_NICE']),
                'fixed_zstd_level':int(os.environ['P50_ZSTD_LEVEL']),
                'reference_iso_sha256':hashlib.sha256(ctl.read_bytes()).hexdigest(),
                'candidate_iso_sha256':report['sha256'],
                'control_frame_seconds':{n:controls[n]['first_home_seen_seconds'] for n in names},
                'candidate_frame_seconds':report['first_visible_Firefox_frame_seconds'],
                'matched_control_minus_candidate_seconds':paired,
                'mean_control_seconds':round(statistics.mean(cmeans),3),
                'mean_candidate_seconds':round(statistics.mean(ameans),3),
                'mean_control_minus_candidate_seconds':round(statistics.mean(cmeans)-statistics.mean(ameans),3),
                'control_and_candidate_functional':True,
                'not_five_second_certification':True,
                'not_randomized_across_hosts':True,
                'interpretation':'Positive paired differences favor candidate in this one nonblinded, same-host sequential test; independent reproduction required.'
              }
              report['matched_cookie_control']=matched
              Path('out/reports/matched-cookie-AB.json').write_text(json.dumps(matched,indent=2)+'\n')
              print('P50_SAME_HOST_MATCHED_COOKIE_AB',json.dumps(matched,indent=2))
          Path('out/reports/v159-exact-ISO-release-smoke.json').write_text(json.dumps(report,indent=2)+'\n')
          print('P50_EXPERIMENTAL_VM_BATCH_RECORDED_NOT_A_RELEASE',json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puppy50-parallel-cookie-evidence
          path: |
            out/reports/
            out/bios1/
            out/uefi1/
            out/bios2/
            out/bios3/
            out/uefi2/
            out/matched_bios1/
            out/matched_uefi1/
            out/matched_bios2/
            out/matched_bios3/
            out/matched_uefi2/
          retention-days: 14
          if-no-files-found: warn

