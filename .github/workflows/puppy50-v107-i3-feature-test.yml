name: Puppy50 v107 conservative i3 feature test
on:
  push:
    branches: [puppy50-v107-startup-research]
    paths: [.github/workflows/puppy50-v107-i3-feature-test.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install guest tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 python3-pil
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          mkdir -p input evidence/reports fixture
          lscpu >evidence/reports/host-cpu.txt
      - uses: actions/download-artifact@v4
        with:
          name: Puppy50-v107-checked-media-test-only-iso
          run-id: 42372921677
          github-token: ${{ github.token }}
          path: input
      - name: Pin the exact candidate and start local marker
        env:
          P50_NONCE: P50-${{ github.run_id }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'cbdf605f87d345ca60d1a0a3cebb20312864c81c2a286c8eacb5acb85769c0c2' input/fixed.iso | sha256sum -c -
          nohup python3 -u web103/fixture_server.py --fixture fixture/unused.mp4 --nonce "$P50_NONCE" --port 8765 >evidence/reports/fixture.log 2>&1 </dev/null &
          python3 -c 'import socket,time; time.sleep(2); socket.create_connection(("127.0.0.1",8765),timeout=5).close()'
      - name: Boot with cryptographic and extra CPU features disabled
        env:
          P50_NONCE: P50-${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 -u web107/boot_bench.py --iso input/fixed.iso --out evidence/qemu --mode online --ram 2048 --seconds 210 --cpu-model i3-540-conservative --emulate-acer-id --media usb --bandwidth 31457280
          if grep -Ei 'warning.*(unsupported|not support|requested feature)' evidence/qemu/qemu.log; then exit 1; fi
          grep -F "GET /after.html?nonce=$P50_NONCE" evidence/reports/fixture.log | grep -F ' 200 '
      - name: Preserve guest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50-v107-conservative-i3-test
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
