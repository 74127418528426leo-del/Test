name: Puppy50 v105 boot critical path diagnostic
on:
  push:
    branches: [puppy50-v105-fast-boot]
    paths: [.github/workflows/puppy50-v105-profile.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools and enable KVM
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso squashfs-tools qemu-system-x86 python3-pil
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          mkdir -p input out/{root,reports,qemu} fixture
      - name: Retrieve tested experimental image
        uses: actions/download-artifact@v4
        with:
          name: Puppy50-v105-combined-test-only
          run-id: 42330320993
          github-token: ${{ github.token }}
          path: input
      - name: Pin and extract the root
        run: |
          set -euo pipefail
          printf '%s  %s\n' '01a861bd064408ce1814bb79d8c43274e54061435423cc009ca4924815f3d355' 'input/Puppy50_v105_Fast_TEST_ONLY.iso' | sha256sum -c -
          xorriso -osirrox on -indev input/Puppy50_v105_Fast_TEST_ONLY.iso -extract /live/filesystem.squashfs out/base.squashfs >out/reports/extract.log 2>&1
          sudo unsquashfs -d out/root out/base.squashfs >out/reports/unsquashfs.log
      - name: Add temporary nonblocking boot-timing probe
        run: |
          set -euo pipefail
          cat >out/puppy50-boot-timing <<'EOF'
          #!/bin/sh
          sleep 45
          {
            printf 'P50_BOOT_TIMING_BEGIN\n'
            systemd-analyze time --no-pager || true
            printf 'P50_BOOT_TIMING_BLAME\n'
            systemd-analyze blame --no-pager || true
            printf 'P50_BOOT_TIMING_CRITICAL_DISPLAY\n'
            systemd-analyze critical-chain display-manager.service --no-pager || true
            printf 'P50_BOOT_TIMING_CRITICAL_GRAPHICAL\n'
            systemd-analyze critical-chain graphical.target --no-pager || true
            printf 'P50_BOOT_TIMING_END\n'
          } >/dev/ttyS0 2>&1
          EOF
          cat >out/puppy50-boot-timing.service <<'EOF'
          [Unit]
          Description=Temporary experimental boot timing probe
          After=systemd-journald.service
          [Service]
          Type=simple
          ExecStart=/usr/local/sbin/puppy50-boot-timing
          [Install]
          WantedBy=multi-user.target
          EOF
          sudo install -m 0755 out/puppy50-boot-timing out/root/usr/local/sbin/puppy50-boot-timing
          sudo install -m 0644 out/puppy50-boot-timing.service out/root/etc/systemd/system/puppy50-boot-timing.service
          sudo ln -s ../puppy50-boot-timing.service out/root/etc/systemd/system/multi-user.target.wants/puppy50-boot-timing.service
      - name: Build diagnostic-only ISO
        timeout-minutes: 14
        run: |
          set -euo pipefail
          sudo mksquashfs out/root out/diagnostic.squashfs -one-file-system -comp xz -b 1M -processors 3 -mem 2048M -noappend -no-progress -exit-on-error >out/reports/compress.log 2>&1
          xorriso -indev input/Puppy50_v105_Fast_TEST_ONLY.iso -outdev out/diagnostic.iso -map out/diagnostic.squashfs /live/filesystem.squashfs -boot_image any replay -commit -end >out/reports/repack.log 2>&1
          sha256sum out/diagnostic.iso >out/reports/diagnostic-sha256.txt
      - name: Start optional bridge and local marker
        env:
          P50_NONCE: P50-${{ github.run_id }}
        run: |
          set -euo pipefail
          nohup python3 -u web66/host_https_bridge.py --port 3128 >out/reports/bridge.log 2>&1 </dev/null &
          nohup python3 -u web103/fixture_server.py --fixture fixture/unused.mp4 --nonce "$P50_NONCE" --port 8765 >out/reports/fixture.log 2>&1 </dev/null &
          python3 -c 'import socket,time; time.sleep(2); socket.create_connection(("127.0.0.1",3128),timeout=5).close(); socket.create_connection(("127.0.0.1",8765),timeout=5).close()'
      - name: Measure and retrieve guest critical path
        env:
          P50_NONCE: P50-${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 -u web105/boot_bench.py --iso out/diagnostic.iso --out out/qemu --mode online --ram 2560 --seconds 210 --emulate-acer-id | tee out/reports/benchmark.txt
          grep -F 'P50_BOOT_TIMING_BEGIN' out/qemu/serial.log
          grep -F 'P50_BOOT_TIMING_END' out/qemu/serial.log
          sed -n '/P50_BOOT_TIMING_BEGIN/,/P50_BOOT_TIMING_END/p' out/qemu/serial.log >out/reports/boot-critical-path.txt
          cat out/reports/boot-critical-path.txt
      - name: Preserve timing and actual guest images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50-v105-boot-critical-path
          path: |
            out/reports/
            out/qemu/
          if-no-files-found: warn
          retention-days: 30
