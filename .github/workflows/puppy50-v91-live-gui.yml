name: Puppy50 v91 - Maintained Debian Live non-root GUI boot proof
on:
  push:
    branches: [puppy50-v91-live-autologin-firefox]
    paths:
      - 'web91/**'
      - '.github/workflows/puppy50-v91-live-gui.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: puppy50-v91-real-gui
  cancel-in-progress: true
jobs:
  build_test:
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - name: Validate no host-root changes, no Firefox security overrides
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s web91/tests -p 'test_*.py' -v
          python3 -m py_compile web91/patch_live_root.py
          mkdir -p input output/{extracted,root,verify,reports,evidence}
      - name: Install tools and verify real KVM
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools xorriso qemu-system-x86
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Retrieve unchanged v88 successful maintained Debian Live ISO
        uses: actions/download-artifact@v4
        with:
          name: Puppy50_v88_Debian_Firefox_153_6_WiFi_TEST_ONLY_ISO
          run-id: 41704158116
          github-token: ${{ github.token }}
          path: input
      - name: Verify original ISO checksum and extract only its filesystem
        shell: bash
        run: |
          set -euo pipefail
          (cd input && sha256sum -c SHA256SUMS)
          xorriso -osirrox on -indev input/Puppy50_v85_Debian_Managed_Browser_WIFI_TEST_ONLY.iso -extract /live/filesystem.squashfs output/extracted/filesystem.squashfs > output/reports/extract-iso.log 2>&1
          sudo unsquashfs -d output/rootfs output/extracted/filesystem.squashfs > output/reports/unsquashfs.log
      - name: Repair transient LightDM account/session and enable serial diagnostic
        shell: bash
        run: |
          set -euo pipefail
          sudo python3 web91/patch_live_root.py output/rootfs | tee output/reports/V91_PATCH.json
          sudo systemctl --root="$PWD/output/rootfs" enable puppy50-gui-diagnostics.service
          sudo sh -n output/rootfs/usr/local/sbin/puppy50-prepare-session
          sudo sh -n output/rootfs/usr/local/sbin/puppy50-gui-diagnostics
          sudo test -s output/rootfs/usr/lib/firefox-esr/firefox-esr
          sudo test -s output/rootfs/usr/share/xsessions/openbox.desktop
          grep -F 'ExecStartPre=/usr/local/sbin/puppy50-prepare-session' output/rootfs/etc/systemd/system/lightdm.service.d/10-puppy50-live-preflight.conf
          echo P50_V91_GUEST_AUTOLOGIN_WIRED
      - name: Repack system and preserve hybrid ISO boot loader
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          sudo mksquashfs output/rootfs output/V91_filesystem.squashfs -comp xz -b 1M -processors 3 -mem 2048M -exit-on-error -noappend -no-progress > output/reports/squashfs.log 2>&1
          xorriso -indev input/Puppy50_v85_Debian_Managed_Browser_WIFI_TEST_ONLY.iso -outdev output/Puppy50_v91_Debian_Live_Browser_TEST_ONLY.iso -map output/V91_filesystem.squashfs /live/filesystem.squashfs -boot_image any replay -commit -end > output/reports/xorriso.log 2>&1
          xorriso -osirrox on -indev output/Puppy50_v91_Debian_Live_Browser_TEST_ONLY.iso -extract /live/filesystem.squashfs output/verify/filesystem.squashfs > output/reports/reextract.log 2>&1
          cmp output/V91_filesystem.squashfs output/verify/filesystem.squashfs
          (cd output && sha256sum Puppy50_v91_Debian_Live_Browser_TEST_ONLY.iso > SHA256SUMS)
          echo P50_V91_REAL_BOOTABLE_ISO_REPACKED_AND_EXTRACT_VERIFIED
      - name: Start restricted localhost HTTPS host bridge
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -u web66/host_https_bridge.py --port 3128 > output/reports/bridge.log 2>&1 < /dev/null &
          python3 - <<'PY'
          import socket,time
          for _ in range(50):
              try:
                  with socket.create_connection(('127.0.0.1',3128),timeout=1):break
              except OSError:time.sleep(.2)
          else:raise SystemExit('Bridge failed')
          print('Loopback host bridge ready; guest HTTPS has separate gate')
          PY
      - name: Real QEMU KVM 4096MiB RAM live boot and non-root Firefox startup
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python3 web85/qemu_debian_live_smoke.py --iso output/Puppy50_v91_Debian_Live_Browser_TEST_ONLY.iso --out output/evidence --ram 4096 --seconds 330
      - name: Require actual guest non-root Firefox and real verified HTTPS evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq P50_V91_LIGHTDM_AUTOLOGIN_PREPARED output/evidence/serial.log
          grep -Fq P50_V91_NONROOT_FIREFOX_PROCESS_SEEN output/evidence/serial.log
          grep -Fq PUPPY50_V85_GUEST_CA_VERIFIED_PUBLIC_HTTPS_DIRECT=PASS output/evidence/serial.log || grep -Fq PUPPY50_V85_GUEST_CA_VERIFIED_PUBLIC_HTTPS_BRIDGE=PASS output/evidence/serial.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/evidence/result.json').read_text())
          if not r['toram_media_ejection_survived']:raise SystemExit('RAM boot not proven')
          if not r['screenshots']:raise SystemExit('Real screenshot absent')
          print('V91_NONROOT_FIREFOX_PROCESS_GUEST_PROVEN, page visual review still needed')
          PY
      - name: Preserve even failing real guest screenshots, serial and ISO logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50_v91_Real_KVM_Nonroot_Firefox_Evidence
          path: |
            output/evidence/
            output/reports/
          retention-days: 20
          if-no-files-found: warn
      - name: Publish TEST-ONLY built ISO as short-lived Actions artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50_v91_Debian_Live_ISO_NOT_RELEASED
          path: |
            output/Puppy50_v91_Debian_Live_Browser_TEST_ONLY.iso
            output/SHA256SUMS
          compression-level: 0
          retention-days: 5
          if-no-files-found: error
