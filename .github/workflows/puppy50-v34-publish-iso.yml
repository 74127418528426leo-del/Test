name: Puppy50 v34 bootable preseeded ISO with no-copy and delayed plocate
on:
  push:
    branches: ['puppy50-v34-bootable-preseed-iso']
    paths:
      - '.github/workflows/puppy50-v34-publish-iso.yml'
      - 'cloud/patch_puppy_init_v22.py'
      - 'cloud/puppy50_release_kvm_v34.py'
      - 'cloud/puppy50_release_kvm_v34.py'
      - 'cloud/puppy50_release_kvm_v34.py'
      - 'cloud/build_plocate_defer_v31.sh'
      - 'cloud/build_seed_ydrv_v31.sh'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-and-verify-experimental-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - name: Install necessary open-source utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xorriso p7zip-full cpio gzip squashfs-tools qemu-system-x86
      - name: Download original and verify published checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p50"
          curl -fL --retry 3 --connect-timeout 30 --max-time 600 \
            -o "$RUNNER_TEMP/p50/original.iso" \
            "https://distro.ibiblio.org/puppylinux/puppy-bookwormpup/BookwormPup64/10.0.12/BookwormPup64_10.0.12.iso"
          echo "ae65f6e6d70a96f48bdbb291c2426f8a2fd77a73692e149e81a5eecb6fe7509f  $RUNNER_TEMP/p50/original.iso" | sha256sum -c -
      - name: Download verified offline search index from v30
        uses: actions/download-artifact@v4
        with:
          name: puppy50-v30-pristine-rootfs-prebuilt-index
          run-id: 41445304495
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: v31-seed
      - name: Create experimental ISO with only no-copy patch and reversible measurements
        shell: bash
        run: |
          set -euo pipefail
          7z e -y -o"$RUNNER_TEMP/p50" "$RUNNER_TEMP/p50/original.iso" '*.sfs' initrd.gz >/dev/null
          mkdir -p "$RUNNER_TEMP/p50/initrd_tree"
          ( cd "$RUNNER_TEMP/p50/initrd_tree" && gzip -dc "$RUNNER_TEMP/p50/initrd.gz" | cpio --quiet -idm --no-absolute-filenames )
          python3 cloud/patch_puppy_init_v22.py "$RUNNER_TEMP/p50/initrd_tree/init" "$RUNNER_TEMP/p50/optimized_init"
          cp "$RUNNER_TEMP/p50/optimized_init" "$RUNNER_TEMP/p50/initrd_tree/init"
          ( cd "$RUNNER_TEMP/p50/initrd_tree" && find . -print0 | cpio --null -o -H newc ) | gzip -n -9 > "$RUNNER_TEMP/p50/optimized_initrd.gz"
          mkdir -p "$RUNNER_TEMP/p50/empty_ydrv_tree"
          mksquashfs "$RUNNER_TEMP/p50/empty_ydrv_tree" "$RUNNER_TEMP/p50/empty_ydrv.sfs" -noappend -no-progress >/dev/null
          sh cloud/build_plocate_defer_v31.sh "$RUNNER_TEMP/p50/puppy_dpupbw64_10.0.12.sfs" "$RUNNER_TEMP/p50/ydrv_dpupbw64_10.0.12.sfs" "$RUNNER_TEMP/p50/original_plocate.desktop" "$RUNNER_TEMP/p50/empty_ydrv.sfs"
          sudo sh cloud/build_seed_ydrv_v31.sh "$RUNNER_TEMP/p50/ydrv_dpupbw64_10.0.12.sfs" "v31-seed/preseeded_main_sfs_only.db" "$RUNNER_TEMP/p50/final_ydrv.sfs"
          xorriso -indev "$RUNNER_TEMP/p50/original.iso" -outdev "$RUNNER_TEMP/p50/Puppy50_v34_EXPERIMENTAL_preseed.iso" \
            -map "$RUNNER_TEMP/p50/optimized_initrd.gz" /initrd.gz \
            -map "$RUNNER_TEMP/p50/final_ydrv.sfs" /ydrv_dpupbw64_10.0.12.sfs \
            -boot_image any replay -commit -end
          mkdir -p "$RUNNER_TEMP/p50/check"
          7z e -y -o"$RUNNER_TEMP/p50/check" "$RUNNER_TEMP/p50/Puppy50_v34_EXPERIMENTAL_preseed.iso" initrd.gz >/dev/null
          cmp "$RUNNER_TEMP/p50/optimized_initrd.gz" "$RUNNER_TEMP/p50/check/initrd.gz"
          sha256sum "$RUNNER_TEMP/p50/Puppy50_v34_EXPERIMENTAL_preseed.iso"
      - name: Validate no diagnostic rc.local or autostart browser in user ISO
        shell: bash
        run: |
          set -euo pipefail
          unsquashfs -cat "$RUNNER_TEMP/p50/final_ydrv.sfs" etc/xdg/autostart/plocate-update.desktop | grep -F 'Exec=/usr/local/bin/puppy50-plocate-deferred'
          if unsquashfs -cat "$RUNNER_TEMP/p50/final_ydrv.sfs" etc/rc.d/rc.local 2>/dev/null | grep -E 'PUPPY50_V25_BEGIN|PUPPY50_V26_BROWSER_REQUEST'; then
            echo "Diagnostic browser autorun in release ISO, refusing to publish"; exit 4
          fi
          python3 -m py_compile cloud/puppy50_release_kvm_v34.py
          sh -n cloud/build_plocate_defer_v31.sh cloud/build_seed_ydrv_v31.sh
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Boot actual ISO via hardware KVM, no QEMU kernel override, at 256 and 512 MiB
        timeout-minutes: 9
        run: |
          python3 cloud/puppy50_release_kvm_v34.py \
            --iso "$RUNNER_TEMP/p50/Puppy50_v34_EXPERIMENTAL_preseed.iso" \
            --out v34-real-results --seconds 145 --rams 256 512
      - name: Copy release candidate and checksum only after build checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$RUNNER_TEMP/p50/Puppy50_v34_EXPERIMENTAL_preseed.iso" dist/
          (cd dist && sha256sum Puppy50_v34_EXPERIMENTAL_preseed.iso > Puppy50_v34_EXPERIMENTAL.sha256)
      - name: Upload raw evidence even if the gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puppy50-v34-real-kvm-boot-evidence
          path: v34-real-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish complete bootable experimental ISO and checksum
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: puppy50-v34-experimental-preseed-iso
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
