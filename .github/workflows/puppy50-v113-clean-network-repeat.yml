name: Puppy50 v113 clean deferred-network exact-image repeat
on:
  push:
    branches: [puppy50-v113-startup-research]
    paths: [.github/workflows/puppy50-v113-clean-network-repeat.yml]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - name: Install VM tools and verify interactive benchmark
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 python3-pil
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          mkdir -p input out/reports fixture
          python3 -m unittest discover -s web113 -p 'test_*.py' -v
          python3 -m unittest discover -s web112 -p 'test_*.py' -v
          python3 web112/early_probe.py web109/boot_bench_staged.py web113/repeat_bench.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web113/repeat_bench.py');s=p.read_text()
          old="time.sleep(.05 if args.select_fullram_fallback and not result['fullram_fallback_selected'] else .8)"
          new="time.sleep(.05 if args.select_fullram_fallback and not result['fullram_fallback_selected'] else .2)"
          assert s.count(old)==1;s=s.replace(old,new,1);p.write_text(s)
          PY
          python3 -m py_compile web113/repeat_bench.py
          lscpu >out/reports/host-cpu.txt
      - uses: actions/download-artifact@v4
        with:
          name: Puppy50-v113-clean-network-drivers-test-only-iso
          run-id: 42535754369
          github-token: ${{ github.token }}
          path: input
      - name: Fetch published baseline and verify both exact images
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error -o input/v112.iso 'https://github.com/74127418528426leo-del/Test/releases/download/puppy50-v112-fast-read-experimental/Puppy50_v112_Fast_Read_EXPERIMENTAL.iso'
          printf '%s  %s\n' '317999f51e47698d90889b129e9f74bbbefaa382b4d481f4da32016861d8ddc7' input/v112.iso | sha256sum -c -
          printf '%s  %s\n' '4e6dc9b9d1f8f416b47ea046ffcfc5f1c6a7a732dc9ac0e67ff49bd53d271ea1' input/candidate.iso | sha256sum -c -
      - name: Start both local interaction fixtures
        env:
          P50_NONCE: P50-${{ github.run_id }}
        run: |
          set -euo pipefail
          nohup python3 -u web103/fixture_server.py --fixture fixture/unused.mp4 --nonce "$P50_NONCE" --port 8765 >out/reports/after-fixture.log 2>&1 </dev/null &
          nohup python3 -u web112/early_fixture.py --port 8766 >out/reports/early-fixture.log 2>&1 </dev/null &
          python3 -c 'import socket,time; time.sleep(2); [socket.create_connection(("127.0.0.1",p),timeout=5).close() for p in (8765,8766)]'
      - name: Repeat six alternating real browser boots
        timeout-minutes: 21
        env:
          P50_NONCE: P50-${{ github.run_id }}
        run: |
          set -euo pipefail
          for run in base1 cand1 cand2 base2 base3 cand3; do
            if [[ "$run" == base* ]]; then iso=input/v112.iso; else iso=input/candidate.iso; fi
            python3 -u web113/repeat_bench.py --iso "$iso" --out "out/$run" --mode online --allow-no-startup-probe --wait-ram-ready --ram 3072 --seconds 210 --cpu-model i3-540-conservative --emulate-acer-id --media usb --bandwidth 31457280
          done
          test "$(grep -c '"GET /e HTTP/1.1" 200' out/reports/early-fixture.log)" -eq 6
          test "$(grep -c "GET /after.html?nonce=$P50_NONCE.* 200 " out/reports/after-fixture.log)" -eq 6
          python3 - <<'PY'
          import json,statistics
          from pathlib import Path
          names=('base1','cand1','cand2','base2','base3','cand3')
          keys=('first_home_seen_seconds','early_page_seen_seconds','early_js_response_seconds','staged_ram_ready_seconds')
          data={n:json.loads((Path('out')/n/'result.json').read_text()) for n in names}
          for n,r in data.items():
              assert all(r.get(k) is not None for k in keys),(n,r)
              assert r['early_media_attached_before_navigation'] and r['early_media_attached_after_js_response']
              assert r['media_ejected'] and r['input_sent_after_eject'] and r['qemu_running_at_end'] and not r['errors'],n
          result={'measurement':'Host monotonic from QEMU launch; 0.2 s sleep between frame polls plus screenshot overhead; 2 vCPU, 3 GiB, BIOS, 30 MiB/s virtual USB. Three samples per image, A-B-B-A-A-B.','physical_acer_tested':False,'results':{n:{k:r[k] for k in keys} for n,r in data.items()}}
          for label,pair in [('baseline',('base1','base2','base3')),('candidate',('cand1','cand2','cand3'))]:
              for key in keys:result[label+'_mean_'+key]=statistics.mean(data[n][key] for n in pair)
          result['home_gain_seconds']=result['baseline_mean_first_home_seen_seconds']-result['candidate_mean_first_home_seen_seconds']
          result['js_gain_seconds']=result['baseline_mean_early_js_response_seconds']-result['candidate_mean_early_js_response_seconds']
          Path('out/reports/comparison.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Retain all logs and frames even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50-v113-clean-network-repeat-evidence
          path: out/
          if-no-files-found: warn
          retention-days: 30
