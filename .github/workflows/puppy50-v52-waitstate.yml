name: Puppy50 v52 - Firefox wait-state and browser startup diagnosis
on:
  push:
    branches: [puppy50-v52-firefox-waitstate-probe]
    paths:
      - 'web49/**'
      - 'web50/**'
      - 'web52/**'
      - 'web45/configure_browser_session.sh'
      - '.github/workflows/puppy50-v52-waitstate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-measure-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 31
    steps:
      - uses: actions/checkout@v4
      - name: Test staging and tool syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s web49/tests -p 'test_*.py' -v
          sh -n web49/stage_boot_outside_sfs.sh
          sh -n web45/configure_browser_session.sh web45/wire_openrc_services.sh web50/guest_memory_watch.sh
          python3 -m unittest discover -s web50/tests -p 'test_*.py' -v
          python3 -m unittest discover -s web52/tests -p 'test_*.py' -v
          python3 -m unittest discover -s web45/tests -p 'test_*.py' -v
      - name: Install the required disposable-VM and SquashFS build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools \
            busybox-static xorriso p7zip-full cpio curl kmod qemu-system-x86
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          mkdir -p output/reports dist output/boot-assets
      - name: Build actual Alpine Linux + full secure Firefox dependency closure
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --pull=always \
            -v "$PWD/web44/build_browser_rootfs.sh:/build.sh:ro" \
            -v "$PWD/output:/out" alpine:3.24 sh /build.sh
          docker run --rm \
            -v "$PWD/output:/out" alpine:3.24 \
            sh -ec 'apk --root /out/rootfs --arch x86_64 --no-cache add openbox xrandr xf86-video-vesa xf86-video-fbdev'
          sudo install -m 0755 web50/guest_memory_watch.sh output/rootfs/usr/local/bin/puppy50-v50-memory-watch
          sudo sh web45/configure_browser_session.sh output/rootfs
          sudo python3 web45/prune_hardware_v45.py output/rootfs output/reports/v49-hardware.json
          VERSION=$(python3 -c 'import json;print(json.load(open("output/reports/v49-hardware.json"))["kernel_version"])')
          sudo depmod -b output/rootfs "$VERSION"
          test -s output/rootfs/boot/vmlinuz-lts
          test -s output/rootfs/usr/share/puppy50web/index.html
          # Alpine Docker owns report directories; allow runner-side shell redirects.
          sudo chown -R "$(id -u):$(id -g)" output/reports
      - name: Preserve boot assets OUTSIDE SquashFS, without deleting matching kernel
        shell: bash
        run: |
          set -euo pipefail
          sudo sh web49/stage_boot_outside_sfs.sh output/rootfs output/boot-assets/boot
          test -s output/boot-assets/boot/vmlinuz-lts
          test -z "$(ls -A output/rootfs/boot)"
          (cd output && sha256sum boot-assets/boot/vmlinuz-lts > reports/external-kernel.sha256)
      - name: Compress only RAM-root contents (no redundant /boot)
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          sudo mksquashfs output/rootfs output/puppy50-web-v45-root.sfs \
            -comp xz -b 1M -Xbcj x86 -processors 2 -mem 1024M \
            -exit-on-error -noappend -no-progress > output/reports/stripped-build.log 2>&1
          stat -c 'BOOTLESS_ROOT_COMPRESSED_BYTES=%s' output/puppy50-web-v45-root.sfs | tee output/reports/bootless-size.txt
          python3 web48/audit_image.py --root output/rootfs --sfs output/puppy50-web-v45-root.sfs \
            --output output/reports/bootless-image-audit.json
          unsquashfs -ll output/puppy50-web-v45-root.sfs > output/reports/bootless-filelist.txt
          if grep -Eq 'squashfs-root/boot/(vmlinuz|initramfs|System.map|config)' output/reports/bootless-filelist.txt; then
            echo "PUPPY50_V49_FAIL_DUPLICATE_BOOT_STILL_PRESENT"; exit 10
          fi
          echo "PUPPY50_V49_BOOTLESS_SFS_CONTENT_AUDIT_PASS"
      - name: Reassemble a real ISO using external preserved matching boot kernel
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          sudo cp -a output/boot-assets/boot/. output/rootfs/boot/
          test -s output/rootfs/boot/vmlinuz-lts
          (cd output && sha256sum -c reports/external-kernel.sha256) || {
            echo 'External boot kernel SHA check failed'; exit 11;
          }
          curl -fL --retry 3 --connect-timeout 30 --max-time 600 \
            -o output/official-puppy.iso \
            https://distro.ibiblio.org/puppylinux/puppy-bookwormpup/BookwormPup64/10.0.12/BookwormPup64_10.0.12.iso
          echo 'ae65f6e6d70a96f48bdbb291c2426f8a2fd77a73692e149e81a5eecb6fe7509f  output/official-puppy.iso' | sha256sum -c -
          sudo bash web45/make_web_iso_v45.sh \
            output/rootfs output/official-puppy.iso \
            dist/Puppy50_Web_v52_WAITSTATE_DIAG_EXPERIMENTAL.iso output/reports
          echo 'PUPPY50_V52_REAL_ISO_BUILT_AND_EMBEDDED_BYTES_VERIFIED'
      - name: Real KVM Firefox wait-state comparison 512 and 1024 MiB
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/Puppy50_Web_v52_WAITSTATE_DIAG_EXPERIMENTAL.iso
          for ram in 512 1024; do
            mkdir -p "output/evidence/ram_${ram}MiB"
            echo "PUPPY50_V50_BEGIN_REAL_KVM ram_mib=$ram"
            if python3 web45/qemu_real_cd_v45.py \
              --iso dist/Puppy50_Web_v52_WAITSTATE_DIAG_EXPERIMENTAL.iso \
              --out "output/evidence/ram_${ram}MiB" \
              --ram "$ram" --seconds 155; then
              echo "PUPPY50_V50_COPY_ROOT_EJECT_GATE_PASS ram_mib=$ram"
            else
              echo "PUPPY50_V50_COPY_ROOT_EJECT_GATE_INCOMPLETE ram_mib=$ram"
            fi
          done
      - name: Analyze actual guest serial telemetry and preserve limitations
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          valid=0
          for ram in 512 1024; do
            p="output/evidence/ram_${ram}MiB"
            if [ -f "$p/serial.log" ] && [ -f "$p/result.json" ]; then
              if python3 web50/analyze_guest_memory.py "$p/serial.log" \
                   --qemu-result "$p/result.json" \
                   --output "output/reports/v50_memory_${ram}MiB.json"; then
                valid=$((valid+1))
              else
                echo "PUPPY50_V50_INCOMPLETE_TELEMETRY ram_mib=$ram"
              fi
            else
              echo "PUPPY50_V50_MISSING_GUEST_EVIDENCE ram_mib=$ram"
            fi
          done
          for ram in 512 1024; do
            p="output/evidence/ram_${ram}MiB"
            if [ -f "$p/serial.log" ]; then
              if python3 web52/analyze_firefox_wait.py "$p/serial.log" \
                    --out "output/reports/v52_wait_${ram}MiB.json"; then
                echo "PUPPY50_V52_WAITSTATE_TELEMETRY_VALID ram=$ram"
              else
                echo "PUPPY50_V52_WAITSTATE_TELEMETRY_INCOMPLETE ram=$ram"
              fi
            fi
          done
          python3 - <<'PY'
          from pathlib import Path
          import json
          out={}
          for ram in (512,1024):
              p=Path(f'output/reports/v50_memory_{ram}MiB.json')
              if p.exists():
                  d=json.loads(p.read_text())
                  out[str(ram)]={k:v for k,v in d.items() if k not in ('samples','limits')}
              else:
                  out[str(ram)]={'valid_monitoring':False}
          Path('output/reports/V50_SUMMARY.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          print('No observed screenshot means no visible browser claim. No interaction or Internet tested.')
          PY
          test "$valid" -eq 2
      - name: Upload audit and screenshots, not enormous ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puppy50-v52-guest-waitstate-diagnostics
          path: |
            output/reports/
            output/evidence/
          retention-days: 7
          if-no-files-found: warn
