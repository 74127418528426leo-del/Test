name: Puppy50 v105 nonblocking startup candidate
on:
  push:
    branches: [puppy50-v105-fast-boot]
    paths: [.github/workflows/puppy50-v105-build.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install ISO tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso squashfs-tools
          mkdir -p input out/{rootfs,reports,extracted,verify}
          python3 -m unittest discover -s web105 -p test_fast_patch.py -v
      - name: Download and verify published v104
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output input/v104.iso 'https://github.com/74127418528426leo-del/Test/releases/download/puppy50-v104-intel-firefox-media/Puppy50_v104_Intel_Media_EXPERIMENTAL.iso'
          printf '%s  %s\n' 'f692ed0755b691ea8acaed4a90f96016ce2c50e183782e8be2cd6adabd60dba5' 'input/v104.iso' | sha256sum -c -
          xorriso -osirrox on -indev input/v104.iso -extract /live/filesystem.squashfs out/extracted/base.squashfs >out/reports/extract.log 2>&1
          sudo unsquashfs -d out/rootfs out/extracted/base.squashfs >out/reports/unsquashfs.log
      - name: Preserve critical software and networking hashes
        run: |
          set -euo pipefail
          sudo bash -c 'cd out/rootfs && sha256sum usr/lib/firefox-esr/firefox-esr usr/lib/firefox-esr/libxul.so usr/bin/nmcli usr/sbin/NetworkManager usr/local/sbin/puppy50-network-probe etc/ssl/certs/ca-certificates.crt' >out/reports/protected-before.sha256
          sudo bash -c 'cd out/rootfs && find usr/lib/firmware -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum' >out/reports/firmware-before.sha256
          sudo bash -c 'cd out/rootfs && find usr/lib/firmware -type l -printf "%p -> %l\n" | LC_ALL=C sort' >out/reports/firmware-links-before.txt
      - name: Allow startup while network initializes
        run: |
          set -euo pipefail
          sudo python3 web105/fast_patch.py out/rootfs | tee out/reports/patch.json
          sh -n out/rootfs/usr/local/bin/puppy50-launch-browser
          sudo bash -c 'cd out/rootfs && sha256sum usr/lib/firefox-esr/firefox-esr usr/lib/firefox-esr/libxul.so usr/bin/nmcli usr/sbin/NetworkManager usr/local/sbin/puppy50-network-probe etc/ssl/certs/ca-certificates.crt' >out/reports/protected-after.sha256
          sudo bash -c 'cd out/rootfs && find usr/lib/firmware -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum' >out/reports/firmware-after.sha256
          sudo bash -c 'cd out/rootfs && find usr/lib/firmware -type l -printf "%p -> %l\n" | LC_ALL=C sort' >out/reports/firmware-links-after.txt
          cmp out/reports/protected-before.sha256 out/reports/protected-after.sha256
          cmp out/reports/firmware-before.sha256 out/reports/firmware-after.sha256
          cmp out/reports/firmware-links-before.txt out/reports/firmware-links-after.txt
      - name: Rebuild the RAM-only ISO and verify exact filesystem
        timeout-minutes: 18
        run: |
          set -euo pipefail
          sudo mksquashfs out/rootfs out/new.squashfs -one-file-system -comp xz -b 1M -processors 3 -mem 2048M -noappend -no-progress -exit-on-error >out/reports/compress.log 2>&1
          xorriso -indev input/v104.iso -outdev out/Puppy50_v105_Fastboot_TEST_ONLY.iso -map out/new.squashfs /live/filesystem.squashfs -boot_image any replay -commit -end >out/reports/repack.log 2>&1
          xorriso -osirrox on -indev out/Puppy50_v105_Fastboot_TEST_ONLY.iso -extract /live/filesystem.squashfs out/verify/filesystem.squashfs >out/reports/reextract.log 2>&1
          cmp out/new.squashfs out/verify/filesystem.squashfs
          stat -c '%s' out/Puppy50_v105_Fastboot_TEST_ONLY.iso >out/reports/iso-bytes.txt
          stat -c '%s' out/new.squashfs >out/reports/root-bytes.txt
          (cd out && sha256sum Puppy50_v105_Fastboot_TEST_ONLY.iso >SHA256SUMS)
          cat out/SHA256SUMS
      - name: Upload build audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50-v105-build-audit
          path: out/reports/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload test-only ISO
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50-v105-test-only-iso
          path: |
            out/Puppy50_v105_Fastboot_TEST_ONLY.iso
            out/SHA256SUMS
          compression-level: 0
          retention-days: 7
