name: Puppy50 v108 initramfs tooling compatibility
on:
  push:
    branches: [puppy50-v108-architecture]
    paths: [.github/workflows/puppy50-v108-initrd-tool-check.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  unpack:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Install tools and retrieve baseline
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso initramfs-tools-core zstd cpio rsync
          mkdir -p input out/{old,new,reports}
          curl --fail --location --retry 3 -o input/v107.iso 'https://github.com/74127418528426leo-del/Test/releases/download/puppy50-v107-zstd-fastboot-experimental/Puppy50_v107_FastBoot_EXPERIMENTAL.iso'
          printf '%s  %s\n' 'cbdf605f87d345ca60d1a0a3cebb20312864c81c2a286c8eacb5acb85769c0c2' input/v107.iso | sha256sum -c -
      - uses: actions/download-artifact@v4
        with:
          name: Puppy50-v108-combined-test-only-iso
          run-id: 42396414328
          github-token: ${{ github.token }}
          path: input/combined
      - name: Independently unpack and compare both boot archives
        run: |
          set -euo pipefail
          printf '%s  %s\n' '6bc9393a62667305bcdee18d763fc0f26a67a8abaeea001633c0c5057b47bcad' input/combined/combined.iso | sha256sum -c -
          xorriso -osirrox on -indev input/v107.iso -extract /live/initrd.img input/v107.initrd >out/reports/extract-old.log 2>&1
          xorriso -osirrox on -indev input/combined/combined.iso -extract /live/initrd.img input/v108.initrd >out/reports/extract-new.log 2>&1
          lsinitramfs input/v108.initrd >out/reports/lsinitramfs.txt
          sudo unmkinitramfs input/v107.initrd out/old >out/reports/unpack-old.log 2>&1
          sudo unmkinitramfs input/v108.initrd out/new >out/reports/unpack-new.log 2>&1
          # unmkinitramfs creates 491 extraction directories at different times.
          # Their extracted mtimes are tool-generated; exact archive bytes were
          # checked in the combined build. Compare all other listed attributes.
          sudo rsync -aHAXnciO --delete --numeric-ids out/old/ out/new/ >out/reports/differences-forward.txt
          sudo rsync -aHAXnciO --delete --numeric-ids out/new/ out/old/ >out/reports/differences-reverse.txt
          test ! -s out/reports/differences-forward.txt
          test ! -s out/reports/differences-reverse.txt
          grep -F 'kernel/x86/microcode/GenuineIntel.bin' out/reports/lsinitramfs.txt
          grep -F 'kernel/x86/microcode/AuthenticAMD.bin' out/reports/lsinitramfs.txt
          echo 'Normal Debian initramfs tools unpack the image; compared files and selected metadata match (directory mtimes excluded).'
      - name: Preserve compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50-v108-initramfs-tool-compatibility
          path: out/reports/
          if-no-files-found: warn
          retention-days: 30
