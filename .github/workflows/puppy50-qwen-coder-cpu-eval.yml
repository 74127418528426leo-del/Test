name: Puppy50 Qwen Coder bounded CPU smoke
on:
  push:
    branches: [puppy50-boot-measurement-integrity-20261116]
    paths: ['.github/workflows/puppy50-qwen-coder-cpu-eval.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  coder_cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test bounded parser without executing generated code
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest research_lab.test_coder_smoke -v
      - name: Download official Qwen Coder quantization and verify its checksum
        run: |
          set -euo pipefail
          mkdir -p models
          curl -fL --retry 2 --connect-timeout 25 --max-time 420 \
            'https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf' \
            -o models/coder.gguf
          echo 'cc324af070c2ecbfd324a30884d2f951a7ff756aba85cb811a6ec436933bb046  models/coder.gguf' | sha256sum -c -
      - name: Start pinned CPU inference server on loopback
        run: |
          set -euo pipefail
          img='ghcr.io/ggml-org/llama.cpp@sha256:89fe93c2ef53ea2d09ca9f53db8878a8f57bb6b143eb63c76a9c218fb583b392'
          docker pull "$img"
          docker run -d --name p50-coder --memory 5g --cpus 2 --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges --user 65534:65534 \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -p 127.0.0.1:8088:8080 -v "$PWD/models:/models:ro" "$img" \
            -m /models/coder.gguf --alias p50-coder --host 0.0.0.0 --port 8080 \
            --ctx-size 4096 --threads 2 --parallel 1 --jinja --n-gpu-layers 0
          python3 - <<'PY'
          import json,time,urllib.request
          deadline=time.monotonic()+120
          while time.monotonic()<deadline:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8088/health',timeout=3) as r:
                      if json.load(r).get('status')=='ok':break
              except Exception:
                  time.sleep(2)
          else:raise RuntimeError('Local CPU model server did not become healthy')
          PY
      - name: Generate three tiny functions and compare syntax trees without executing them
        run: python3 research_lab/coder_smoke.py --output coder-evidence/results.json
      - name: Capture failure diagnostics without secrets
        if: always()
        run: |
          mkdir -p coder-evidence
          docker logs p50-coder --tail 100 > coder-evidence/server.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puppy50-qwen-coder-cpu-evidence
          path: coder-evidence/
          retention-days: 7
          if-no-files-found: warn
      - name: Stop temporary model server
        if: always()
        run: docker rm -f p50-coder 2>/dev/null || true
