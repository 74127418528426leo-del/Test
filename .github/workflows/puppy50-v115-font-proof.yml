name: Puppy50 v115 pre-desktop font-cache proof
on:
  push:
    branches: [puppy50-v115-font-clean]
    paths: [.github/workflows/puppy50-v115-font-proof.yml]
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install VM and image tools; verify diagnostic helpers
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso zstd cpio qemu-system-x86 python3-pil gcc libc6-dev
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          mkdir -p input out/{main,reports,tree,rechecked} fixture
          python3 -m unittest discover -s web115font -p 'test_*.py' -v
          gcc -O2 -Wall -Wextra -Werror -static -o out/font-access web115font/font_access.c
          python3 web112/early_probe.py web109/boot_bench_staged.py web115font/interactive_bench.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web115font/interactive_bench.py');s=p.read_text()
          old="'P50_V91_NONROOT_FIREFOX_PROCESS_SEEN']"
          new="'P50_V91_NONROOT_FIREFOX_PROCESS_SEEN', 'P50_FONT_FIREFOX_CACHE_OPEN']"
          assert s.count(old)==1;s=s.replace(old,new,1)
          old="time.sleep(.05 if args.select_fullram_fallback and not result['fullram_fallback_selected'] else .8)"
          new="time.sleep(.05 if args.select_fullram_fallback and not result['fullram_fallback_selected'] else .2)"
          assert s.count(old)==1;s=s.replace(old,new,1);p.write_text(s)
          PY
          python3 -m py_compile web115font/interactive_bench.py
          lscpu >out/reports/host-cpu.txt
          free -h >out/reports/host-memory.txt
      - uses: actions/download-artifact@v4
        with:
          name: Puppy50-v115-clean-font-test-only-iso
          run-id: 42748059555
          github-token: ${{ github.token }}
          path: input
      - name: Verify exact clean candidate and instrument a separate image
        run: |
          set -euo pipefail
          sha=$(awk '$2=="out/candidate.iso" {print $1}' input/reports/iso-hashes.txt)
          test "${#sha}" -eq 64
          printf '%s  %s\n' "$sha" input/candidate.iso | tee out/reports/clean-iso-sha.txt | sha256sum -c -
          xorriso -osirrox on -indev input/candidate.iso -extract /live/initrd.img out/clean.initrd -extract /live/initrd-full.img out/full.initrd -extract /live/filesystem.squashfs out/base.squashfs >out/reports/extract.log 2>&1
          head -c 36154880 out/clean.initrd >out/early-prefix
          tail -c +36154881 out/clean.initrd | zstd -q -dc >out/main.cpio
          (cd out/main && sudo cpio -idm --quiet --no-absolute-filenames <../main.cpio)
          (cd out/main/usr/lib/p50-fontcache && LC_ALL=C sha256sum *-le64.cache-9) >out/reports/embedded-cache-sha256.txt
          cmp input/reports/cache-sha256.txt out/reports/embedded-cache-sha256.txt
          test "$(wc -l <out/reports/embedded-cache-sha256.txt)" -eq 20
          sudo cp out/main/usr/lib/live/boot/9990-main.sh out/clean-main.sh
          sudo install -o root -g root -m 0755 out/font-access out/main/usr/lib/p50-stage/font-access
          sudo python3 web115font/diagnostic_patch.py out/main
          sudo python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'web115font')
          from diagnostic_patch import patch_main
          assert patch_main(Path('out/clean-main.sh').read_text())==Path('out/main/usr/lib/live/boot/9990-main.sh').read_text()
          PY
          sudo sh -n out/main/usr/lib/live/boot/9990-main.sh
      - name: Repack proof-only ISO and check unchanged recovery
        run: |
          set -euo pipefail
          (cd out/main && sudo find . -print0 | LC_ALL=C sort -z | sudo cpio -o --null -H newc --quiet) >out/modified.cpio
          zstd -q -3 -T2 -o out/modified.cpio.zst out/modified.cpio
          cat out/early-prefix out/modified.cpio.zst >out/proof.initrd
          cmp -n 36154880 out/clean.initrd out/proof.initrd
          xorriso -indev input/candidate.iso -outdev out/stage.iso -map out/proof.initrd /live/initrd.img -map out/proof.initrd /live/initrd.img-6.12.115+deb13.1-amd64 -boot_image any replay -commit -end >out/reports/stage.log 2>&1
          xorriso -osirrox on -indev out/stage.iso -extract / out/tree >out/reports/tree.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          root=Path('out/tree').resolve();lines=[];seen=set()
          for line in (root/'sha256sum.txt').read_text().splitlines():
              m=re.fullmatch(r'([0-9a-fA-F]{64})( [ *])(.*)',line);assert m,line
              name=m.group(3);assert name.startswith('./') and name not in seen;seen.add(name)
              p=(root/name).resolve(strict=True);p.relative_to(root);assert p.is_file() and name!='./sha256sum.txt'
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1048576),b''):h.update(b)
              lines.append(h.hexdigest()+m.group(2)+name)
          assert len(lines)==293
          Path('out/sha256sum.txt').write_text('\n'.join(lines)+'\n')
          PY
          xorriso -indev out/stage.iso -outdev out/proof.iso -map out/sha256sum.txt /sha256sum.txt -boot_image any replay -commit -end >out/reports/repack.log 2>&1
          xorriso -osirrox on -indev out/proof.iso -extract / out/rechecked >out/reports/recheck.log 2>&1
          cmp out/base.squashfs out/rechecked/live/filesystem.squashfs
          cmp out/proof.initrd out/rechecked/live/initrd.img
          cmp out/full.initrd out/rechecked/live/initrd-full.img
          (cd out/rechecked && sha256sum -c sha256sum.txt) >out/reports/media-checksums.txt
          test "$(wc -l <out/reports/media-checksums.txt)" -eq 293
          sha256sum input/candidate.iso out/proof.iso >out/reports/iso-hashes.txt
      - name: Start browser fixtures
        env:
          P50_NONCE: P50-${{ github.run_id }}
        run: |
          set -euo pipefail
          nohup python3 -u web103/fixture_server.py --fixture fixture/unused.mp4 --nonce "$P50_NONCE" --port 8765 >out/reports/after-fixture.log 2>&1 </dev/null &
          nohup python3 -u web112/early_fixture.py --port 8766 >out/reports/early-fixture.log 2>&1 </dev/null &
          python3 -c 'import socket,time; time.sleep(2); [socket.create_connection(("127.0.0.1",p),timeout=5).close() for p in (8765,8766)]'
      - name: Boot diagnostic image and verify cache proof before Firefox home
        env:
          P50_NONCE: P50-${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 -u web115font/interactive_bench.py --iso out/proof.iso --out out/proof --mode online --allow-no-startup-probe --wait-ram-ready --ram 3072 --seconds 210 --cpu-model i3-540-conservative --emulate-acer-id --media usb --bandwidth 31457280
          grep -F '"GET /e HTTP/1.1" 200' out/reports/early-fixture.log
          grep -F "GET /after.html?nonce=$P50_NONCE" out/reports/after-fixture.log | grep -F ' 200 '
          python3 web115font/verify_probe.py out/proof/serial.log input/reports/cache-sha256.txt input/reports/expected-directories.txt out/proof/result.json out/reports/proof-summary.json
      - name: Preserve proof logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50-v115-font-prestartup-proof-evidence
          path: |
            out/reports/
            out/proof/
          if-no-files-found: warn
          retention-days: 30
