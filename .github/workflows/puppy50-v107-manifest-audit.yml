name: Puppy50 v107 media integrity audit
on:
  push:
    branches: [puppy50-v107-startup-research]
    paths: [.github/workflows/puppy50-v107-manifest-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install ISO tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso
          mkdir -p input evidence/tree
      - uses: actions/download-artifact@v4
        with:
          name: Puppy50-v107-compression-zstd15-test-only-iso
          run-id: 42371438964
          github-token: ${{ github.token }}
          path: input
      - name: Verify image and examine included media checksums
        run: |
          set -euo pipefail
          printf '%s  %s\n' '7251adb5f673c3964cae4e8518a4fd9fdfc363e9535b9f0fd498bbc554557595' input/candidate.iso | sha256sum -c -
          xorriso -osirrox on -indev input/candidate.iso -extract / evidence/tree >evidence/extract.log 2>&1
          find evidence/tree -type f \( -iname '*md5*' -o -iname '*sha256*' -o -iname '*sums*' \) -print | tee evidence/manifests.txt
          for f in md5sum.txt MD5SUMS SHA256SUMS sha256sum.txt; do
            if [ -f "evidence/tree/$f" ]; then
              echo "CHECKING $f"
              if [[ "$f" == *[mM][dD]5* ]]; then (cd evidence/tree && md5sum -c "$f") | tee "evidence/$f.check"; else (cd evidence/tree && sha256sum -c "$f") | tee "evidence/$f.check"; fi
            fi
          done
      - name: Preserve the audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50-v107-media-integrity-audit
          path: |
            evidence/*.txt
            evidence/*.check
            evidence/*.log
          retention-days: 30
