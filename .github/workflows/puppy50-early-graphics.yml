name: Puppy50 early graphics and live input
on:
  push:
    branches: [puppy50-startup-working-set-20261122]
    paths: ['.github/workflows/puppy50-early-graphics.yml', 'puppy50-boot/early_graphics.py', 'puppy50-boot/wait_firefox_window.c']
permissions:
  actions: read
  contents: read
jobs:
  measure:
    name: ${{ matrix.route }} optical boot
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        route: [ahci, virtio]
    env:
      PYTHONPATH: input/source
      P50_CPU: i3-540-conservative
      P50_ROUTE: ${{ matrix.route }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: input/research
      - uses: actions/checkout@v4
        with:
          ref: 604786a8bce8768ae0cd6bcf11cfc7b07e1825ee
          path: input/source
      - uses: actions/checkout@v4
        with:
          ref: d39a63afe01ed74b03a7dc2405d4cbe27336d839
          path: input/preview
      - name: Install KVM and image tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq -o Acquire::Retries=2
          sudo apt-get install -y --no-install-recommends xorriso zstd lz4 cpio squashfs-tools kmod qemu-system-x86 python3-pil libx11-dev
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          mkdir -p out/boot out/reports build fixture
          lscpu >out/reports/cpu.txt
      - name: Retrieve the published BIOS ISO
        if: matrix.route == 'ahci'
        run: |
          set -euo pipefail
          release=https://github.com/74127418528426leo-del/Test/releases/download/puppy50-direct-bios-preview-20261121
          curl --retry 3 -fsSL "$release/Puppy50_Direct_BIOS_Preview.iso" -o out/original.iso
          echo 'aa074377b00832818bcb1cd45c0166cb1975b6c1b3ad778279fef6132941aaf6  out/original.iso' | sha256sum -c -
      - uses: actions/download-artifact@v4
        if: matrix.route == 'virtio'
        with:
          name: puppy50-virtio-lz4-boot-lab-iso
          run-id: 45034966977
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/original
      - name: Check the experimental VirtIO source
        if: matrix.route == 'virtio'
        run: |
          set -euo pipefail
          mv build/original/candidate.iso out/original.iso
          echo '0d005740bfdc77091f279ae749aabb22e76b39398e8668f73500dfb4d74be0a2  out/original.iso' | sha256sum -c -
      - name: Build the control and both bootable candidates
        run: |
          set -euo pipefail
          scripts=input/research/puppy50-boot
          xorriso -osirrox on -indev out/original.iso \
            -extract /live/filesystem.squashfs build/root.sqfs \
            -extract /live/vmlinuz out/boot/vmlinuz -extract /live/initrd-vm.img out/boot/initrd-vm.img \
            -extract /isolinux/live.cfg out/boot/live.cfg -extract /sha256sum.txt out/boot/sha256sum.txt
          echo '8c1bed5bcd3089f203e8afe1fcedae129af2c87408a57252be24f42adacac913  build/root.sqfs' | sha256sum -c -
          if [[ "$P50_ROUTE" == ahci ]]; then zstd -qdc out/boot/initrd-vm.img >build/source.cpio; else lz4 -qdc out/boot/initrd-vm.img >build/source.cpio; fi
          gcc -O2 -s -D_FORTIFY_SOURCE=2 -Wall -Wextra -Werror "$scripts/wait_firefox_window.c" -lX11 -o build/wait-firefox
          sudo unsquashfs -no-progress -d build/module-source build/root.sqfs usr/lib/modules/6.12.117+deb13-amd64 usr/bin/openbox-session
          if [[ ! -e build/module-source/lib ]]; then sudo ln -s usr/lib build/module-source/lib; fi
          cp build/module-source/usr/bin/openbox-session out/reports/packaged-openbox-session.sh
          for variant in control devices session; do
            mkdir -p "build/guest-$variant"
            (cd "build/guest-$variant" && sudo cpio -idmu --quiet --no-absolute-filenames) <build/source.cpio
            args=()
            if [[ "$variant" != control ]]; then args+=(--modules build/module-source); fi
            if [[ "$variant" == session ]]; then args+=(--session build/module-source/usr/bin/openbox-session --monitor build/wait-firefox); fi
            sudo python3 "$scripts/early_graphics.py" "build/guest-$variant" "${args[@]}"
            for file in init usr/lib/live/boot/9990-main.sh usr/lib/live/boot/9990-misc-helpers.sh; do sudo sh -n "build/guest-$variant/$file"; done
            (cd "build/guest-$variant" && sudo find . -print0 | LC_ALL=C sort -z | sudo cpio --null -o -H newc --quiet) >"build/$variant.cpio"
            if [[ "$P50_ROUTE" == ahci ]]; then zstd -q -T2 -6 "build/$variant.cpio" -o "build/$variant.img"; else lz4 -q -l -1 "build/$variant.cpio" "build/$variant.img"; fi
            python3 "$scripts/boot_latency_lab.py" iso out/original.iso "out/$variant.iso" out/boot "build/$variant.img"
            xorriso -osirrox on -indev "out/$variant.iso" -extract /live/initrd-vm.img "build/$variant.check" >"out/reports/$variant-extract.log" 2>&1
            cmp "build/$variant.img" "build/$variant.check"
          done
          xorriso -osirrox on -indev out/session.iso -extract / build/integrity >out/reports/iso-integrity.log 2>&1
          (cd build/integrity && sha256sum -c --quiet sha256sum.txt)
          sha256sum out/*.iso >out/reports/iso-sha256.txt
      - name: Prepare real Firefox JS and network tests
        run: |
          set -euo pipefail
          python3 input/preview/public_preview/prepare_harness.py --source input/source --preview input/preview/public_preview --retry input/research/v159/verify_real_http_with_retry.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('input/source/web112/early_probe.py')
          s=p.read_text()
          a=s.index("    send_key(monitor, ['ctrl', 'l']")
          b=s.index("    report['early_page_seen_seconds']",a)
          block=s[a:b]
          nav=block[:block.index('    if not wait_for_color')]
          nested=''.join('    '+line for line in nav.splitlines(True))
          focus = (
              "    for attempt in range(1, 3):\n"
              "        report['early_navigation_attempts'] = attempt\n"
              "        qmp(monitor, 'human-monitor-command', {'command-line':'mouse_button 1'})\n"
              "        time.sleep(0.08)\n"
              "        qmp(monitor, 'human-monitor-command', {'command-line':'mouse_button 0'})\n"
          )
          check="        if wait_for_color(monitor, out, LOADED_COLOR, 'early_loaded.png', timeout=4):\n            break\n    else:\n        return report\n"
          assert nav.count("send_key(monitor, ['ret']")==1
          s=s[:a]+focus+nested+check+s[b:]
          compile(s,str(p),'exec')
          p.write_text(s)
          PY
          nohup python3 -u input/source/web112/early_fixture.py --port 8766 >out/reports/fixture-early.log 2>&1 </dev/null &
          python3 -c 'import socket,time; time.sleep(2); [socket.create_connection(("127.0.0.1",p),timeout=5).close() for p in (8766,)]'
      - name: Cold boot and check real keyboard input, RAM migration and browsing
        run: |
          set -euo pipefail
          lab=input/research/puppy50-boot/boot_latency_lab.py
          python3 "$lab" harness input/source/web109/boot_bench_ahci.py out/boot
          sequence=(control1 devices1 session1 session2 devices2 control2 session3)
          fixture_pid=
          trap 'if [[ -n "$fixture_pid" ]]; then kill "$fixture_pid" 2>/dev/null || true; fi' EXIT
          for sample in "${sequence[@]}"; do
            export P50_NONCE="P50-$GITHUB_RUN_ID-TRIAL-${sample^^}"
            mkdir -p "out/$sample"
            python3 -u input/source/web103/fixture_server.py --fixture fixture/unused.mp4 --nonce "$P50_NONCE" --port 8765 >"out/$sample/http-receipts.log" 2>&1 &
            fixture_pid=$!
            python3 - <<'PY'
          import socket
          import time
          for _ in range(100):
              try:
                  socket.create_connection(('127.0.0.1', 8765), timeout=0.1).close()
                  break
              except OSError:
                  time.sleep(0.05)
          else:
              raise RuntimeError('Per-boot HTTP receiver did not start')
          PY
            series=${sample%[0-9]}
            iso="out/$series.iso"
            driver=input/source/web109/boot_bench_lab_bios.py
            if [[ "$P50_ROUTE" == virtio ]]; then driver=input/source/web109/boot_bench_lab_virtio.py; fi
            python3 - "$iso" <<'PY'
          import os
          import sys
          with open(sys.argv[1], 'rb') as f:
              os.posix_fadvise(f.fileno(), 0, 0, os.POSIX_FADV_DONTNEED)
          PY
            rc=0
            python3 -u "$driver" \
              --iso "$iso" --out "out/$sample" --mode online --allow-no-startup-probe \
              --ram 3072 --seconds 32 --cpu-model "$P50_CPU" --emulate-acer-id \
              --firmware bios --media usb --bandwidth 0 --wait-ram-ready || rc=$?
            printf '%s\n' "$rc" >"out/$sample/exit-status"
            kill "$fixture_pid"
            wait "$fixture_pid" || true
            fixture_pid=
          done
          python3 - "$P50_ROUTE" "$GITHUB_RUN_ID" "${sequence[@]}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, 'input/research/puppy50-boot')
          import boot_latency_lab as lab
          report = Path('out/reports/comparison.json')
          lab.BASELINE_HASH = lab.sha256(Path('out/control.iso'))
          lab.summarize(Path('out'), sys.argv[1], sys.argv[2], sys.argv[3:])
          data = json.loads(report.read_text())
          data['host_cache_policy'] = 'Fresh KVM on every sample; POSIX_FADV_DONTNEED for the selected ISO immediately before launch.'
          for name, row in data['samples'].items():
              text = (Path('out') / name / 'serial.log').read_text(errors='replace')
              if not name.startswith('control'):
                  for mark in ('P50_BIOS_EARLY_DRM ', 'P50_BIOS_LOOP_READY '):
                      if mark not in text:
                          raise RuntimeError(f'{name} lacks {mark}')
              if name.startswith('session'):
                  for mark in ('P50_WM_OBSERVED p50-openbox-ready ', 'P50_WM_OBSERVED p50-first-window '):
                      if mark not in text:
                          raise RuntimeError(f'{name} lacks {mark}')
          report.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Preserve boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puppy50-graphics-${{ matrix.route }}-evidence
          path: |
            out/reports/
            out/control*/
            out/devices*/
            out/session*/
          retention-days: 21
      - name: Save exact working images for repeat testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: puppy50-graphics-${{ matrix.route }}-images
          path: |
            out/devices.iso
            out/session.iso
          retention-days: 7
          compression-level: 0
