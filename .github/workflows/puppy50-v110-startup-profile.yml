name: Puppy50 v110 startup critical-chain profile
on:
  push:
    branches: [puppy50-v110-boot-research]
    paths: [.github/workflows/puppy50-v110-startup-profile.yml]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install build and VM tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso zstd cpio qemu-system-x86 python3-pil
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          mkdir -p input out/{main,tree,rechecked,reports} fixture
          lscpu >out/reports/host-cpu.txt
      - name: Fetch and inspect the exact v109 image
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error -o input/v109.iso 'https://github.com/74127418528426leo-del/Test/releases/download/puppy50-v109-faststart-ram-experimental/Puppy50_v109_FastStart_RAM_EXPERIMENTAL.iso'
          printf '%s  %s\n' 'e6b341ae3a272bb6bfa063814b2b61a14ba9dadd5f41137a8203f651120671da' input/v109.iso | sha256sum -c -
          xorriso -osirrox on -indev input/v109.iso -extract /live/initrd.img out/original.initrd -extract /live/filesystem.squashfs out/base.squashfs >out/reports/extract.log 2>&1
          head -c 45312000 out/original.initrd >out/early-prefix
          tail -c +45312001 out/original.initrd | zstd -q -dc >out/main.cpio
          (cd out/main && sudo cpio -idm --quiet --no-absolute-filenames <../main.cpio)
          ls -lh out/original.initrd out/early-prefix out/main.cpio out/base.squashfs >out/reports/component-sizes.txt
          (cd out/main && sudo du -x -h -d 3 . | sort -hr | head -80) >out/reports/initramfs-largest-paths.txt
          cpio -itv <out/early-prefix >out/reports/early-prefix-first-archive.txt 2>out/reports/early-prefix-cpio.log || true
          sha256sum out/original.initrd out/early-prefix out/main.cpio out/base.squashfs >out/reports/input-hashes.txt
      - name: Add a delayed diagnostic reporter to a test-only initramfs
        run: |
          set -euo pipefail
          sudo python3 - <<'PY'
          from pathlib import Path
          p = Path('out/main/usr/lib/p50-stage/p50-migrate.sh')
          s = p.read_text()
          marker = '"$B" sleep 8\nemit P50_STAGE_START\n'
          assert s.count(marker) == 1
          inject = r'''(
              "$B" sleep 35
              {
                  printf '\nP50_V110_PROFILE_BEGIN\n'
                  printf 'UPTIME '; cat /proc/uptime
                  printf '\n--- systemd-analyze time ---\n'; systemd-analyze time || true
                  printf '\n--- lightdm critical chain ---\n'; systemd-analyze critical-chain lightdm.service || true
                  printf '\n--- graphical critical chain ---\n'; systemd-analyze critical-chain graphical.target || true
                  printf '\n--- systemd blame ---\n'; systemd-analyze blame || true
                  printf '\n--- live configuration and display manager journal ---\n'
                  journalctl -b -u live-config.service -u lightdm.service --no-pager -o short-monotonic || true
                  printf '\n--- relevant unit ordering ---\n'
                  systemctl show -p After -p Before -p Wants -p Requires -p ExecStartPre lightdm.service live-config.service || true
                  printf '\n--- USB scan delay ---\n'; cat /sys/module/usb_storage/parameters/delay_use || true
                  printf '\nP50_V110_PROFILE_END\n'
              } >/dev/ttyS0 2>&1
          ) &
          '''
          p.write_text(s.replace(marker, inject + marker, 1))
          PY
          sudo sh -n out/main/usr/lib/p50-stage/p50-migrate.sh
          (cd out/main && sudo find . -print0 | LC_ALL=C sort -z | sudo cpio -o --null -H newc --quiet) >out/modified.cpio
          zstd -q -3 -T2 -o out/modified.cpio.zst out/modified.cpio
          cat out/early-prefix out/modified.cpio.zst >out/profile.initrd
          cmp -n 45312000 out/original.initrd out/profile.initrd
          xorriso -indev input/v109.iso -outdev out/stage.iso -map out/profile.initrd /live/initrd.img -map out/profile.initrd /live/initrd.img-6.12.115+deb13.1-amd64 -boot_image any replay -commit -end >out/reports/stage.log 2>&1
          xorriso -osirrox on -indev out/stage.iso -extract / out/tree >out/reports/tree.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re
          root = Path('out/tree').resolve()
          lines, seen = [], set()
          for line in (root / 'sha256sum.txt').read_text().splitlines():
              m = re.fullmatch(r'([0-9a-fA-F]{64})( [ *])(.*)', line)
              assert m, repr(line)
              name = m.group(3)
              assert name.startswith('./') and name not in seen
              seen.add(name)
              target = (root / name).resolve(strict=True)
              target.relative_to(root)
              assert target.is_file() and name != './sha256sum.txt'
              h = hashlib.sha256()
              with target.open('rb') as f:
                  for block in iter(lambda: f.read(1048576), b''):
                      h.update(block)
              lines.append(h.hexdigest() + m.group(2) + name)
          assert len(lines) == 292
          Path('out/sha256sum.txt').write_text('\n'.join(lines) + '\n')
          PY
          xorriso -indev out/stage.iso -outdev out/profile.iso -map out/sha256sum.txt /sha256sum.txt -boot_image any replay -commit -end >out/reports/repack.log 2>&1
          xorriso -osirrox on -indev out/profile.iso -extract / out/rechecked >out/reports/recheck.log 2>&1
          cmp out/base.squashfs out/rechecked/live/filesystem.squashfs
          cmp out/profile.initrd out/rechecked/live/initrd.img
          (cd out/rechecked && sha256sum -c sha256sum.txt) >out/reports/media-checksums.txt
          sha256sum out/profile.iso >out/reports/profile-iso-sha256.txt
      - name: Start local post-removal test page
        env:
          P50_NONCE: P50-${{ github.run_id }}
        run: |
          set -euo pipefail
          nohup python3 -u web103/fixture_server.py --fixture fixture/unused.mp4 --nonce "$P50_NONCE" --port 8765 >out/reports/fixture.log 2>&1 </dev/null &
          python3 -c 'import socket,time; time.sleep(2); socket.create_connection(("127.0.0.1",8765),timeout=5).close()'
      - name: Boot diagnostic image and collect its startup chain
        env:
          P50_NONCE: P50-${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 -u web109/boot_bench_staged.py --iso out/profile.iso --out out/qemu --mode online --allow-no-startup-probe --wait-ram-ready --ram 3072 --seconds 210 --cpu-model i3-540-conservative --emulate-acer-id --media usb --bandwidth 31457280
          grep -F "GET /after.html?nonce=$P50_NONCE" out/reports/fixture.log | grep -F ' 200 '
          tr -d '\r' <out/qemu/serial.log >out/reports/serial-clean.log
          grep -F 'P50_V110_PROFILE_BEGIN' out/reports/serial-clean.log
          grep -F 'P50_V110_PROFILE_END' out/reports/serial-clean.log
          sed -n '/P50_V110_PROFILE_BEGIN/,/P50_V110_PROFILE_END/p' out/reports/serial-clean.log | tee out/reports/guest-profile.txt
      - name: Preserve diagnostic logs and actual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Puppy50-v110-startup-profile-evidence
          path: |
            out/reports/
            out/qemu/
          if-no-files-found: warn
          retention-days: 30
